name: Publikacja na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # >>> PENDING-UPLOAD (A): wymagane przez krok „Usuń artefakty…" z regionu (B).
  #     Wgraj regiony (A), (B) i (C) RAZEM — bez tego uprawnienia sprzątanie
  #     dostanie 403 i publikacja padnie.
  actions: write
  # <<< PENDING-UPLOAD (A)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testy przed publikacją (równoległy runner, ADR 0019)
        run: node tools/run-tests.mjs all
      - name: Build
        run: node tools/build.mjs --out dist/index.html
      - uses: actions/configure-pages@v5
      # >>> PENDING-UPLOAD (B): sprzątanie artefaktów poprzednich prób.
      #     Run 38424779872 (push 7bd1fcf) padł, choć workflow nie zmieniał się
      #     od miesięcy — najpierw FLAKE GitHuba, potem kumulacja po re-runach:
      #       1) próba 1: upload skończył się 15:50:09, `deploy-pages` ruszył
      #          15:50:09 i zaraz zgłosił „No artifacts named \"github-pages\"
      #          were found" — świeżo wgrany artefakt nie był jeszcze widoczny
      #          w API (artefakt tej próby istnieje, created_at 15:50:09);
      #       2) próby 2–4: każdy RE-RUN dokłada kolejny artefakt `github-pages`
      #          w TYM SAMYM runie, a `deploy-pages` wymaga DOKŁADNIE jednego
      #          („Multiple artifacts named \"github-pages\" … count is 4").
      #     Sprzątanie MUSI być PRZED uploadem — inaczej skasowałoby też świeży
      #     artefakt tej próby.
      - name: Usuń artefakty `github-pages` z poprzednich prób tego runu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          run="$GITHUB_RUN_ID"
          artefakty=$(gh api "repos/$repo/actions/runs/$run/artifacts" --paginate \
            --jq '.artifacts[] | select(.name == "github-pages") | .id')
          if [ -z "$artefakty" ]; then
            echo "Brak artefaktów github-pages z poprzednich prób — nic do sprzątania."
          else
            for id in $artefakty; do
              echo "Kasuję artefakt $id (poprzednia próba tego runu)"
              gh api --method DELETE "repos/$repo/actions/artifacts/$id" > /dev/null
            done
          fi
      # <<< PENDING-UPLOAD (B)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # >>> PENDING-UPLOAD (C): czekanie na widoczność świeżego artefaktu.
      #     Artefakt po uploadzie bywa chwilę niewidoczny w API (próba 1 wyżej);
      #     `deploy-pages` nie ponawia tego odczytu, więc czekamy na TEJ SAMEJ
      #     liście, którą on czyta — maks. 20 × 3 s.
      - name: Poczekaj, aż świeży artefakt `github-pages` będzie widoczny dla API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          run="$GITHUB_RUN_ID"
          for proba in $(seq 1 20); do
            liczba=$(gh api "repos/$repo/actions/runs/$run/artifacts" --paginate \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$liczba" -eq 1 ]; then
              echo "Artefakt widoczny w API (próba $proba) — start publikacji."
              exit 0
            fi
            echo "Próba $proba/20: artefaktów github-pages = $liczba; czekam 3 s"
            sleep 3
          done
          echo "::error::Świeży artefakt github-pages nie pojawił się w API w ciągu 60 s"
          exit 1
      # <<< PENDING-UPLOAD (C)
      - id: deployment
        uses: actions/deploy-pages@v4
