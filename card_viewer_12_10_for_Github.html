  const sess = allSessions.find(s => s.id === sessionId);
  if (!sess) {
    console.error("Nie znaleziono sesji o ID:", sessionId);
    return;
  }
  
  const oldOverlay = document.getElementById('dynamic-session-preview');
  if (oldOverlay) oldOverlay.remove();

  const overlay = document.createElement('div');
  overlay.id = 'dynamic-session-preview';
  overlay.style.cssText = "position:fixed; inset:0; background:rgba(255, 255, 255, 0.98); z-index:9999; display:flex; flex-direction:column; padding:20px; overflow-y:auto; backdrop-filter:blur(10px); cursor:default;";
  
  const header = document.createElement('div');
  header.style.cssText = "display:flex; justify-content:space-between; align-items:center; max-width:800px; width:100%; margin:0 auto 20px; border-bottom:1px solid #d1d5db; padding-bottom:10px; flex-shrink:0;";
  
  const title = document.createElement('h3');
  title.style.cssText = "font-family:var(--font-ui); color:#111827; margin:0;";
  let sessionModel = "Nieznany AI";
  if (sess.turns && sess.turns.length > 0) {
      const validTurn = sess.turns.find(t => t.model && t.model !== "system") || sess.turns[0];
      const modelObj = AI_MODELS.find(m => m.id === validTurn.model);
      sessionModel = modelObj ? modelObj.name : validTurn.model;
  }
  title.textContent = `Podgląd Sesji: ${new Date(sess.date).toLocaleString()} (${sessionModel})`;
  
  const closeBtn = document.createElement('button');
  closeBtn.style.cssText = "background:transparent; border:1px solid #6b7280; color:#111827; border-radius:50%; width:32px; height:32px; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; transition:0.2s;";
  closeBtn.textContent = "✕";
  closeBtn.onmouseover = () => { closeBtn.style.background='#ffe4e6'; closeBtn.style.color='#e11d48'; closeBtn.style.borderColor='#e11d48'; };
  closeBtn.onmouseout = () => { closeBtn.style.background='transparent'; closeBtn.style.color='#111827'; closeBtn.style.borderColor='#6b7280'; };
  closeBtn.onclick = () => {
    overlay.remove();
    // Jeśli flaga odświeżania jest aktywna, wyrenderuj Setup ponownie
    if (window.refreshMangaSetup) {
      window.refreshMangaSetup = false;
      renderMangaDiscussion();
    }
  };

  // Zamykanie po kliknięciu w puste tło (poza kontentem)
  overlay.onclick = (e) => {
    if (e.target === overlay) {
      closeBtn.onclick();
    }
  };

  header.appendChild(title);
  header.appendChild(closeBtn);
  overlay.appendChild(header);
  
  const content = document.createElement('div');
  content.style.cssText = "max-width:800px; width:100%; margin:0 auto; padding-bottom:80px;";
  
  sess.turns.forEach(t => {
      if (t.agent === "TALE_NARRATOR") {
          const taleBlock = document.createElement("div");
          taleBlock.style.cssText = "font-family: var(--font); font-size: 20px; line-height: 1.6; color: #111827; margin-bottom: 20px; background: #ecfeff; padding: 20px; border-radius: 8px; border-left: 4px solid #06b6d4; border: 1px solid #cffafe;";
          taleBlock.innerHTML = `<div style="font-size:12px; font-family:var(--font-ui); color:#0891b2; margin-bottom:10px; font-weight:bold;">FRAGMENT WHAT-IF:</div>` + t.text.replace(/\n/g, '<br>');
          content.appendChild(taleBlock);
      } else {
          const msg = document.createElement("div");
          msg.style.cssText = "margin-bottom: 20px; padding: 15px; border-radius: 8px; background: #f3f4f6; border: 1px solid #e5e7eb; border-left: 4px solid #9ca3af;";
          const isSystem = t.agent === "STUDIO" || t.agent === "SYSTEM";
          msg.innerHTML = `<div style="font-family:var(--font-ui); font-size:14px; font-weight:bold; margin-bottom:5px; color:${isSystem ? '#6b7280' : '#7e22ce'};"><span>${t.agent}</span></div>
          <div style="font-family:'Inter',sans-serif; font-size:20px; line-height:1.5; font-weight:400; color:${isSystem ? '#6b7280' : '#111827'}; font-style:${isSystem ? 'italic' : 'normal'};">${t.text.replace(/\n/g, '<br>')}</div>`;
          content.appendChild(msg);
      }
  });
  
  overlay.appendChild(content);
  document.body.appendChild(overlay);
}

async function renderMangaDiscussion() {
  const container = document.getElementById('manga-overlay-content');
  
  // Reset pamięci scrolla, jeśli odpalamy nową sesję (żeby zaczynało od góry)
  if (mangaDiscState.phase === 'setup') {
      mangaDiscState.lastScroll = 0;
      mangaDiscState.lastWasBottom = false;
  } else if (container.querySelector('.radio-msg') || container.querySelector('.team-loading')) {
      // Zapisujemy pozycję tylko gdy patrzymy na czat lub loader.
      // Sprawdzamy czy użytkownik czyta "na samym dole", czy przewinął w górę
      mangaDiscState.lastScroll = container.scrollTop;
      mangaDiscState.lastWasBottom = (container.scrollHeight - container.scrollTop - container.clientHeight) < 50;
  }
  
  container.innerHTML = ""; 

  const isTaleMode = mangaDiscState.mode === 'tale';

  if (mangaDiscState.phase === 'setup') {
    let existingSessions =[];
    
    // Jeśli mamy zbuforowane dane sesji dla tego widoku, omijamy pobieranie (zapobiega przeładowywaniu ekranu)
    if (mangaDiscState.cachedSetupSessions) {
      existingSessions = mangaDiscState.cachedSetupSessions;
    } else {
      container.innerHTML = `<div class="team-loading" style="text-align:center;">Sprawdzanie bazy zapisów...</div>`;
      if (MANGA_DISC_API_URL.startsWith("http")) {
        try {
          const resp = await fetch(MANGA_DISC_API_URL);
          const allEntries = await resp.json();
          const sessionsMap = {};
          
          allEntries.forEach(e => {
            if (String(e.chapterId).trim() !== String(mangaDiscState.manga.id).trim()) return;
            const sId = String(e.sessionId).trim();
            if(!sessionsMap[sId]) sessionsMap[sId] = { id: sId, date: e.timestamp, turns: [] };
            sessionsMap[sId].turns.push(e);
          });
          
          existingSessions = Object.values(sessionsMap).filter(sess => {
             const hasTale = sess.turns.some(t => t.agent === "TALE_NARRATOR");
             const hasRadio = sess.turns.some(t => t.agent !== "TALE_NARRATOR" && t.agent !== "SYSTEM" && t.agent !== "STUDIO");
             
             if (isTaleMode) return hasTale && !hasRadio;
             return true;
          }).sort((a,b) => new Date(b.date) - new Date(a.date));
        } catch(e) { console.error("Błąd bazy:", e); }
      }
      mangaDiscState.cachedSetupSessions = existingSessions;
    }

    container.innerHTML = ""; // Czyści ewentualny loader
    const titleColor = isTaleMode ? "#0891b2" : "#9333ea";
    const titleText = isTaleMode ? "✍️ KONTYNUACJA (WHAT-IF)" : "🎙️ STUDIO RADIOWE";
    
    container.innerHTML = `<h3 style="color:${titleColor}; font-family:var(--font-ui); text-align:center;">${titleText}</h3>`;
    const box = document.createElement("div"); box.style.maxWidth = "500px"; box.style.margin = "0 auto";

    if (existingSessions.length > 0) {
      // Zapisujemy sesje do pamięci podręcznej przeglądarki, aby można je było łatwo odczytać
      window.sessionStorage.setItem('manga_sessions_cache', JSON.stringify(existingSessions));

      box.insertAdjacentHTML('beforeend', `<div style="font-size:12px; color:var(--muted); margin-bottom:10px;">KONTYNUUJ POPRZEDNIĄ SESJĘ:</div>`);
      existingSessions.forEach(sess => {
        const hasRadio = sess.turns.some(t => t.agent !== "TALE_NARRATOR" && t.agent !== "SYSTEM" && t.agent !== "STUDIO");
        const badgeText = hasRadio ? "STUDIO/HYBRYDA" : "WHAT-IF";
        
        const rowDiv = document.createElement("div");
        rowDiv.className = "radio-setup-row"; 
        rowDiv.style.cssText = "width: 100%; padding: 0; display: flex; overflow: hidden; align-items: stretch; cursor: pointer;";
        
        // Nowe, czyste przypięcie zdarzenia (zabezpieczone przed zgubieniem zmiennych)
        rowDiv.onclick = () => {
          mangaDiscState.sessionId = sess.id;
          mangaDiscState.history = JSON.parse(window.sessionStorage.getItem('manga_sessions_cache')).find(s => s.id === sess.id).turns.map(t => ({ name: t.agent, text: t.text, model: t.model }));
          
          // REKONSTRUKCJA KONTEKSTU (KART/ROZDZIAŁÓW) PO WZNOWIENIU SESJI
          mangaDiscState.chapters = [mangaDiscState.manga]; // Zaczynamy od karty/rozdziału bazowego
          mangaDiscState.history.forEach(h => {
              if (h.name === "SYSTEM" || h.name === "STUDIO") {
                  // Bardziej elastyczny Regex (łapie "Rozdział 2", "Rozdziału 2" itd.)
                  if (mangaDiscState.contextType === 'manga' && h.text.match(/Rozdzia[łl]/i)) {
                      const match = h.text.match(/Rozdzia[łl]\w*\s+(\d+)/i);
                      if (match) {
                          const chapNum = parseInt(match[1]);
                          const chap = mangaData.find(m => m.mangaTitle === mangaDiscState.manga.mangaTitle && m.chapterNum === chapNum);
                          if (chap && !mangaDiscState.chapters.some(c => c.chapterNum === chapNum)) {
                              mangaDiscState.chapters.push(chap);
                          }
                      }
                  } else if (mangaDiscState.contextType === 'card' && h.text.match(/Kart[ęe]/i)) {
                      // Łapie "Kartę X"
                      const match = h.text.match(/Kart[ęe]\s+(.*?)(?:\.|\*|$)/i);
                      if (match) {
                          const cardName = match[1].trim();
                          const selCard = cards.find(c => c.Nazwa === cardName && c.Plan === mangaDiscState.basePlan && (c.isLOR || c.isStory));
                          if (selCard && !mangaDiscState.chapters.some(c => c.id === selCard.ID)) {
                              mangaDiscState.chapters.push({
                                  id: selCard.ID,
                                  imageId: selCard.Ilustracja,
                                  mangaTitle: selCard.Nazwa,
                                  analiza: selCard.LorText || selCard.Narracja || "Brak opisu",
                                  chapterNum: mangaDiscState.chapters.length + 1
                              });
                          }
                      }
                  }
              }
          });

          if (!isTaleMode) {
            const uniqueNames =[...new Set(mangaDiscState.history.filter(t => t.name !== "SYSTEM" && t.name !== "STUDIO" && t.name !== "TALE_NARRATOR" && t.name !== "HOST").map(t => t.name))];
            if (uniqueNames.length > 0) {
              mangaDiscState.numDiscussants = uniqueNames.length;
              mangaDiscState.discussants = uniqueNames.map(name => {
                  const lastTurn = [...mangaDiscState.history].reverse().find(t => t.name === name);
                  return { name, lastModelId: lastTurn ? lastTurn.model : null };
              });
              
              // Zamiast liczyć wszystkie wypowiedzi, szukamy kto mówił jako OSTATNI
              const validTurns = mangaDiscState.history.filter(h => h.name !== "SYSTEM" && h.name !== "STUDIO" && h.name !== "TALE_NARRATOR" && h.name !== "HOST");
              if (validTurns.length > 0) {
                  const lastSpeakerName = validTurns[validTurns.length - 1].name;
                  const lastSpeakerIndex = mangaDiscState.discussants.findIndex(d => d.name === lastSpeakerName);
                  // Ustawiamy wskaźnik na następną osobę w tablicy
                  mangaDiscState.currentIdx = (lastSpeakerIndex + 1) % mangaDiscState.numDiscussants;
              } else {
                  mangaDiscState.currentIdx = 0;
              }
              
            } else {
              mangaDiscState.numDiscussants = 2;
              mangaDiscState.discussants = [{ name: mangaDiscNames[0] }, { name: mangaDiscNames[1] }];
              mangaDiscState.currentIdx = 0;
            }
          } else {
            mangaDiscState.numDiscussants = 1;
            mangaDiscState.discussants =[{ name: "TALE_NARRATOR" }];
            mangaDiscState.currentIdx = 0;
          }
          
          mangaDiscState.phase = 'chat';
          renderMangaDiscussion();
        };
        
        rowDiv.innerHTML = `
          <div style="flex:1; padding:12px; display:flex; flex-direction:column; justify-content:center;">
            <b style="color:${titleColor}; font-size:14px;">Sesja [${badgeText}] - ${new Date(sess.date).toLocaleString()}</b>
            <small style="color:var(--muted); font-size:11px; margin-top:2px;">Wygenerowanych partii: ${sess.turns.length}</small>
          </div>
          <div style="width: 50px; background: rgba(0,0,0,0.03); border-left: 1px solid var(--border); cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; transition: 0.2s;"
                   title="Podgląd sesji"
                   onmouseover="this.style.background='rgba(0,0,0,0.08)'"
                   onmouseout="this.style.background='rgba(0,0,0,0.03)'"
                   onclick="event.stopPropagation(); window.refreshMangaSetup=false; showSessionPreview('${sess.id}');">
                👁️
              </div>
        `;
        
        box.appendChild(rowDiv);
      });
      box.insertAdjacentHTML('beforeend', `<hr style="margin:20px 0; border:none; border-top:1px dashed var(--border);">`);
    }

    box.insertAdjacentHTML('beforeend', `<div style="font-size:12px; color:var(--muted); margin-bottom:10px;">ROZPOCZNIJ NOWĄ SESJĘ:</div>`);
    
    if (!isTaleMode) {
        const numRow = document.createElement("div");
        numRow.style.marginBottom = "20px"; numRow.innerHTML = `<span style="margin-right:10px;">Ilość dyskutantów:</span>`;
        [2,3,4].forEach(n => {
          const b = document.createElement("button"); b.className = "sub-filter-btn"; b.style.margin = "0 5px"; b.textContent = n;
          if (mangaDiscState.numDiscussants === n) b.classList.add("active");
          b.onclick = () => { mangaDiscState.numDiscussants = n; renderMangaDiscussion(); };
          numRow.appendChild(b);
        });
        box.appendChild(numRow);

        mangaDiscState.discussants = [];
        const usedNames = new Set();
        for (let i=0; i < mangaDiscState.numDiscussants; i++) {
          let name = ""; do { name = mangaDiscNames[Math.floor(Math.random()*mangaDiscNames.length)]; } while(usedNames.has(name));
          usedNames.add(name);
          mangaDiscState.discussants.push({ name });
          const sRow = document.createElement("div"); sRow.className = "radio-setup-row";
          sRow.innerHTML = `<div class="radio-setup-num">${i+1}</div><div style="font-weight:bold; color:#9333ea;">${name}</div>`;
          box.appendChild(sRow);
        }
    } else {
        mangaDiscState.numDiscussants = 1;
        mangaDiscState.discussants = [{ name: "TALE_NARRATOR" }];
    }

    const firstModelRow = document.createElement("div");
    firstModelRow.style.marginTop = "20px";
    firstModelRow.innerHTML = `<div style="font-size:11px; color:var(--muted); text-align:center; margin-bottom:5px; font-family:var(--font-ui);">MODEL GENERUJĄCY:</div>`;
    const mSel = document.createElement("select");
    mSel.className = "filter-select"; mSel.style.width = "100%"; mSel.id = "radio-first-model";
    AI_MODELS.forEach(m => mSel.add(new Option(m.name, m.id)));
    mSel.selectedIndex = 0;
    firstModelRow.appendChild(mSel);
    box.appendChild(firstModelRow);

    const startBtn = document.createElement("button");
    startBtn.className = "battle-btn";
    startBtn.style.width = "100%"; startBtn.style.marginTop = "15px";
    startBtn.style.background = isTaleMode ? "#cffafe" : "";
    startBtn.style.borderColor = isTaleMode ? "#0891b2" : "";
    startBtn.style.color = isTaleMode ? "#0891b2" : "";
    startBtn.textContent = isTaleMode ? "GENERUJ PIERWSZY FRAGMENT" : "ROZPOCZNIJ TRANSMISJĘ";
    
    startBtn.onclick = () => {
      const chosenFirstModel = document.getElementById('radio-first-model').value;
      mangaDiscState.selectedModel = chosenFirstModel;
      mangaDiscState.sessionId = "sess_" + Date.now();
      
      if(mangaDiscState.discussants.length > 0) {
        mangaDiscState.discussants[0].lastModelId = chosenFirstModel;
      }

      mangaDiscState.phase = 'chat';
      mangaDiscState.currentIdx = 0;
      generateMangaDiscussionStep();
    };
    box.appendChild(startBtn);
    container.appendChild(box);

  } else if (mangaDiscState.phase === 'error') {
    container.innerHTML = `
      <div style="padding:20px; max-width:600px; margin:0 auto;">
        <h3 style="color:#e11d48; font-family:var(--font-ui); margin-bottom:15px; text-align:center;">BŁĄD GENEROWANIA</h3>
        <div style="background:#ffe4e6; border:1px solid #fda4af; padding:15px; border-radius:8px; font-family:monospace; font-size:14px; margin-bottom:20px; white-space:pre-wrap; color:#9f1239;">${mangaDiscState.errorMsg}</div>
        <button class="battle-btn" style="width:100%; background:#fecdd3; color:#e11d48; border-color:#e11d48;" onclick="mangaDiscState.phase='${mangaDiscState.prevPhase}'; renderMangaDiscussion();">WRÓĆ</button>
      </div>
    `;
  } else {
    // CHAT / STORY PHASE
    const chatWrapper = document.createElement("div");
    chatWrapper.style.maxWidth = "800px"; chatWrapper.style.margin = "0 auto";

    // ZAWSZE wyświetlamy pierwszy materiał źródłowy na samej górze (przed historią), 
    // nawet po wznowieniu sesji, żebyśmy wiedzieli o czym jest mowa.
    if (mangaDiscState.chapters.length > 0) {
      const firstChap = mangaDiscState.chapters[0];
      const sourceBox = document.createElement("div");
      
      let contentHtml = getMangaVisualHTML(firstChap);
      
      if (mangaDiscState.contextType === 'manga' && firstChap.analiza) {
          sourceBox.style.cssText = "margin-bottom: 25px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--bg); box-shadow: 0 4px 15px rgba(0,0,0,0.05);";
          contentHtml += `<div style="padding: 20px; font-size: 16px; background: #fafafa; border-top: 1px solid var(--border); color: #111;">` + 
                         `<div style="font-family: var(--font-ui); color: #a855f7; font-size: 14px; font-weight: bold; margin-bottom: 15px;">📄 MATERIAŁ ŹRÓDŁOWY: ${firstChap.mangaTitle} - Rozdz. ${firstChap.chapterNum}</div>` +
                         parseMangaTextToHTML(firstChap.analiza) + 
                         `</div>`;
      } else {
          // Dla kart Lore i innych - wyświetlamy tylko obrazek bez obramowań i tekstu
          sourceBox.style.cssText = "margin-bottom: 25px;";
      }
      sourceBox.innerHTML = contentHtml;
      chatWrapper.appendChild(sourceBox);
    }

    mangaDiscState.history.forEach((h, i) => {
      if (h.name === "TALE_NARRATOR") {
          const taleBlock = document.createElement("div");
          taleBlock.style.cssText = "font-family: var(--font); font-size: 20px; line-height: 1.6; color: #111827; margin-bottom: 20px; background: #ecfeff; padding: 20px; border-radius: 8px; border-left: 4px solid #06b6d4; border: 1px solid #cffafe;";
          taleBlock.innerHTML = `<div style="font-size:12px; font-family:var(--font-ui); color:#0891b2; margin-bottom:10px; font-weight:bold;">FRAGMENT WHAT-IF:</div>` + h.text.replace(/\n/g, '<br>');
          chatWrapper.appendChild(taleBlock);
      } else {
          const msg = document.createElement("div");
          msg.className = "radio-msg";
          const isSystem = h.name === "STUDIO" || h.name === "SYSTEM";
          const isHost = h.name === "HOST";
          
          let nameStyle = isSystem ? 'color:var(--muted)' : (isHost ? 'color:#ca8a04' : '');
          let textStyle = isSystem ? 'font-size:14px; font-style:italic; color:var(--muted)' : (isHost ? 'font-size:16px; font-weight:bold; color:#854d0e; background:#fef08a33; padding:10px; border-radius:6px; border:1px dashed #ca8a04;' : '');
          
          let aiModelName = "";
          if (!isSystem && !isHost && h.model) {
              const mObj = AI_MODELS.find(m => m.id === h.model);
              const mName = mObj ? mObj.name : h.model;
              aiModelName = ` <span style="font-size:10px; color:var(--muted); font-weight:normal;">(${mName})</span>`;
          }
          let displayName = isHost ? '🎙️ PROWADZĄCY / WYDARZENIE' : (h.name + aiModelName);

          msg.innerHTML = `<div class="radio-name" style="${nameStyle}"><span>${displayName}</span></div>
          <div class="radio-text" style="${textStyle}">${h.text.replace(/\n/g, '<br>')}</div>`;
          
          // Żeby wyróżnić cały kontener HOSTA:
          if (isHost) {
              msg.style.borderLeftColor = "#ca8a04";
              msg.style.backgroundColor = "#fefce8";
          }
          
          chatWrapper.appendChild(msg);
          
          if (isSystem && h.text.match(/Rozdzia[łl]/i)) {
             const match = h.text.match(/Rozdzia[łl]\w*\s+(\d+)/i);
             if (match) {
                const chapNum = parseInt(match[1]);
                // Nie dublujemy pierwszego rozdziału, bo wyrenderowaliśmy go na samej górze
                if (!mangaDiscState.chapters[0] || chapNum !== mangaDiscState.chapters[0].chapterNum) {
                    const chap = mangaDiscState.chapters.find(c => c.chapterNum === chapNum);
                    if (chap) {
                      const sourceBox = document.createElement("div");
                      sourceBox.style.cssText = "margin-bottom: 25px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--bg); box-shadow: 0 4px 15px rgba(0,0,0,0.05);";
                      
                      let contentHtml = getMangaVisualHTML(chap);
                      if (mangaDiscState.contextType === 'manga' && chap.analiza) {
                          contentHtml += `<div style="padding: 20px; font-size: 16px; background: #fafafa; border-top: 1px solid var(--border); color: #111;">` + 
                                         `<div style="font-family: var(--font-ui); color: #a855f7; font-size: 14px; font-weight: bold; margin-bottom: 15px;">📄 ANALIZA NOWEGO ROZDZIAŁU: ${chap.mangaTitle} - Rozdz. ${chap.chapterNum}</div>` +
                                         parseMangaTextToHTML(chap.analiza) + 
                                         `</div>`;
                      }
                      sourceBox.innerHTML = contentHtml;
                      chatWrapper.appendChild(sourceBox);
                    }
                }
             }
          }
          if (isSystem && h.text.match(/Kart[ęe]/i)) {
             const match = h.text.match(/Kart[ęe]\s+(.*?)(?:\.|\*|$)/i);
             if (match) {
                const cardName = match[1].trim();
                if (!mangaDiscState.chapters[0] || cardName !== mangaDiscState.chapters[0].mangaTitle) {
                    const chap = mangaDiscState.chapters.find(c => c.mangaTitle === cardName);
                    if (chap) {
                      // Dla kart dorzucanych w locie renderujemy tylko sam obrazek tak, jak dla pierwszego materiału
                      const imgDiv = document.createElement("div");
                      imgDiv.style.marginBottom = "25px";
                      imgDiv.innerHTML = getMangaVisualHTML(chap);
                      chatWrapper.appendChild(imgDiv);
                    }
                }
             }
          }
      }
    });

    if (mangaDiscState.phase !== 'loading') {
      const actionBox = document.createElement("div");
      const borderColor = isTaleMode ? "#0891b2" : "#9333ea";
      actionBox.style.marginTop = "30px"; actionBox.style.padding = "20px"; actionBox.style.border = `1px solid ${borderColor}`; actionBox.style.borderRadius = "8px";
      
      const nextAgent = mangaDiscState.discussants[mangaDiscState.currentIdx % mangaDiscState.numDiscussants];
      
      actionBox.innerHTML = `<div style="text-align:center; margin-bottom:15px; font-family:var(--font-ui); color:var(--muted);">
        ${isTaleMode ? `MODEL GENERUJĄCY CIĄG DALSZY:` : `KOLEJNY KOMENTARZ: <b style="color:#9333ea">${nextAgent.name}</b>`}
      </div>`;
      
      const mSel = document.createElement("select");
      mSel.className = "filter-select"; mSel.style.width = "100%"; mSel.id = "radio-next-model";
      AI_MODELS.forEach(m => mSel.add(new Option(m.name, m.id)));
      if (nextAgent.lastModelId) mSel.value = nextAgent.lastModelId;
      
      const btnRow = document.createElement("div");
      btnRow.style.display = "flex"; btnRow.style.gap = "10px"; btnRow.style.marginTop = "15px";

      const goBtn = document.createElement("button");
      goBtn.className = "battle-btn"; goBtn.style.flex = "2"; 
      if (isTaleMode) {
         goBtn.style.background = "#cffafe"; goBtn.style.borderColor = "#0891b2"; goBtn.style.color = "#0891b2";
      }
      goBtn.textContent = isTaleMode ? "GENERUJ KOLEJNY FRAGMENT" : "GENERUJ WYPOWIEDŹ";
      goBtn.onclick = () => {
        mangaDiscState.selectedModel = mSel.value;
        generateMangaDiscussionStep();
      };

      const endBtn = document.createElement("button");
      endBtn.className = "battle-btn"; endBtn.style.flex = "1"; endBtn.style.background = "#ffe4e6"; endBtn.style.color = "#e11d48"; endBtn.style.borderColor = "#f43f5e"; endBtn.textContent = "ZAKOŃCZ";
      endBtn.onclick = () => {
        mangaDiscState.active = false;
        if (mangaDiscState.contextType === 'card') {
            document.getElementById('manga-overlay').classList.remove('active');
        } else {
            document.querySelector(`.manga-card[data-id="${mangaDiscState.manga.id}"]`).click();
        }
      };

      if (!isTaleMode) {
          if (mangaDiscState.contextType === 'manga') {
              const lastChap = mangaDiscState.chapters[mangaDiscState.chapters.length - 1];
              const nextChap = mangaData.find(m => m.mangaTitle === lastChap.mangaTitle && m.chapterNum === lastChap.chapterNum + 1);

              if (nextChap) {
                const nextBtn = document.createElement("button");
                nextBtn.className = "battle-btn"; nextBtn.style.flex = "1"; nextBtn.style.background = "#cffafe"; nextBtn.style.borderColor = "#0891b2"; nextBtn.style.color = "#0891b2";
                nextBtn.innerHTML = "➕ ROZDZ. " + nextChap.chapterNum;
                nextBtn.onclick = () => {
                  mangaDiscState.chapters.push(nextChap);
                  mangaDiscState.history.push({
                    name: "SYSTEM",
                    text: `*** UWAGA! Na antenę właśnie wjechały gorące dane z Rozdziału ${nextChap.chapterNum}: ${nextChap.chapterText}. Kontynuujemy dyskusję z uwzględnieniem tych nowych faktów! ***`,
                    model: "system"
                  });
                  
                  if(MANGA_DISC_API_URL.startsWith("http")) {
                     fetch(MANGA_DISC_API_URL, {
                        method: "POST", mode: "no-cors",
                        body: JSON.stringify({ sessionId: mangaDiscState.sessionId, chapterId: mangaDiscState.chapters[0].id, agent: "SYSTEM", model: "system", text: `Dodano Rozdział ${nextChap.chapterNum}` })
                     });
                  }
                  renderMangaDiscussion();
                };
                btnRow.appendChild(nextBtn);
              }
          } else if (mangaDiscState.contextType === 'card') {
              // Logika dla dodawania nowych Kart MTG (TYLKO w trybie dyskusji o lore)
              const availableCards = cards.filter(c => (c.isLOR || c.isStory) && (c.LorText || c.Narracja) && c.Plan === mangaDiscState.basePlan && !mangaDiscState.chapters.some(chap => chap.id === c.ID));
              
              if (availableCards.length > 0) {
                  const addWrap = document.createElement("div");
                  addWrap.style.cssText = "display:flex; flex:1; gap:5px;";

                  const cSel = document.createElement("select");
                  cSel.className = "filter-select"; cSel.style.flex = "2";
                  availableCards.forEach(c => cSel.add(new Option(c.Nazwa, c.ID)));

                  const nextBtn = document.createElement("button");
                  nextBtn.className = "battle-btn"; nextBtn.style.flex = "1";
                  nextBtn.style.background = "#cffafe"; nextBtn.style.borderColor = "#0891b2"; nextBtn.style.color = "#0891b2";
                  nextBtn.textContent = "➕ KARTA";

                  nextBtn.onclick = () => {
                     const selCard = cardMap[cSel.value];
                     if(selCard) {
                         mangaDiscState.chapters.push({
                             id: selCard.ID,
                             imageId: selCard.Ilustracja,
                             mangaTitle: selCard.Nazwa,
                             analiza: selCard.LorText || selCard.Narracja || "Brak opisu",
                             chapterNum: mangaDiscState.chapters.length + 1
                         });
                         mangaDiscState.history.push({
                           name: "SYSTEM",
                           text: `*** UWAGA! Na antenę właśnie wjechały gorące dane o nowej Karcie: ${selCard.Nazwa}. Kontynuujemy dyskusję z uwzględnieniem tych nowych faktów! ***`,
                           model: "system"
                         });
                         
                         if(MANGA_DISC_API_URL.startsWith("http")) {
                            fetch(MANGA_DISC_API_URL, {
                               method: "POST", mode: "no-cors",
                               body: JSON.stringify({ sessionId: mangaDiscState.sessionId, chapterId: mangaDiscState.chapters[0].id, agent: "SYSTEM", model: "system", text: `Dodano Kartę ${selCard.Nazwa}` })
                            });
                         }
                         renderMangaDiscussion();
                     }
                  };
                  addWrap.appendChild(cSel); addWrap.appendChild(nextBtn);
                  btnRow.appendChild(addWrap);
              }
          }
      }

      const hostBtn = document.createElement("button");
      hostBtn.className = "battle-btn"; hostBtn.style.flex = "1";
      hostBtn.style.background = "#fef08a"; hostBtn.style.color = "#854d0e"; hostBtn.style.borderColor = "#ca8a04";
      hostBtn.textContent = "🎙️ WTRĄCENIE";
      
      hostBtn.onclick = () => {
          // Podmieniamy pasek z przyciskami na pole tekstowe
          btnRow.innerHTML = "";
          btnRow.style.flexDirection = "column";
          
          const ta = document.createElement("textarea");
          ta.className = "ext-ai-textarea";
          ta.style.width = "100%"; ta.style.minHeight = "80px";
          ta.placeholder = "Wpisz co ma się wydarzyć lub co mówi prowadzący, np:\n- Prowadzący mówi: Przejdźmy do tematu romansu!\n- Rozlega się dźwięk dzwonka.";
          
          const innerRow = document.createElement("div");
          innerRow.style.display = "flex"; innerRow.style.gap = "10px"; innerRow.style.marginTop = "10px";
          
          const cancelBtn = document.createElement("button");
          cancelBtn.className = "battle-btn"; cancelBtn.style.flex = "1"; cancelBtn.style.background = "#ff336633"; cancelBtn.style.color = "#e11d48"; cancelBtn.style.borderColor = "#f43f5e"; cancelBtn.textContent = "ANULUJ";
          cancelBtn.onclick = () => renderMangaDiscussion();
          
          const sendBtn = document.createElement("button");
          sendBtn.className = "battle-btn"; sendBtn.style.flex = "2"; sendBtn.style.background = "#10b98133"; sendBtn.style.color = "var(--lor-color)"; sendBtn.style.borderColor = "var(--lor-color)"; sendBtn.textContent = "WSTAW DO CZATU";
          sendBtn.onclick = () => {
              const msg = ta.value.trim();
              if (msg) {
                  mangaDiscState.history.push({ name: "HOST", text: msg, model: "user" });
                  if(MANGA_DISC_API_URL.startsWith("http")) {
                      fetch(MANGA_DISC_API_URL, {
                          method: "POST", mode: "no-cors",
                          body: JSON.stringify({ sessionId: mangaDiscState.sessionId, chapterId: mangaDiscState.chapters[0].id, agent: "HOST", model: "user", text: msg })
                      });
                  }
                  renderMangaDiscussion();
              }
          };
          
          innerRow.appendChild(cancelBtn); innerRow.appendChild(sendBtn);
          btnRow.appendChild(ta); btnRow.appendChild(innerRow);
      };

      btnRow.appendChild(goBtn); btnRow.appendChild(hostBtn); btnRow.appendChild(endBtn);
      actionBox.appendChild(mSel); actionBox.appendChild(btnRow);
      chatWrapper.appendChild(actionBox);
    } else {
      const loader = document.createElement("div");
      loader.innerHTML = `<div class="team-loading" style="text-align:center; padding:20px;">${isTaleMode ? "Tworzenie ciągu dalszego..." : `Dyskutant ${mangaDiscState.discussants[mangaDiscState.currentIdx % mangaDiscState.numDiscussants].name} przygotowuje się do wejścia na antenę...`}</div>`;
      chatWrapper.appendChild(loader);
    }

    container.appendChild(chatWrapper);
  }

  // Używamy requestAnimationFrame, aby mieć pewność, że HTML się namalował i wysokości są poprawne
  requestAnimationFrame(() => {
      if (mangaDiscState.phase === 'chat' || mangaDiscState.phase === 'loading') {
          if (mangaDiscState.lastWasBottom) {
              // Jeśli czytałeś na dole, doczepiamy do nowego dołu (np. z nową wiadomością)
              container.scrollTop = container.scrollHeight;
          } else if (mangaDiscState.lastScroll !== undefined) {
              // Jeśli przewinąłeś w górę, zamrażamy klatkę dokładnie tam, gdzie byłeś
              container.scrollTop = mangaDiscState.lastScroll;
          }
      }
  });
}

async function generateMangaDiscussionStep() {
  mangaDiscState.phase = 'loading';
  renderMangaDiscussion();

  const agent = mangaDiscState.discussants[mangaDiscState.currentIdx % mangaDiscState.numDiscussants];
  const modelId = mangaDiscState.selectedModel || AI_MODELS[0].id;
  agent.lastModelId = modelId;
  const isTaleMode = mangaDiscState.mode === 'tale';
  
  if (!mangaDiscState.sessionId) mangaDiscState.sessionId = "sess_" + Date.now();

  let mangaContext = mangaDiscState.chapters.map((m, i) => {
    if (mangaDiscState.contextType === 'card') {
       return `[KARTA MTG DO ANALIZY: ${m.mangaTitle}]\nLore/Opis: ${m.analiza}`;
    } else if (mangaDiscState.contextType === 'fot_game') {
       return m.analiza;
    } else {
       return `[MATERIAŁ DO ROZDZIAŁU ${m.chapterNum}]\nAnaliza: ${m.analiza}`;
    }
  }).join("\n\n===\n\n");

  let prompt = "";

  if (isTaleMode) {
      // PROMPT DLA TRYBU OPOWIEŚCI
      let historyText = mangaDiscState.history.map(h => h.text).join("\n\n");
      prompt = `Jesteś kreatywnym pisarzem literatury fantastycznej. Będziesz tworzył kontynuację fabularną (fanfic/what-if) na podstawie poniższych notatek (beat-sheetów) z mangi.
      
Notatki z mangi:
---
${mangaContext}
---

${historyText ? `Dotychczas wygenerowałeś poniższą historię:\n\n${historyText}\n\nTeraz napisz kolejny, bezpośredni ciąg dalszy tego opowiadania.` : `Napisz ciąg dalszy lub swoją autorską wariację tej opowieści (what-if) rozgrywającą się bezpośrednio po opisanych wydarzeniach.`}

ZADANIE:
- Pisz w czasie teraźniejszym lub przeszłym, narracja literacka (np. 3-osobowa).
- Pisz w języku polskim, wciągającym, dynamicznym stylem.
- Nie używaj meta-opisów ani powitań. Po prostu zacznij pisać opowiadanie.`;
  } else {
      // PROMPT DLA TRYBU STUDIO
      let historyText = mangaDiscState.history.map(h => `${h.name}: ${h.text}`).join("\n\n---\n\n");
      
      let conversationPreamble = "";
      // Jeśli historia jest pusta, dajemy specjalną instrukcję startową.
      if (!historyText) {
          conversationPreamble = `UWAGA! Jesteś PIERWSZYM uczestnikiem programu. Audycja właśnie się zaczyna, nie było wcześniej żadnej dyskusji na ten temat. 
TWOJE ZADANIE JAKO PROWADZĄCEGO:
1. Przywitaj słuchaczy w programie.
2. Krótko i zwięźle przedstaw temat dzisiejszego odcinka na podstawie materiałów.
3. Przedstaw swoją pierwszą myśl / analizę na ten temat i 'oddaj głos' do studia.
Nie odnoś się do żadnych wcześniejszych wypowiedzi, bo ich nie było - startujesz od zera.`;
      } else {
          conversationPreamble = `Przebieg dotychczasowej rozmowy:
---
${historyText}`;
      }
      
      if (mangaDiscState.contextType === 'card') {
          prompt = `Jesteś uczestnikiem profesjonalnej dyskusji podcastowej o nazwie 'Lore MtG'. 
Występujesz jako: ${agent.name}.

Przedmiotem dyskusji jest lore światów i kart Magic: The Gathering, rozgrywające się na planie ${mangaDiscState.basePlan}.
Oto opis promptu służącego do narysowania infografiki dla lore tej karty i świata z nią związanego:
---
${mangaContext}
---

${conversationPreamble}

ZADANIE:
Napisz wypowiedź jako ${agent.name}. 
- Długość: około 200 słów. 
- Zachowaj swobodny, podcastowy styl (jak rozmowa pasjonatów). 
- Odnoś się merytorycznie do lore kart oraz do wypowiedzi poprzedników. Możesz snuć teorie i spekulować na temat fabuły lub postaci, wyłapuj "smaczki", ukryte znaczenia i zwracać uwagę na ewentualne błedy.
- Bądź krytyczny i szukaj błędów w rozumowaniu innych komentatorów, twórz sojusze z komentatorami, którzy cie wspierają i bezwzględnie punktuj tych, którzy cię krytykują.
- Nie komentuj samej formy prompta, wskazówek dla LLM graficznego dotyczących kolorystyki czy papieru - masz odnosić się do lore, a nie promptu infografiki.
- Nie używaj opisów akcji (np. *śmieje się*), pisz tylko tekst wypowiedzi.`;

      } else if (mangaDiscState.contextType === 'fot_game') {
          const numPlayers = mangaDiscState.numDiscussants;
          const currentTurn = mangaDiscState.currentIdx;
          const isSecondRound = currentTurn >= numPlayers;
          
          let roundInstructions = "";

          prompt = `Jesteś uczestnikiem teleturnieju 'Odgadnij Kartę MtG'. Występujesz jako: ${agent.name}.
Twoim zadaniem jest odgadnięcie planu (settingu) oraz pełnej Nazwy karty Magic: The Gathering na podstawie poniższego, anonimowego opisu fabularnego (narracji).

---
NARRACJA DO ANALIZY:
${mangaContext}
---

ZASADY GRY:
1. Dostajesz tylko fragment narracji. Nie znasz ani nazwy, ani planu.
2. Każdy gracz ma dwie tury na wypowiedź. W swoich wypowiedziach powinieneś zwracać uwagę na to co mówią inni uczestnicy, możesz się z nimi zgadzać albo nie. Możesz ich krytykować i wyśmiewać. Ale możesz także korzystać z ich podpowiedzi. Ważne, żebyś ty zgadł.
3. Nazwa Karty to PRAWDZIWA nazwa oryginalnej karty w Magic the Gathering - nie liczą się żadne custom karty tylko oryginalne karty MtG.
4. UWAGA: Karta mogła pierwotnie występować w MtG na innym planie, ale uległa transpozycji do innego planu lub settingu (np. Wiedźmin, Warhammer Fantasy, Forgotten Realms, Middle Earth). Masz zgadnąć ten zmieniony plan wg narracji.

${conversationPreamble}

TWOJE ZADANIE NA TĘ TURĘ:
${roundInstructions}

Napisz swoją wypowiedź jako ${agent.name}.
- Długość: maksymalnie 200 słów.
- Zachowaj swobodny, żywy styl uczestnika teleturnieju.
- Nie używaj opisów akcji (np. *drapie się po głowie*).`;

      } else {
          prompt = `Jesteś uczestnikiem profesjonalnej dyskusji radiowej o nazwie 'W Świecie Mangi'. 
Występujesz jako: ${agent.name}.

Przedmiotem dyskusji są następujące materiały:
---
${mangaContext}
---

${conversationPreamble}

ZADANIE:
Napisz wypowiedź jako ${agent.name}. 
Ramy techniczne:
- Długość: około 200 słów. 
- Zachowaj naturalny, radiowy styl. 
- Nie używaj opisów akcji (np. *śmieje się*), pisz tylko tekst wypowiedzi.
Ramy merytoryczne:
- Na podstawie ostatniego z przekazanych rozdziałów historii, a także w kontekście poprzednich rozdziałów WYBIERZ jeden element występujący w tym rozdziale (wydarzenie lub postać z obsady lub miejsce akcji lub wątek lub zasadę świata lub zdolności lub oś konfliktu) opisany w tym rozdziale ALE UWAGA - taki, którego nie wybrał i nie omawiał żaden z wcześniejszym dyskutantów, a następnie omów ją szczegółowo;
- Możesz w swojej wypowiedzi nawiązywać do tego co mówili wcześniejsi dyskutanci, możesz wplatać odniesienia do wcześniejszych rozdziałów;
- Jeśli odnosisz się do wcześniejszych wypowiedzi innych osób to bądź krytyczny i szukaj luk i błędów w ich rozumowaniu;
`;
      }
  }

  // --- LOGIKA ZAPYTANIA API Z OBSŁUGĄ BŁĘDÓW I PRZERYWANIA ---
  const controller = new AbortController();
  const waitTimer = setTimeout(() => {
    const loaderEl = document.querySelector(".team-loading");
    if(loaderEl && !loaderEl.querySelector("button")) { // Zabezpieczenie przed dublowaniem przycisku
        const abortBtn = document.createElement("button");
        abortBtn.className = "battle-btn";
        abortBtn.style.cssText = "padding:5px 10px; font-size:10px; margin-top:10px; background:#ff336633;";
        abortBtn.textContent = "PRZERWIJ (30s)";
        abortBtn.onclick = () => controller.abort();
        loaderEl.appendChild(document.createElement("br"));
        loaderEl.appendChild(abortBtn);
    }
  }, 30000);

  try {
    let resultText = "";
    if (modelId === "external") {
       const res = await waitForExternalAI(prompt);
       resultText = res.text;
    } else {
       const resp = await fetch("https://openrouter.ai/api/v1/chat/completions", {
         method: "POST",
         headers: { "Authorization": `Bearer ${OPENROUTER_API_KEY}`, "Content-Type": "application/json" },
         body: JSON.stringify({ model: modelId, messages: [{ role: "user", content: prompt }] }),
         signal: controller.signal
       });
       
       if (!resp.ok) {
           const errorBody = await resp.text();
           let errorMsg = `Błąd HTTP ${resp.status}: ${errorBody.substring(0, 200)}`;
           
           try { 
               const errJson = JSON.parse(errorBody); 
               if (errJson.error) {
                   // Szukamy głębiej w 'metadata.raw', jeśli 'message' jest zbyt ogólne
                   let deepMsg = errJson.error.message || '';
                   if (deepMsg.includes("Provider returned error") && errJson.error.metadata && errJson.error.metadata.raw) {
                       // Odkodowujemy to, co podał oryginalny dostawca (np. Anthropic, Google)
                       try {
                           const rawObj = JSON.parse(errJson.error.metadata.raw);
                           if (rawObj.error && rawObj.error.message) deepMsg = rawObj.error.message;
                       } catch(e) {
                           deepMsg = errJson.error.metadata.raw;
                       }
                   }
                   errorMsg = `Błąd API [${resp.status}]: ${deepMsg}`;
               }
           } catch (e) {}
           
           throw new Error(errorMsg);
       }

       const data = await resp.json();
       resultText = data.choices[0].message.content.trim();
    }

    mangaDiscState.history.push({
      name: isTaleMode ? "TALE_NARRATOR" : agent.name,
      text: resultText,
      model: modelId
    });
    
    if(MANGA_DISC_API_URL.startsWith("http")) {
        fetch(MANGA_DISC_API_URL, {
          method: "POST", mode: "no-cors",
          body: JSON.stringify({
            sessionId: mangaDiscState.sessionId, chapterId: mangaDiscState.chapters[0].id,
            agent: isTaleMode ? "TALE_NARRATOR" : agent.name, model: modelId, text: resultText
          })
        });
    }
    
    if(!isTaleMode) mangaDiscState.currentIdx++;
    mangaDiscState.phase = 'chat';
    renderMangaDiscussion();
  } catch (e) {
    if (e.name === 'AbortError') {
        mangaDiscState.errorMsg = "Przerwano przez użytkownika po 30 sekundach.";
    } else {
        mangaDiscState.errorMsg = e.message;
    }
    mangaDiscState.prevPhase = mangaDiscState.history.length === 0 ? 'setup' : 'chat';
    mangaDiscState.phase = 'error';
    renderMangaDiscussion();
  } finally {
      clearTimeout(waitTimer);
  }
}

function renderConstellations() {
  const content = document.getElementById("content");
  content.innerHTML = "";

  const renderJobs = [];

  if (constMode === 'family') {
    // --- STARY TRYB (Barycentrum) ---
    const visited = new Set();
    const families = [];

    cards.forEach(c => {
      if (visited.has(c.ID)) return;
      if (!c.isBase && !c.isFusion) return;

      const family = new Set();
      const queue = [c.ID];

      while(queue.length) {
        const currId = queue.shift();
        if (family.has(currId)) continue;
        family.add(currId);
        visited.add(currId);

        const currCard = cardMap[currId];
        if (!currCard) continue;

        if (currCard.Fusion) currCard.Fusion.forEach(pid => queue.push(pid));
        cards.forEach(child => {
          if (child.Fusion && child.Fusion.includes(currId)) queue.push(child.ID);
        });
      }
      if (family.size > 1) families.push(family);
    });

    families.forEach(famIds => {
      const fotCardsInFam = [...famIds].map(id => cards.find(c => c.isFOT && c.kraSource === id)).filter(Boolean);
      if (fotCardsInFam.length === 0) return;

      const passesFilter = [...famIds].some(id => {
         const bc = cardMap[id];
         return bc && bc.isBase && (activeSet === 'all' || bc.Set === activeSet) && (activePlan === 'all' || bc.Plan === activePlan);
      });
      if (!passesFilter) return;

      const validFamIds = new Set(fotCardsInFam.map(fc => fc.kraSource));
      function famParents(id){ const c=cardMap[id]; return c&&c.Fusion ? c.Fusion.filter(pid=>validFamIds.has(pid)) : []; }
      function famChildren(id){ return [...validFamIds].filter(cid=>{ const c=cardMap[cid]; return c&&c.Fusion&&c.Fusion.includes(id); }); }

      const colOf = {};
      function calcForward(id) {
        if (colOf[id] !== undefined) return colOf[id];
        const parents = famParents(id);
        if (!parents.length) return (colOf[id] = 0);
        let maxP = -1;
        parents.forEach(pid => maxP = Math.max(maxP, calcForward(pid)));
        return (colOf[id] = maxP + 1);
      }
      validFamIds.forEach(id => calcForward(id));

      let changed = true;
      while (changed) {
        changed = false;
        validFamIds.forEach(id => {
          const children = famChildren(id);
          if (children.length > 0) {
            let minChildCol = Infinity;
            children.forEach(cid => minChildCol = Math.min(minChildCol, colOf[cid]));
            if (colOf[id] < minChildCol - 1) {
              colOf[id] = minChildCol - 1;
              changed = true;
            }
          }
        });
      }

      const minColAssigned = Math.min(...Object.values(colOf));
      if (minColAssigned !== 0) validFamIds.forEach(id => colOf[id] -= minColAssigned);

      const columns = {};
      validFamIds.forEach(id => {
        const cn = colOf[id];
        if (!columns[cn]) columns[cn] = [];
        columns[cn].push(id);
      });
      const colNums = Object.keys(columns).map(Number).sort((a, b) => a - b);

      const orderedColumns = {}, sepPositions = {}, globalY = {};
      colNums.forEach(cn => {
        const ids = columns[cn] || [];
        ids.sort((a, b) => a - b);
        orderedColumns[cn] = [...ids];
        ids.forEach((id, index) => globalY[id] = index);
      });

      const getBarycenter = (cardId, lookForward) => {
        const primary = lookForward ? famChildren(cardId) : famParents(cardId);
        if (primary.length > 0) {
          let sum = 0; primary.forEach(rid => sum += (globalY[rid] ?? 0));
          return sum / primary.length;
        }
        const secondary = lookForward ? famParents(cardId) : famChildren(cardId);
        if (secondary.length > 0) {
          let sum = 0; secondary.forEach(rid => sum += (globalY[rid] ?? 0));
          return sum / secondary.length;
        }
        return cardId; 
      };

      [...colNums].sort((a, b) => b - a).forEach(cn => {
        orderedColumns[cn].sort((a, b) => {
          const diff = getBarycenter(a, true) - getBarycenter(b, true);
          return diff === 0 ? a - b : diff;
        });
        orderedColumns[cn].forEach((id, index) => globalY[id] = index);
      });

      colNums.forEach(cn => {
        if (cn > 0) {
          orderedColumns[cn].sort((a, b) => {
            const diff = getBarycenter(a, false) - getBarycenter(b, false);
            return diff === 0 ? a - b : diff;
          });
          orderedColumns[cn].forEach((id, index) => globalY[id] = index);
        }
      });

      colNums.forEach(cn => {
        const ids = orderedColumns[cn];
        const seps = [];
        for (let i = 0; i < ids.length - 1; i++) {
          const pA = famParents(ids[i]), pB = famParents(ids[i + 1]);
          const cA = famChildren(ids[i]), cB = famChildren(ids[i + 1]);
          if (!pA.some(p => pB.includes(p)) && !cA.some(c => cB.includes(c))) seps.push(i);
        }
        sepPositions[cn] = seps;
      });

      renderJobs.push({ colNums, orderedColumns, sepPositions, validFamIds });
    });

  } else {
    // --- NOWY TRYB (Drzewa Historii w przód) ---
    // Funkcja identyfikująca fuzję Gen 1 (wszyscy rodzice są bazowi)
    function isGen1(c) {
      if (!c.isFusion || !c.Fusion) return false;
      return c.Fusion.every(pid => {
        const p = cardMap[pid];
        return p && !p.isFusion && !p.isStory;
      });
    }

    const basePairs = {};
    cards.filter(c => isGen1(c)).forEach(g1 => {
      const hasFot = cards.some(fc => fc.isFOT && fc.kraSource === g1.ID);
      if(!hasFot) return;

      const key = [...g1.Fusion].sort().join('_');
      if(!basePairs[key]) basePairs[key] = { parents: g1.Fusion, gen1s: [] };
      basePairs[key].gen1s.push(g1.ID);
    });

    Object.keys(basePairs).forEach(key => {
      const pair = basePairs[key];
      const treeCols = { 0: [...pair.parents], 1: [...pair.gen1s] };
      
      function add(col, id) {
        if(!treeCols[col]) treeCols[col] = [];
        if(!treeCols[col].includes(id)) treeCols[col].push(id);
      }

      const visitedEdges = new Set();
      function walk(nodeId, currentCol) {
        const children = cards.filter(c => c.Fusion && c.Fusion.includes(nodeId));
        children.forEach(ch => {
          const edgeKey = nodeId + '-' + ch.ID;
          if(visitedEdges.has(edgeKey)) return;
          visitedEdges.add(edgeKey);
          
          add(currentCol + 1, ch.ID);
          if(ch.Fusion) {
            ch.Fusion.forEach(pid => {
              if(pid !== nodeId) add(currentCol, pid);
            });
          }
          walk(ch.ID, currentCol + 1);
        });
      }

      pair.gen1s.forEach(g1_id => walk(g1_id, 1));
      const colNums = Object.keys(treeCols).map(Number).sort((a,b)=>a-b);

      const allTreeIds = colNums.flatMap(cn => treeCols[cn]);
      
      // Sprawdzanie filtrów na kartach bazowych tego drzewa
      const passesFilter = allTreeIds.some(id => {
        const c = cardMap[id];
        return c && c.isBase && (activeSet === 'all' || c.Set === activeSet) && (activePlan === 'all' || c.Plan === activePlan);
      });
      
      if(passesFilter) {
        const validFamIds = new Set(allTreeIds);
        renderJobs.push({ colNums, orderedColumns: treeCols, sepPositions: {}, validFamIds });
      }
    });
  }

  // --- WSPÓLNA PETLA RENDERUJĄCA HTML ---
  let renderedCount = 0;

  renderJobs.forEach(job => {
    const { colNums, orderedColumns, sepPositions, validFamIds } = job;
    
    let hasAnyFot = false;
    colNums.forEach(cn => {
      orderedColumns[cn].forEach(id => {
        if(cards.some(c => c.isFOT && c.kraSource === id)) hasAnyFot = true;
      });
    });
    if(!hasAnyFot) return;

    renderedCount++;
    const nCols = colNums.length;
    const tw = 260, th = Math.round(tw * 9 / 21), HEADER_H = 28, GAP = 8, SEP_H = 16;
    const minCol = Math.min(...colNums);

    function colPixelHeight(cn){
      const nCards = (orderedColumns[cn]||[]).length;
      const nSeps = (sepPositions[cn]||[]).length;
      return nCards*th + Math.max(0, nCards-1)*GAP + nSeps*SEP_H;
    }
    const maxColH = Math.max(...colNums.map(cn => colPixelHeight(cn)), 0);
    const totalW = nCols*tw + (nCols-1)*GAP;
    const totalH = HEADER_H + maxColH;

    const wrap = document.createElement("div");
    wrap.style.cssText = `position:relative; width:${totalW}px; height:${totalH}px;`;

    const rowContainer = document.createElement("div");
    rowContainer.className = "story-tree-row";
    rowContainer.appendChild(wrap);

    colNums.forEach(cn => {
      const normCol = cn - minCol;
      const x = normCol * (tw + GAP);
      
      const hdr = document.createElement("div");
      hdr.style.cssText=`position:absolute; left:${x}px; top:0; width:${tw}px; height:${HEADER_H-4}px; display:flex; align-items:center; justify-content:center; font-size:11px; font-family:var(--font-ui); letter-spacing:1px; color:${cn===0?'#ffd93d':'#888'}; text-transform:uppercase; border-bottom:1px solid #333;`;
      hdr.textContent = cn === 0 ? "Baza" : (cn > 0 ? "Pokolenie " + cn : "Przodek " + Math.abs(cn));
      wrap.appendChild(hdr);

      const ids = orderedColumns[cn];
      const seps = new Set(sepPositions[cn]||[]);
      let cy = HEADER_H;

      ids.forEach((id, ri) => {
        const fotCard = cards.find(c => c.isFOT && c.kraSource === id);
        if (!fotCard) {
          cy += th + GAP;
          if(seps.has(ri)) cy += SEP_H;
          return;
        }

        const tile = document.createElement("div");
        tile.style.cssText = `position:absolute; left:${x}px; top:${cy}px; width:${tw}px; height:${th}px; cursor:pointer; border-radius:4px; overflow:hidden; border:1px solid var(--border); background:#06060c;`;
        
        const bc = cardMap[id];
        let genColor = "#4a9eff"; 
        if (bc && bc.isFusion && bc.Fusion) {
          const parents = bc.Fusion.map(pid => cardMap[pid]).filter(Boolean);
          const baseCount = parents.filter(p => !p.isFusion && !p.isStory).length;
          const fusCount = parents.length - baseCount;
          if (fusCount === 0) genColor = "#ffd93d"; 
          else if (baseCount === 0) genColor = "#ff6b6b"; 
          else genColor = "#c084fc"; 
        }
        tile.style.borderLeft = `3px solid ${genColor}`;

        const img = document.createElement("img");
        img.style.cssText = `width:100%; height:100%; object-fit:cover; pointer-events:none; display:block;`;
        lazy(img, `./img/${fotCard.Ilustracja}.png`);
        tile.appendChild(img);

        const lbl = document.createElement("div");
        lbl.style.cssText = `position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent,#000e); padding:16px 8px 4px; font-size:11px; font-family:var(--font-ui); color:#ccc; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;`;
        lbl.textContent = fotCard.Nazwa;
        tile.appendChild(lbl);

        tile.onclick = () => openLightbox(fotCard);

        wrap.appendChild(tile);
        cy += th + GAP;

        if(seps.has(ri)){
           const sep=document.createElement("div");
           sep.style.cssText=`position:absolute; left:${x+10}px; top:${cy-GAP/2}px; width:${tw-20}px; height:1px; background:#1e1e30`;
           wrap.appendChild(sep);
           cy += SEP_H;
        }
      });
    });

    content.appendChild(rowContainer);
  });

  if (renderedCount === 0) {
     content.innerHTML = "<div style='text-align:center; padding: 20px;'>Brak konstelacji FOT dla tych filtrów.</div>";
  }
}

// --- EXTERNAL AI LOGIC ---
let extAiResolver = null;
let extAiRejecter = null;

function getHistoricalExternalModels() {
  const predefinedIds = AI_MODELS.map(m => m.id);
  const extModels = [];
  Object.keys(aiScores).forEach(id => {
    if (!predefinedIds.includes(id) && id !== 'external') {
      extModels.push({ id: id, name: id.replace('ext_', '').replace(/_/g, ' ') });
    }
  });
  return extModels;
}

function waitForExternalAI(promptText) {
  return new Promise((resolve, reject) => {
    extAiResolver = resolve;
    extAiRejecter = reject;

    const overlay = document.getElementById("ext-ai-overlay");
    const promptArea = document.getElementById("ext-ai-prompt");
    const selectBox = document.getElementById("ext-ai-model-select");
    const textBox = document.getElementById("ext-ai-model-text");
    const responseArea = document.getElementById("ext-ai-response");

    promptArea.value = promptText;
    responseArea.value = "";
    textBox.value = "";
    
    selectBox.innerHTML = '<option value="_new_">+ Wpisz nową nazwę...</option>';
    const histModels = getHistoricalExternalModels();
    histModels.forEach(m => {
      selectBox.add(new Option(m.name, m.id));
    });

    selectBox.value = "_new_";
    textBox.classList.add("active");

    selectBox.onchange = (e) => {
      if (e.target.value === "_new_") {
        textBox.classList.add("active");
        textBox.focus();
      } else {
        textBox.classList.remove("active");
      }
    };

    document.getElementById("ext-ai-copy-btn").onclick = (e) => {
      e.preventDefault(); // Zapobiega dziwnym podwójnym kliknięciom na ekranach dotykowych
      const btn = document.getElementById("ext-ai-copy-btn");
      const oldText = btn.textContent;

      const successFeedback = () => {
        btn.textContent = "SKOPIOWANO!";
        setTimeout(() => btn.textContent = oldText, 2000);
      };

      // Próba nowoczesnego API (działa na PC i Androidzie)
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(promptText).then(successFeedback).catch(err => {
            fallbackCopy();
        });
      } else {
        fallbackCopy();
      }

      // Niezawodny Fallback dla iOS / iPad Chrome
      function fallbackCopy() {
        const ta = document.getElementById("ext-ai-prompt");
        // Tymczasowe odblokowanie pola tylko na ułamek sekundy do skopiowania
        const wasReadonly = ta.hasAttribute('readonly');
        if (wasReadonly) ta.removeAttribute('readonly'); 
        
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, 999999); // Kompatybilność z mobilnymi przeglądarkami

        try {
          document.execCommand('copy');
          successFeedback();
        } catch (err) {
          alert("Twoja przeglądarka blokuje dostęp do schowka. Skopiuj tekst ręcznie.");
        }

        // Posprzątanie po zaznaczeniu
        ta.setSelectionRange(0, 0);
        ta.blur();
        if (wasReadonly) ta.setAttribute('readonly', 'true');
      }
    };

    overlay.classList.add("active");
  });
}

document.getElementById("ext-ai-submit-btn").onclick = () => {
  const responseText = document.getElementById("ext-ai-response").value.trim();
  const selectBox = document.getElementById("ext-ai-model-select");
  const textBox = document.getElementById("ext-ai-model-text");

  if (!responseText) {
    alert("Proszę wkleić odpowiedź od sztucznej inteligencji.");
    return;
  }

  let finalModelId = "";
  let finalModelName = "";

  if (selectBox.value === "_new_") {
    finalModelName = textBox.value.trim();
    if (!finalModelName) {
      alert("Proszę wpisać nazwę modelu!");
      return;
    }
    finalModelId = "ext_" + finalModelName.replace(/\s+/g, '_').toLowerCase();
  } else {
    finalModelId = selectBox.value;
    finalModelName = selectBox.options[selectBox.selectedIndex].text;
  }

  document.getElementById("ext-ai-overlay").classList.remove("active");
  if (extAiResolver) {
    extAiResolver({ text: responseText, modelId: finalModelId, modelName: finalModelName });
  }
};

document.getElementById("ext-ai-cancel-btn").onclick = () => {
  document.getElementById("ext-ai-overlay").classList.remove("active");
  if (extAiRejecter) extAiRejecter(new Error("Użytkownik anulował ręczne wprowadzanie z zewnętrznego AI."));
};

// --- TALE ENGINE (OPOWIEŚCI) ---

async function askAIForStory(context, modelId) {
  const prompt = `Jesteś jednym z kilku autorów emergentnej opowieści w stylu system isekai dark fantasy, a twoim zadaniem jest kreatywne, ciekawe, zgodne z settingiem i lore danego planu, pisanie i kontynuowanie opowieści osadzonej w świecie Magic the Gathering na danym planie.

Bohater:
Bohaterem opowieści jest Ryuji, 21-letni mężczyzna, który w magiczny sposób znalazł się w świecie settigu, którego ma dotyczyć opowieść.

Zasady szczegółowe:
- w opowieści różne postacie spotykają się, interferują ze sobą, rozmawiają, walczą, współpracują, ale też podążają własnymi ścieżkami w ramach wielowątkowej, epickiej opowieści;
- ty jako jeden z autorów tej opowieści decydujesz dokładnie, gdzie i jak toczą się poszczególne wątki; 
- brutalność też jest narzędziem narracji, ale powściągliwym - jedno precyzyjne uderzenie jest skuteczniejsze niż rzeź, sugestia potężniejsza niż dosłowność;
- twój fragment ma nawiązywać i kontynuować to, co pisali twoi poprzednicy, w ramach fabuły rozgrywającej się na danym planie;
- możesz i powinieneś odważnie przenosić "kamerę" do innej lokacji lub wątku (w ramach danego planu), także zupełnie nowych, jeśli wpłynie to pozytywnie na rozwój fabuły;

- wątki i bohaterowie mogą występować w różnych geograficznie miejscach świata, mogą i powinny się rozchodzić oraz splatać zgodnie z potrzebami fabuły;
- możesz animować wszystkie postaci biorące udział w historii, w tym postaci stworzone przez innych autorów;
- pamiętaj, że nie każdy rozdział musi popychać fabułę radykalnie do przodu - mogą zdarzyć się aktywacje celebrujące miejsce lub chwilę, opisujące otoczenie - dopiero gdy akcja osiągnie nieakceptowalną statyczność wymagane jest posunięcie jej do przodu; 
- nie każdy fragment musi zawierać punkt zwrotny, ujawnienie tajemnicy ani konfrontację; ceniona jest powściągliwość — budowanie napięcia przez oczekiwanie, nie przez ciągłe dostarczanie;
- nie każdy fragment musi kończyć się cliffhangerem; cisza czy niedopowiedzenie mogą być równie skutecznym zakończeniem sceny;
- możesz, o ile ma to uzasadnienie fabularne, korzystać z opcji fast-forward (np. opisując zakończenie akcji danego dnia i kontynuowanie jej kolejnego);

Dialogi poprzedzone myślnikiem od nowego wiersza. Całość w języku polskim.

${context}`;

  if (modelId === "external") {
    const extResult = await waitForExternalAI(prompt);
    taleState.genModelId = extResult.modelId;
    taleState.genModelName = extResult.modelName;
    return extResult.text;
  } else {
    const controller = new AbortController();

        window.abortTaleGen = () => controller.abort();
    }, 30000);

    try {
      const resp = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: { "Authorization": `Bearer ${OPENROUTER_API_KEY}`, "Content-Type": "application/json" },
        body: JSON.stringify({ model: modelId, messages: [{ role: "user", content: prompt }] }),
        signal: controller.signal
      });
      if (!resp.ok) throw new Error(`Błąd HTTP: ${resp.status}`);
      const data = await resp.json();
      
      const mData = AI_MODELS.find(m => m.id === modelId);
      taleState.genModelId = modelId;
      taleState.genModelName = mData ? mData.name : modelId;
      
      return data.choices[0].message.content.trim();
    } catch (err) {
      if (err.name === 'AbortError') throw new Error("Przerwano przez użytkownika.");
      throw err;
    } finally {
      clearTimeout(waitTimer);
    }
  }
}

// Funkcja losująca kartę z uwzględnieniem prawdopodobieństwa (wag)
function getWeightedRandomTaleCard(pool, isMain) {
    let totalWeight = 0;
    const weights = pool.map(c => {
        const frags = (c.StoryFragments || []).length;
        // MAIN: im więcej fragmentów, tym MNIEJSZA waga (rzadziej losowane)
        // SUB: im więcej fragmentów, tym WIĘKSZA waga (częściej losowane jako tło)
        const weight = isMain ? (1 / (1 + 1.8 * frags)) : (1 + 1.8 * frags);
        totalWeight += weight;
        return weight;
    });

    let random = Math.random() * totalWeight;
    for (let i = 0; i < pool.length; i++) {
        random -= weights[i];
        if (random <= 0) return pool[i];
    }
    return pool[pool.length - 1]; // Zabezpieczenie
}
