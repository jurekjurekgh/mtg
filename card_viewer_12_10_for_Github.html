<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<!-- KLUCZOWE DLA MOBILE: user-scalable=yes pozwala na NATYWNY pinch-to-zoom -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>MTG Card Viewer v12.4</title>
<style>
  :root {
    --bg: #ffffff; --bg-panel: #f4f4f9; --border: #d1d5db;
    --text: #111827; --muted: #6b7280; --gold: #b45309; --accent: #2563eb;
    --sto-color: #9333ea; --kra-color: #92400e; --fot-color: #0891b2; --base-color: #2563eb;
    --const-color: #b45309; --best-color: #dc2626; --lor-color: #059669; --bat-color: #e11d48;
    --font: 'Crimson Text', Georgia, serif;
    --font-ui: 'Cinzel', Georgia, serif;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; }
  
  /* --- TOP BAR --- */
  #header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border); padding: 10px;
    display: flex; flex-direction: column; gap: 10px;
  }
  
  .tabs { display: flex; gap: 8px; justify-content: center; }
  .tab-btn {
    flex: 1; max-width: 150px; background: var(--bg-panel); border: 1px solid var(--border);
    color: var(--muted); border-radius: 8px; padding: 10px 5px; font-size: 13px;
    font-family: var(--font-ui); cursor: pointer; transition: 0.2s;
  }
  .tab-btn[data-mode="base"].active { background: #4a9eff22; border-color: var(--base-color); color: var(--base-color); }
  .tab-btn[data-mode="sto"].active { background: #e07cff22; border-color: var(--sto-color); color: var(--sto-color); }
  .tab-btn[data-mode="kra"].active { background: #c8956c22; border-color: var(--kra-color); color: var(--kra-color); }
  .tab-btn[data-mode="fot"].active { background: #22d3ee22; border-color: var(--fot-color); color: var(--fot-color); }
  .tab-btn[data-mode="const"].active { background: #ffd93d22; border-color: var(--const-color); color: var(--const-color); }
  .tab-btn[data-mode="best"].active { background: #ff4a4a22; border-color: var(--best-color); color: var(--best-color); }
  .tab-btn[data-mode="lor"].active { background: #10b98122; border-color: var(--lor-color); color: var(--lor-color); }
  .tab-btn[data-mode="bat"].active { background: #ff336622; border-color: var(--bat-color); color: var(--bat-color); }
  .tab-btn[data-mode="tale"].active { background: #e07cff22; border-color: var(--sto-color); color: var(--sto-color); }
  .tab-btn[data-mode="manga"].active { background: #a855f722; border-color: #a855f7; color: #a855f7; }

  .filters { display: flex; gap: 8px; justify-content: center; }

  /* --- BATTLE MODE --- */
  .battle-setup { display: flex; flex-direction: column; gap: 20px; align-items: center; padding: 20px; }
  .battle-setup-cols { display: flex; flex-direction: row; gap: 20px; width: 100%; max-width: 800px; }
  
  .battle-quick-view {
    position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.95);
    display: none; align-items: center; justify-content: center; cursor: zoom-out;
  }
  .battle-quick-view.active { display: flex; }
  .battle-quick-view img { max-width: 95vw; max-height: 95vh; object-fit: contain; border-radius: 8px; border: 1px solid var(--border); }
  .battle-col { flex: 1; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .battle-btn { background: #ff336633; border: 1px solid var(--bat-color); color: var(--bat-color); padding: 16px 32px; border-radius: 8px; font-family: var(--font-ui); font-size: 16px; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
  .battle-btn:hover:not(:disabled) { background: var(--bat-color); color: #fff; }
  .battle-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .arena { display: flex; flex-direction: column; gap: 20px; max-width: 900px; margin: 0 auto; padding: 10px; }
  .arena-top { display: flex; gap: 10px; justify-content: space-between; align-items: flex-end; }
  .arena-fighter { flex: 1; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .arena-fighter img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; border: 2px solid var(--border); transition: 0.3s; }
  .arena-fighter.active img { border-color: var(--bat-color); box-shadow: 0 0 20px #ff336666; transform: scale(1.05); }
  .arena-score { font-size: 32px; font-family: var(--font-ui); font-weight: bold; color: var(--gold); text-shadow: 0 2px 10px #000; }
  
  .arena-vs { font-size: 24px; font-family: var(--font-ui); color: var(--muted); padding-bottom: 20px; }
  
  .question-panel { background: var(--bg-panel); border: 1px solid var(--bat-color); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 16px; position: relative; }
  .question-text { font-size: 20px; color: var(--text); line-height: 1.4; text-align: center; }
  .answer-btn { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 6px; font-family: var(--font); font-size: 18px; cursor: pointer; transition: 0.2s; text-align: left; }
  .answer-btn:hover:not(:disabled) { background: #ffffff11; border-color: #888; }
  .answer-btn.correct { background: #10b98133 !important; border-color: var(--lor-color) !important; color: #fff !important; }
  .answer-btn.wrong { background: #ff336633 !important; border-color: var(--bat-color) !important; color: #fff !important; }
  .answer-btn.selected { background: rgba(74, 158, 255, 0.2); border-color: var(--base-color); color: #fff; }
  
  .submit-ans-btn { background: var(--fot-color); border: none; color: #000; padding: 12px; border-radius: 6px; font-family: var(--font-ui); font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
  .submit-ans-btn:hover:not(:disabled) { box-shadow: 0 0 15px var(--fot-color); }
  .submit-ans-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .ai-help-btn {
    position: absolute; top: 10px; right: 10px; background: transparent; border: 1px solid var(--fot-color);
    color: var(--fot-color); width: 36px; height: 36px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; cursor: pointer; font-size: 18px; transition: 0.2s;
  }
  .ai-help-btn:hover:not(:disabled) { background: var(--fot-color); color: #000; box-shadow: 0 0 10px var(--fot-color); }
  .ai-help-btn:disabled { opacity: 0.5; cursor: wait; }
  
  .ai-model-list {
    position: absolute; top: 50px; right: 10px; background: var(--bg-panel); border: 1px solid var(--fot-color);
    border-radius: 6px; display: none; flex-direction: column; overflow: hidden; z-index: 10; box-shadow: 0 5px 15px #000;
  }
  .ai-model-list.active { display: flex; }
  .ai-model-btn {
  background: transparent; border: none; border-bottom: 1px solid var(--border); color: var(--text);
  padding: 10px 15px; font-family: var(--font-ui); font-size: 12px; cursor: pointer; text-align: left; transition: 0.2s;
}
  .ai-model-btn:hover { background: #22d3ee22; color: var(--fot-color); }
  .ai-model-btn:last-child { border-bottom: none; }

  .battle-abort-btn {
    position: absolute; top: 10px; right: 10px; padding: 5px 10px;
    font-size: 10px; color: #ff3366; border: 1px solid #ff3366;
    background: transparent; border-radius: 4px; cursor: pointer;
    font-family: var(--font-ui); z-index: 5;
  }
  .battle-abort-btn:hover { background: #ff336622; }
  .filter-select {
    background: #ffffff; border: 1px solid #d1d5db; color: #111827;
    padding: 8px; border-radius: 6px; font-size: 12px; outline: none; width: 100%; max-width: 200px;
  }

  /* SKALA OCENY PYTAŃ (0-5) */
  .rating-scale { display: flex; gap: 6px; justify-content: center; margin-top: 10px; align-items: center; }
  .rating-scale-label { font-size: 13px; color: var(--muted); font-family: var(--font-ui); margin-right: 10px; }
  .scale-btn { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; width: 36px; height: 36px; cursor: pointer; font-size: 16px; font-family: var(--font-ui); transition: 0.2s; color: var(--muted); display: flex; align-items: center; justify-content: center; font-weight: bold; }
  .scale-btn:hover:not(:disabled) { background: #ffffff11; border-color: #888; color: #fff; }
  .scale-btn.selected { background: #10b98133; border-color: var(--lor-color); color: #fff; box-shadow: 0 0 10px #10b98133; }
  .scale-btn:disabled { cursor: default; opacity: 0.5; }
  .scale-btn.selected:disabled { opacity: 1; }

  /* TABELA WYNIKÓW AI */
  #ai-scoreboard-overlay {
    position: fixed; inset: 0; z-index: 500; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px);
    display: none; flex-direction: column; padding: 40px 20px; overflow-y: auto;
  }
  #ai-scoreboard-overlay.active { display: flex; }
  .score-table { width: 100%; max-width: 900px; margin: 0 auto; border-collapse: collapse; font-family: var(--font-ui); font-size: 14px; background: var(--bg-panel); }
  .score-table th, .score-table td { border: 1px solid var(--border); padding: 12px; text-align: center; }
  .score-table th { background: #e5e7eb; color: var(--text); }
  .score-table td.name-col { text-align: left; font-weight: bold; color: var(--accent); }
  .score-plus { color: var(--lor-color); font-weight: bold; }
  .score-minus { color: var(--bat-color); font-weight: bold; }

  /* REAKTYWACJA STYLU DLA NAKŁADEK (OVERLAY) */
  .battle-log-overlay {
    position: fixed; inset: 0; z-index: 450; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center; 
    padding: 40px 20px; overflow-y: auto;
  }
  .battle-log-overlay.active { display: flex; }

  /* TEAM MODE (TRYB DRUŻYNOWY AI) */
  .team-chat-msg { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--text); }
  .team-error-msg { background: #ffe4e6; border: 1px solid #fda4af; color: #e11d48; }
  .team-error-actions { display: flex; gap: 10px; margin-top: 15px; }
  .team-chat-msg.p1 { border-left: 4px solid var(--sto-color); }
  .team-chat-msg.p2 { border-left: 4px solid var(--kra-color); }
  .team-chat-msg.p3 { border-left: 4px solid var(--bat-color); }
  .team-chat-header { font-family: var(--font-ui); font-size: 14px; font-weight: bold; margin-bottom: 8px; color: var(--gold); }
  .team-loading { color: var(--accent); font-style: italic; font-size: 14px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

  .sub-filters { display: none; gap: 6px; justify-content: center; }
  .sub-filter-btn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 6px 12px; border-radius: 6px; font-size: 11px; font-family: var(--font-ui);
    cursor: pointer; transition: 0.2s;
  }
  .sub-filter-btn.active { border-color: var(--fot-color); color: var(--fot-color); background: #22d3ee11; }

  /* --- EXTERNAL AI OVERLAY --- */
  #ext-ai-overlay {
    position: fixed; inset: 0; z-index: 2000; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  #ext-ai-overlay.active { display: flex; }
  .ext-ai-panel {
    background: var(--bg-panel); border: 1px solid var(--fot-color); border-radius: 8px;
    width: 100%; max-width: 800px; max-height: 95vh; display: flex; flex-direction: column; gap: 15px; padding: 20px; overflow-y: auto;
  }
  .ext-ai-title { color: var(--fot-color); font-family: var(--font-ui); font-size: 18px; text-align: center; font-weight: bold; }
  .ext-ai-label { font-size: 12px; color: var(--muted); font-family: var(--font-ui); }
  .ext-ai-textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 10px; font-family: monospace; font-size: 13px; resize: vertical; min-height: 100px;
  }
  .ext-ai-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .ext-ai-model-input { display: none; flex: 1; }
  .ext-ai-model-input.active { display: block; }

  /* --- MAIN CONTENT --- */
  #content { padding: 10px; }
  
  /* Gallery Grid (Base & KRA) */
  .gallery-grid {
    display: grid; gap: 16px;
    /* Zoom kafelków bazowych: minimum 280px (da ~3 w rzędzie na desktopie) */
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  }
  /* Zoom kafelków KRA: są szersze (21:9), więc dajemy im minimum 380px */
  .gallery-grid.kra-mode { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }

  .card-tile {
    position: relative; border-radius: 8px; overflow: hidden; cursor: pointer;
    background: var(--bg-panel); border: 1px solid var(--border);
  }
  .card-tile.base-ratio { aspect-ratio: 16 / 9; }
  .card-tile.kra-ratio { aspect-ratio: 21 / 9; }
  
  .card-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-tile .label {
    position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(255,255,255,0.9));
    padding: 24px 12px 8px; font-size: 13px; font-family: var(--font-ui); color: #111;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Story Mode (Trees) */
.story-tree-row {
  background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px;
  margin-bottom: 12px; padding: 12px; overflow-x: auto;
  display: flex; flex-direction: column; gap: 10px;
  scrollbar-width: none; -ms-overflow-style: none; cursor: grab;
}
.story-tree-row::-webkit-scrollbar { display: none; }
  .timeline { display: flex; align-items: flex-end; gap: 8px; width: max-content; padding-top: 4px; }
  .story-col { display: flex; flex-direction: column; gap: 12px; }
  
  .sto-node {
    width: 280px; height: 157px; flex-shrink: 0; border: none; border-radius: 6px; overflow: hidden; cursor: pointer; position: relative;
  }
  .sto-node img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sto-node .name { position: absolute; bottom: 0; left: 0; right: 0; font-size: 12px; padding: 16px 8px 6px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: linear-gradient(transparent, #000e); color: #ccc; font-family: var(--font-ui); }
  .arrow { color: var(--muted); font-size: 18px; height: 157px; display: flex; align-items: center; justify-content: center; }

  .fot-node {
    width: 320px; flex-shrink: 0; border: 1px solid var(--const-color); border-radius: 6px; overflow: hidden; cursor: pointer;
  }
  .fot-node img { width: 100%; aspect-ratio: 21/9; object-fit: cover; display: block; }
  .fot-node .name { font-size: 12px; padding: 8px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: #000; color: var(--const-color); }

  /* --- LIGHTBOX (FULLSCREEN VIEWER) --- */
  #lightbox {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
    width: 100%; height: 100%; height: 100dvh; /* Użycie dvh ratuje przed paskami nawigacji Chrome/Safari */
    background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px);
    z-index: 100; display: none; flex-direction: column;
    overscroll-behavior: none; /* Blokuje przekazywanie gestów przewijania pod spód */
  }
  #lightbox.active { display: flex; }
  
  #lb-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 10px 15px; 
    position: absolute; top: 0; left: 0; right: 0; 
    z-index: 120; /* Wyżej niż narracja (105) */
    pointer-events: none;
  }
  #lb-info { color: var(--text); pointer-events: auto; }
  #lb-title { font-family: var(--font-ui); font-size: 14px; font-weight: bold; }
  #lb-meta { font-size: 11px; color: var(--muted); }
  
  /* --- STRZAŁKI NAWIGACJI (DESKTOP) --- */
  #lb-title-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 4px;
  }
  
  #lb-close {
    background: var(--bg-panel); border: 1px solid var(--border);
    color: var(--muted); width: 40px; height: 40px; border-radius: 50%; font-size: 20px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    pointer-events: auto; transition: 0.2s;
  }
  #lb-close:hover { background: #ff336633; color: #ff3366; }

  #lb-img-container {
    flex: 1; display: flex; flex-direction: row; align-items: center; justify-content: center;
    overflow: hidden; width: 100%; height: 100%; position: relative;
    padding: 60px 3vw 20px; box-sizing: border-box; gap: 3vw;
    /* touch-action: manipulation blokuje natywny double-tap Safari */
    touch-action: manipulation; 
  }
  #lb-img {
    width: auto; height: auto;
    max-width: 100%; max-height: 100%; 
    object-fit: contain; 
    flex-shrink: 1; min-width: 0; min-height: 0;
    transition: opacity 0.2s, transform 0.3s ease-out;
    display: block;
    cursor: default;
    will-change: transform; /* Optymalizacja dla iPada */
    -webkit-touch-callout: none; /* Blokuje menu iPada (Zapisz obraz) */
    user-select: none; /* Blokuje natywne zaznaczanie */
    touch-action: manipulation; /* Wymusza przekazanie double-tapa do JS */
  }
  #lb-img.is-zoomed {
    transform: scale(2.5); /* Powiększenie 2.5x */
  }

  /* --- NAKŁADKA NARRACJI --- */
  #lb-narrative-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.82);
    color: #e8e6e3; font-size: 26px; line-height: 1.5;
    font-family: var(--font);
    display: none; align-items: center; justify-content: center;
    text-align: center; padding: 40px 10vw;
    pointer-events: none; z-index: 105; overflow-y: auto;
    user-select: none; box-sizing: border-box;
  }
  #lb-narrative-overlay.active {
    display: flex; pointer-events: auto;
  }

  /* --- EKRAN WYBORU ŚCIEŻKI / OPCJE Z BOKU --- */
  #lb-branch-choice {
    flex: 0 0 35vw; width: 35vw; height: 100%;
    display: none; flex-direction: column; justify-content: center; z-index: 102;
  }
  .branch-options {
    display: flex; flex-direction: column; width: 100%; max-height: 100%; gap: 2vh;
    overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 0;
    scrollbar-width: none; justify-content: center; overscroll-behavior: none;
  }
  .branch-options::-webkit-scrollbar { display: none; }
  .branch-btn {
    flex: 0 0 auto; width: 100%; height: auto; aspect-ratio: 21/9;
    cursor: pointer; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.15s; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg);
  }
  .branch-btn:active { opacity: 0.85; }
  .branch-btn img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; opacity: 0.7; }
  .branch-btn span {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(255,255,255,0.9));
    padding: 30px 10px 10px; font-size: 13px; font-family: var(--font-ui);
    color: var(--text); text-align: center; pointer-events: none;
  }

  /* Specjalna, czysta klasa dla etykiet w Split-View */
  .fs-label {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(255,255,255,0.95));
    padding: 30px 10px 10px; font-size: 13px; font-family: var(--font-ui);
    color: var(--text); text-align: center; pointer-events: none; letter-spacing: 1px;
  }

  /* --- WIDOK SPLIT DLA RODZICÓW FUZJI --- */
  #lb-fusion-split {
    display: none; width: 100%; height: 100%; flex-direction: row; gap: 3vw;
  }
  #lb-fs-parents {
    flex: 0 0 35vw; width: 35vw; display: flex; flex-direction: column; gap: 2vh; 
    max-height: 100%; justify-content: center; overflow-y: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; padding: 10px 0; overscroll-behavior: none;
  }
  #lb-fs-parents::-webkit-scrollbar { display: none; }
  .fs-parent-card {
    flex: 0 0 auto; width: 100%; height: auto; aspect-ratio: 21/9;
    cursor: pointer; position: relative; overflow: hidden; border-radius: 8px; border: 1px solid var(--border); background: var(--bg);
  }
  .fs-parent-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; transition: 0.2s; display: block; }
  
  #lb-fs-main {
    flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; position: relative; cursor: pointer;
  }
  #lb-fs-main img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; box-shadow: 0 0 50px #000a; }

  /* --- NAKŁADKA NARRACJI --- */
  #lb-narrative-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.82);
    display: none; align-items: center; justify-content: center;
    padding: 60px 8vw 40px; box-sizing: border-box; /* Większy margines by pasek adresu i przyciski telefonu nie zasłaniały tekstu */
    pointer-events: none; z-index: 105; user-select: none;
  }
  #lb-narrative-overlay.active { display: flex; pointer-events: auto; }
  
  #lb-narrative-text {
    width: 100%; max-height: 100%;
    color: #e8e6e3; font-size: 24px; line-height: 1.5;
    font-family: var(--font); text-align: center;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 40px; /* Zabezpieczenie dolnego ucięcia tekstu przy przewijaniu na sam dół */
    overscroll-behavior: none; /* Całkowita izolacja przewijania tekstu */
  }
  #lb-narrative-text::-webkit-scrollbar { display: none; }

/* --- INSPIRACJA (STO) --- */
  
  #lb-inspiration-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 50;
    display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s;
  }
  #lb-inspiration-overlay.active { display: flex; opacity: 1; }
  #lb-inspiration-overlay img { 
    max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 8px; 
    transition: transform 0.3s ease-out; will-change: transform; cursor: default;
    -webkit-touch-callout: none;
    user-select: none;
    touch-action: manipulation;
  }
  #lb-inspiration-overlay img.is-zoomed { transform: scale(2.5); }

  /* Loader */
  #loader { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 200; font-family: var(--font-ui); }

/* --- STRZAŁKI NAWIGACJI (DESKTOP) --- */
  #lb-title-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
  }
  .top-nav-btn {
    background: var(--bg-panel); border: 1px solid var(--border);
    color: var(--muted); width: 22px; height: 22px; border-radius: 4px; font-size: 14px;
    display: none; align-items: center; justify-content: center; cursor: pointer;
    pointer-events: auto; transition: 0.2s; line-height: 1;
  }
  .top-nav-btn:hover { background: rgba(255,255,255,0.25); }
  
  /* Pokazuj strzałki tylko na większych ekranach (desktop) */
  #lb-inspiration-btn-desktop, #lb-narrative-btn-desktop, #lb-studio-btn-desktop {
    display: none; font-size: 16px; cursor: pointer; pointer-events: auto; transition: 0.2s;
  }
  #lb-inspiration-btn-desktop:hover, #lb-narrative-btn-desktop:hover, #lb-studio-btn-desktop:hover { transform: scale(1.1); }
  #lb-inspiration-btn-desktop.active, #lb-narrative-btn-desktop.active { color: var(--sto-color); text-shadow: 0 0 8px var(--sto-color); }
  
  /* Na mobilce pokażmy mikrofon, by był dostępny z poziomu palca */
  @media (max-width: 767px) {
      #lb-studio-btn-desktop { display: block !important; font-size: 20px; margin-left: 10px; }
  }
  
  @media (min-width: 768px) {
    .top-nav-btn { display: flex; } 
    #lb-inspiration-btn-desktop, #lb-narrative-btn-desktop { display: block; }
  }

  /* --- MANGA MODE --- */
  .manga-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); max-width: 1200px; margin: 0 auto; padding: 10px; }
  .manga-card { 
    background: var(--bg-panel); border: 1px solid var(--border); border-left: 4px solid #a855f7; 
    border-radius: 8px; padding: 15px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; justify-content: center;
  }
  .manga-card:hover { border-color: #a855f7; background: rgba(168, 85, 247, 0.05); transform: translateY(-2px); }
  .manga-title { font-family: var(--font-ui); font-size: 15px; font-weight: bold; color: var(--text); }
  .manga-meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
  
  /* OVERLAY (POP-UP) DLA MANGI */
  #manga-overlay {
    position: fixed; inset: 0; z-index: 600; background: rgba(255, 255, 255, 0.9);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  #manga-overlay.active { display: flex; }
  .manga-overlay-panel {
    background: #ffffff; border: 1px solid #a855f7; border-radius: 8px;
    width: 100%; max-width: 900px; max-height: 95vh; display: flex; flex-direction: column; 
    overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    margin-top: 30px; /* Odstęp od górnej krawędzi przeglądarki */
  }
  .manga-visual-wrap { width: 100%; margin-bottom: 20px; cursor: zoom-in; background: #eee; border-radius: 6px; overflow: hidden; aspect-ratio: 16/9; }
  .manga-visual-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  
  /* FULL SCREEN ZOOM DLA MANGI */
  #manga-full-zoom {
    position: fixed; inset: 0; z-index: 1000; background: rgba(255,255,255,0.95);
    display: none; align-items: center; justify-content: center; cursor: zoom-out;
  }
  #manga-full-zoom.active { display: flex; }
  #manga-full-zoom img { max-width: 98vw; max-height: 98vh; object-fit: contain; box-shadow: 0 0 50px rgba(0,0,0,0.2); }
  .manga-overlay-header {
    display: flex; justify-content: space-between; align-items: center; 
    padding: 15px 20px; background: #f9fafb; border-bottom: 1px solid var(--border);
  }
  .manga-overlay-title { font-family: var(--font-ui); font-size: 18px; font-weight: bold; color: #a855f7; }
  .manga-overlay-content {
    padding: 25px 20px 80px; /* Zwiększony padding na dole (80px) */
    overflow-y: auto; flex: 1; 
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 21px; 
    line-height: 1.6; 
    color: #1f2937;
    scrollbar-width: thin;
    font-weight: 400 !important; 
    font-style: normal !important;
  }
  .manga-overlay-content b, 
  .manga-overlay-content strong {
    font-weight: 700 !important; 
    color: #000000 !important; /* Bold na czarno */
    font-style: normal !important;
  }
  .manga-section-title { 
    color: #b766ff !important; font-weight: 700 !important; font-size: 22px; 
    margin: 35px 0 15px; text-transform: uppercase; display: block;
    font-style: normal !important;
  }
  .manga-section-subtitle { 
    color: #d1a3ff !important; font-weight: 700 !important; font-size: 19px; 
    margin: 25px 0 10px; display: block;
    font-style: normal !important;
  }
  .manga-close-btn {
    background: transparent; border: 1px solid var(--muted); color: var(--text);
    width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center; transition: 0.2s;
  }
  .manga-close-btn:hover { background: #ff336633; border-color: #ff3366; color: #ff3366; }

  /* Elementy sformatowanego tekstu */
  .manga-hr-main { border: none; border-top: 2px solid #a855f7; margin: 30px 0; opacity: 0.4; }
  .manga-section-title { color: #a855f7; font-family: var(--font-ui); font-weight: bold; margin-top: 25px; margin-bottom: 10px; font-size: 20px; border-bottom: 1px solid #333; padding-bottom: 5px; text-transform: uppercase; }
  .manga-section-subtitle { color: #c084fc; font-family: var(--font-ui); font-weight: bold; margin-top: 20px; margin-bottom: 8px; font-size: 16px; }
  .manga-tag { background: rgba(168, 85, 247, 0.2); color: #c084fc; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-family: monospace; }

  /* RADIO STUDIO STYLE (LIGHT MODE) */
  .radio-msg { margin-bottom: 20px; padding: 15px; border-radius: 8px; background: #f3f4f6; border: 1px solid #e5e7eb; border-left: 4px solid #9ca3af; }
  .radio-msg.active { border-left-color: #a855f7; background: #f5f3ff; border-color: #ddd6fe; }
  .radio-name { font-family: var(--font-ui); font-size: 14px; font-weight: bold; color: #7e22ce; margin-bottom: 5px; display: flex; justify-content: space-between; }
  .radio-char { font-size: 10px; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; }
  .radio-text { 
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    font-size: 20px; line-height: 1.5; color: #111827; 
  }
  
  .radio-setup-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; background: #f9fafb; border: 1px solid #e5e7eb; padding: 10px; border-radius: 6px; }
  .radio-setup-num { width: 40px; height: 40px; border-radius: 50%; background: #a855f7; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }

  /* --- WIRTUALNY STÓŁ / DECK BUILDER v12.0 --- */
  .pt-container { max-width: 98%; margin: 0 auto; padding: 10px; display: flex; flex-direction: column; gap: 15px; }
  .pt-setup-panel { display: flex; flex-direction: column; gap: 15px; max-width: 600px; margin: 0 auto; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
  .pt-row-flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .pt-grid-half { display: grid; grid-template-columns: 1fr; gap: 15px; }
  @media (min-width: 900px) { .pt-grid-half { grid-template-columns: 3.5fr 1.1fr; } } /* Maksymalne rozciągnięcie stołu na szerokich monitorach */
  
  .pt-board { display: flex; flex-direction: column; gap: 12px; }
  /* flex-wrap: wrap eliminuje rozszerzanie i rozpychanie panelu. overflow-y: hidden zapobiega pionowym scrollbarom. min-height dopasowana do kart o wysokości 210px (lub ztapowanych) */
  .pt-zone-row { display: flex; flex-wrap: wrap; gap: 15px; padding: 20px 15px; min-height: 245px; background: rgba(0,0,0,0.01); border: 1px dashed var(--border); border-radius: 6px; align-items: center; justify-content: flex-start; overflow-y: hidden; }
  .pt-zone-label { font-family: var(--font-ui); font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
  
  /* Skany kart ze Scryfall (pionowe, powiększone do 50%) na stole i ręce. Wyłączone zaznaczanie i menu iPada. */
  .pt-card-item { width: 150px; height: 210px; flex-shrink: 0; position: relative; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); background: #000; cursor: pointer; transition: transform 0.2s, border-color 0.2s; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
  .pt-card-item.tapped { transform: rotate(90deg); margin: 30px 40px; border-color: var(--gold); }
  .pt-card-item img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; display: block; }
  
  /* POWIĘKSZONY I ADAPTACYJNY PANEL ON-HOVER (MORPHING PREVIEW) */
  #pt-hover-preview { position: fixed; display: none; pointer-events: none; z-index: 2500; border-radius: 8px; border: 2px solid var(--gold); box-shadow: 0 12px 35px rgba(0,0,0,0.7); background: #000; overflow: hidden; transition: width 0.15s, height 0.15s; }
  #pt-hover-preview img { width: 100%; height: 100%; display: block; }
  .pt-card-lbl { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.85); color: #fff; font-size: 8px; text-align: center; padding: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-ui); pointer-events: none; }
  
  .pt-card-counters { position: absolute; top: 2px; left: 2px; display: flex; flex-direction: column; gap: 2px; z-index: 5; pointer-events: none; }
  .pt-badge { background: var(--bat-color); color: #fff; font-size: 7px; padding: 1px 3px; border-radius: 2px; font-family: monospace; font-weight: bold; line-height: 1; }
  .pt-badge.blue { background: var(--accent); }
  .pt-badge.gold { background: var(--gold); color: #000; }
  
  .pt-card-item.facedown img { filter: brightness(0.2) grayscale(1); }
  .pt-card-item.facedown::after { content: "MTG"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.7); font-family: var(--font-ui); font-size: 12px; letter-spacing: 1px; font-weight: bold; text-shadow: 0 0 5px #000; pointer-events: none; }
  
  .pt-attached-indicator { position: absolute; top: 2px; right: 2px; background: var(--gold); width: 8px; height: 8px; border-radius: 50%; border: 1px solid #fff; pointer-events: none; }
  .pt-attached-container { border-left: 2px dashed var(--gold); padding-left: 6px; display: flex; gap: 4px; }

  .pt-side-control { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
  
  /* OVERLAY / MODAL DLA INSPEKTORA STREF */
  .pt-modal-overlay { position: fixed; inset: 0; z-index: 1500; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; padding: 20px; }
  .pt-modal-overlay.active { display: flex; }
  .pt-modal-content { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; width: 100%; max-width: 800px; max-height: 90vh; display: flex; flex-direction: column; padding: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
  .pt-modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 15px; flex-shrink: 0; }
  .pt-modal-body { overflow-y: auto; flex: 1; padding: 5px; }
  /* minmax zwiększone do 150px, aby dopasować siatkę do większych pionowych skanów kart */
  .pt-modal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
  
  /* KREATOR TALII */
  .pt-db-card-list { display: grid; grid-template-columns: 1fr; gap: 8px; max-height: 250px; overflow-y: auto; border: 1px solid var(--border); padding: 5px; border-radius: 6px; background: var(--bg); }
  .pt-db-card-item { display: flex; justify-content: space-between; align-items: center; padding: 6px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .pt-db-card-item:last-child { border-bottom: none; }

  .pt-dialog-overlay { position: fixed; inset: 0; z-index: 4000; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; padding: 20px; }
  .pt-dialog-overlay.active { display: flex; }
  .pt-dialog-box { background: var(--bg-panel); border: 1px solid var(--gold); border-radius: 8px; width: 100%; max-width: 400px; padding: 20px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .pt-dialog-title { font-family: var(--font-ui); font-size: 16px; color: var(--gold); text-align: center; font-weight: bold; }
  .pt-dialog-input { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: var(--font); font-size: 16px; outline: none; }
  .pt-dialog-input:focus { border-color: var(--gold); }
  .pt-dialog-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }
  .pt-counter-row { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.03); border: 1px solid var(--border); padding: 8px 10px; border-radius: 6px; }
  .pt-counter-name { font-family: var(--font-ui); font-size: 14px; font-weight: bold; color: var(--text); flex: 1; }
  .pt-counter-controls { display: flex; align-items: center; gap: 8px; }
</style>
</head>
<body>

<div id="loader">Wczytywanie kart...</div>
<div id="battle-quick-view" class="battle-quick-view" onclick="this.classList.remove('active')"><img src="" alt=""></div>

<div id="team-mode-overlay" class="battle-log-overlay">
  <div id="team-mode-content-wrapper" style="max-width: 100%; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; max-height: 100%; overflow-y: auto;">
    <div id="team-mode-q" class="question-panel" style="margin-bottom: 10px; flex-shrink: 0;"></div>
    <div id="team-mode-chat"></div>
    <div id="team-mode-actions" style="display:none; text-align:center; margin-top:20px;">
       <button id="team-vote-btn" class="battle-btn" style="width:100%; font-size: 20px;">ZAGŁOSUJ (Wybór AI)</button>
    </div>
    <button id="team-abort-btn" class="battle-btn" style="margin-top:20px; background:#ff336633; font-size:12px;">PRZERWIJ I WRÓĆ DO SAMODZIELNEJ ODPOWIEDZI</button>
  </div>
</div>

<div id="ai-scoreboard-overlay">
  <button class="battle-btn" style="position: sticky; top: 0; align-self: flex-end; margin-bottom: 20px;" onclick="document.getElementById('ai-scoreboard-overlay').classList.remove('active')">ZAMKNIJ TABELĘ AI</button>
  <h2 style="text-align: center; color: var(--gold); font-family: var(--font-ui); margin-bottom: 20px;">RANKING MODELI AI</h2>
  <div id="ai-scoreboard-content"></div>
</div>

<!-- EXTERNAL AI OVERLAY -->
<div id="ext-ai-overlay">
  <div class="ext-ai-panel">
    <div class="ext-ai-title">🤖 ZEWNĘTRZNY MODEL AI</div>
    
    <div>
      <div class="ext-ai-row" style="margin-bottom: 5px;">
        <span class="ext-ai-label">1. SKOPIUJ TEN PROMPT:</span>
        <button id="ext-ai-copy-btn" class="battle-btn" style="padding: 5px 10px; font-size: 10px; background: #22d3ee33; color: var(--fot-color); border-color: var(--fot-color);">KOPIUJ DO SCHOWKA</button>
      </div>
      <textarea id="ext-ai-prompt" class="ext-ai-textarea" readonly></textarea>
    </div>

    <div>
      <span class="ext-ai-label">2. WYBIERZ LUB WPISZ NAZWĘ MODELU:</span>
      <div class="ext-ai-row" style="margin-top: 5px;">
        <select id="ext-ai-model-select" class="filter-select" style="flex: 1; max-width: 50%;">
          <option value="_new_">+ Wpisz nową nazwę...</option>
        </select>
        <input type="text" id="ext-ai-model-text" class="filter-select ext-ai-model-input active" placeholder="Np. ChatGPT 4o, Claude 3.5..." style="max-width: 50%;">
      </div>
    </div>

    <div>
      <span class="ext-ai-label">3. WKLEJ ODPOWIEDŹ Z AI:</span>
      <textarea id="ext-ai-response" class="ext-ai-textarea" style="min-height: 150px;" placeholder="Wklej tutaj to, co wygenerowało AI..."></textarea>
    </div>

    <div class="ext-ai-row" style="margin-top: 10px;">
      <button id="ext-ai-cancel-btn" class="battle-btn" style="flex: 1; background: #ff336633; padding: 12px; font-size: 14px;">PRZERWIJ</button>
      <button id="ext-ai-submit-btn" class="battle-btn" style="flex: 2; background: #10b98133; border-color: var(--lor-color); color: var(--lor-color); padding: 12px; font-size: 14px;">ZATWIERDŹ ODPOWIEDŹ</button>
    </div>
  </div>
</div>

<!-- ZONE INSPECTOR MODAL FOR PLAYTABLE -->
<!-- HOVER PREVIEW CONTAINER FOR PLAYTABLE -->
<div id="pt-hover-preview"><img id="pt-hover-preview-img" src="" alt=""></div>

<div id="playtable-modal" class="pt-modal-overlay" onclick="if(event.target===this) closePlaytableModal()">
  <div class="pt-modal-content" onclick="event.stopPropagation()">
    <div class="pt-modal-header">
      <h3 id="pt-modal-title" style="font-family:var(--font-ui); color:var(--text); margin:0;">Podgląd Strefy</h3>
      <div style="display:flex; gap:10px; align-items:center;">
         <input type="text" id="pt-modal-search" class="filter-select" placeholder="Szukaj karty..." style="display:none; padding:5px; font-size:11px; max-width:150px;">
         <button class="manga-close-btn" onclick="closePlaytableModal()">✕</button>
      </div>
    </div>
    <div id="pt-modal-body" class="pt-modal-body"></div>
  </div>
</div>

<div id="header">
  <div class="tabs" style="flex-wrap: wrap;">
    <button class="tab-btn" data-mode="base">Karty Bazowe</button>
    <button class="tab-btn" data-mode="sto">Story (Drzewa)</button>
    <button class="tab-btn" data-mode="kra">Krajobrazy</button>
    <button class="tab-btn" data-mode="fot">Fotosy</button>
    <button class="tab-btn" data-mode="const">Konstelacje</button>
    <button class="tab-btn" data-mode="best">Bestiariusz</button>
    <button class="tab-btn" data-mode="lor">Lore</button>
    <button class="tab-btn" data-mode="bat">Bitwa</button>
    <button class="tab-btn" data-mode="tale">Opowieści</button>
    <button class="tab-btn" data-mode="manga">Mangi</button>
    <button class="tab-btn" data-mode="gameshow_dash">Teleturniej</button>
    <button class="tab-btn active" data-mode="playtable">Wirtualny Stół</button>
  </div>
  <div class="filters">
    <select id="filter-set" class="filter-select">
      <option value="all">Wszystkie Sety</option>
    </select>
    <select id="filter-plan" class="filter-select">
      <option value="all">Wszystkie Plany</option>
    </select>
  </div>
  <div class="sub-filters" id="fotos-sub-bar">
    <button class="sub-filter-btn active" data-fotfilt="all">Wszystkie FOT</button>
    <button class="sub-filter-btn" data-fotfilt="base">Bazowe</button>
    <button class="sub-filter-btn" data-fotfilt="fusion">Fuzje</button>
  </div>
  <div class="sub-filters" id="const-sub-bar">
    <button class="sub-filter-btn active" data-cmode="forward">Drzewa Historii</button>

  </div>
  <div class="sub-filters" id="lore-sub-bar">
    <button class="sub-filter-btn active" data-lorfilt="all">Wszystkie</button>

    <button class="sub-filter-btn" data-lorfilt="sto">Tylko STO</button>
  </div>
  <div class="sub-filters" id="manga-sub-bar" style="display: none; gap: 10px;">

      <option value="all">Wszystkie Mangi</option>
    </select>
    <div style="display: flex; gap: 5px; align-items: center;">
      <span style="color: var(--muted); font-size: 11px; font-family: var(--font-ui);">ROZDZ.:</span>
      <input type="number" id="filter-manga-chapter-from" class="filter-select" placeholder="Od" min="1" style="width: 60px; padding: 6px;">
      <span style="color: var(--muted); font-size: 12px;">-</span>
      <input type="number" id="filter-manga-chapter-to" class="filter-select" placeholder="Do" min="1" style="width: 60px; padding: 6px;">

function savePtStateForUndo() {
   if (!playtableState.undoHistory) playtableState.undoHistory = [];
   const snapshot = {
      playerLife: playtableState.playerLife,
      aiLife: playtableState.aiLife,
      playerCounters: JSON.parse(JSON.stringify(playtableState.playerCounters)),
      aiCounters: JSON.parse(JSON.stringify(playtableState.aiCounters)),
      playerZones: JSON.parse(JSON.stringify(playtableState.playerZones)),
      aiZones: JSON.parse(JSON.stringify(playtableState.aiZones)),
      lastAction: JSON.parse(JSON.stringify(playtableState.lastAction)),
      activeTurn: playtableState.activeTurn,
      activePhase: playtableState.activePhase,
      actionLogs: JSON.parse(JSON.stringify(playtableState.actionLogs))
   };
   playtableState.undoHistory.push(snapshot);
   if (playtableState.undoHistory.length > 30) playtableState.undoHistory.shift(); // Trzyma ostatnie 30 akcji
}

function undoPtAction() {
   if (!playtableState.undoHistory || playtableState.undoHistory.length === 0) {
       showPtNotification("Brak historii ruchów do cofnięcia.");
       return;
   }
   const prevState = playtableState.undoHistory.pop();
   playtableState.playerLife = prevState.playerLife;
   playtableState.aiLife = prevState.aiLife;
   playtableState.playerCounters = prevState.playerCounters;
   playtableState.aiCounters = prevState.aiCounters;
   playtableState.playerZones = prevState.playerZones;
   playtableState.aiZones = prevState.aiZones;
   playtableState.lastAction = prevState.lastAction;
   playtableState.activeTurn = prevState.activeTurn;
   playtableState.activePhase = prevState.activePhase;
   playtableState.actionLogs = prevState.actionLogs;
   
   if (playtableState.currentInspectedZone) closePlaytableModal(); // Zabezpieczenie modala przed desynchronizacją
   
   showPtNotification("Cofnięto ostatni ruch.");
   
   const livePrompt = document.getElementById("pt-live-prompt-textarea");
   if (livePrompt) livePrompt.value = getPtPromptText();
   
   renderPlaytable();
}

function logPtAction(msg) {
  if (!playtableState.actionLogs) playtableState.actionLogs = [];
  const time = new Date().toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  playtableState.actionLogs.unshift(`[${time}] ${msg}`); // Najnowsze akcje na górę
  if (playtableState.actionLogs.length > 50) playtableState.actionLogs.pop();
  
  const logContainer = document.getElementById("pt-action-log-container");
  if (logContainer) logContainer.textContent = playtableState.actionLogs.join('\n');

  // Wymuszenie cichego, awaryjnego zapisu po każdej akcji (z 2-sekundowym opóźnieniem chroniącym przed spamem)
  if (playtableState.phase === 'play') {
      clearTimeout(window.ptAutosaveTimer);
      window.ptAutosaveTimer = setTimeout(autoSaveGameStateCloud, 2000);
  }
}

  }
  renderPlaytable();
}

function getPlaytableCardImage(cardId) {
   if (cardId >= 990001 && cardId <= 990008) {
       return getCardImageSrc({ ID: cardId });
   }
   // Pobieramy bazowe ID i ładujemy wyłącznie panoramiczną wersję FOT (21:9)
   const baseId = cardId >= 200000 ? (cardId - 200000) : cardId;
   return `./img/${baseId}FOT.png`;
}

function getPlaytableKonImage(cardId) {
   if (cardId >= 990001 && cardId <= 990008) {
       return getCardImageSrc({ ID: cardId });
   }
   // Pobieramy bazowe ID i ładujemy wersję KON (16:9)
   const baseId = cardId >= 100000 ? (cardId % 100000) : cardId;
   return `./img/${baseId}KON.png`;
}

function getPlaytableFullCardImage(cardId) {
   // Bezpośrednie przekierowanie dla lądów podstawowych i kart specjalnych
   if (cardId === 990001) return "https://api.scryfall.com/cards/named?exact=plains&format=image";
   if (cardId === 990002) return "https://api.scryfall.com/cards/named?exact=island&format=image";
   if (cardId === 990003) return "https://api.scryfall.com/cards/named?exact=swamp&format=image";
   if (cardId === 990004) return "https://api.scryfall.com/cards/named?exact=mountain&format=image";
   if (cardId === 990005) return "https://api.scryfall.com/cards/named?exact=forest&format=image";
   if (cardId === 990006) return "https://api.scryfall.com/cards/tclb/20?format=image";
   if (cardId === 990007) return "https://api.scryfall.com/cards/tmid/19?format=image&face=front";
   if (cardId === 990008) return "https://api.scryfall.com/cards/tmid/19?format=image&face=back";
   
   // Odczytujemy bazowe ID dla kart wirtualnych (FOT/LOR)
   const baseId = cardId % 100000;
   const baseCard = cardMap[baseId];
   if (!baseCard) return "./img/placeholder.png";
   
   // Tworzymy zapytanie do inteligentnego API przekierowań Scryfall
   let url = `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(baseCard.Nazwa)}`;
   
   // Jeśli w bazie posiadamy prawidłowy kod setu (np. 3-4 litery, bez spacji), dołączamy go, by pobrać konkretny druk
   if (baseCard.Set && baseCard.Set.length >= 3 && baseCard.Set.length <= 4 && !baseCard.Set.includes("-") && !baseCard.Set.includes(" ")) {
       url += `&set=${encodeURIComponent(baseCard.Set)}`;
   }
   
   url += `&format=image`;
   if (baseCard.dfcSide === 'B') {
       url += `&face=back`;
   }
   return url;
}

// Funkcja sterująca dynamicznym pozycjonowaniem i rozmiarami panelu hover (Morphing)
// Nowa, oczyszczona z nadpisań funkcja podglądu z dwoma odrębnymi torami logicznymi
function updatePtHoverPreview(cardId, clientX, clientY, isTouch = false) {
   const preview = document.getElementById("pt-hover-preview");
   const previewImg = document.getElementById("pt-hover-preview-img");
   if (!preview || !previewImg) return;
   
   const isBasicLand = cardId >= 990001 && cardId <= 990008;

   if (isTouch) {
       // TOR 1: DOTYK / IPAD (Zawsze pełnoekranowy podgląd FOT z dopasowaniem proporcji)
       previewImg.src = isBasicLand ? getPlaytableFullCardImage(cardId) : getPlaytableCardImage(cardId);
       preview.style.width = "100vw";
       preview.style.height = "100vh";
       preview.style.left = "0";
       preview.style.top = "0";
       preview.style.transform = "none";
       preview.style.pointerEvents = "auto"; // Włączamy klikalność do zamknięcia tapnięciem
       previewImg.style.objectFit = "contain"; // Zapobiega obcinaniu grafiki panoramicznej
   } else {
       // TOR 2: MYSZKA / DESKTOP (Dynamiczny morphing hover)
       // Lądy podstawowe i karty specjalne zawsze ładują pełną kartę ze Scryfall
               const isScryfall = playtableState.hoverMode === 'scryfall' || isBasicLand;
               const isKon = playtableState.hoverMode === 'kon' && !isBasicLand;
               preview.style.transform = ""; // Reset transformacji
               preview.style.pointerEvents = "none"; // Blokada migotania

               if (isScryfall) {
                   previewImg.style.objectFit = "cover";
                   previewImg.src = getPlaytableFullCardImage(cardId);
                   preview.style.width = "320px";
                   preview.style.height = "448px";
               } else if (isKon) {
                   previewImg.style.objectFit = "contain"; // Zapobiega obcinaniu niezależnie od proporcji
                   previewImg.src = getPlaytableKonImage(cardId);
                   preview.style.width = "900px";
                   
                   // Dynamiczne dopasowanie wysokości okna do naturalnych proporcji grafiki
                   if (previewImg.complete && previewImg.naturalWidth) {
                       const aspect = previewImg.naturalWidth / previewImg.naturalHeight;
                       preview.style.height = Math.round(900 / aspect) + "px";
                   } else {
                       preview.style.height = "550px"; // Bezpieczny bufor w trakcie ładowania (np. dla formatu 14:9)
                       previewImg.onload = function() {
                           if (playtableState.hoverMode === 'kon' && this.naturalWidth) {
                               const aspect = this.naturalWidth / this.naturalHeight;
                               preview.style.height = Math.round(900 / aspect) + "px";
                           }
                       };
                   }
               } else {

// --- LAZY LOADING ---
const placeholder = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    const img = e.target;
    if (e.isIntersecting) {
      if (img.src !== img.dataset.src) img.src = img.dataset.src;
    } else {
      if (img.src !== placeholder) img.src = placeholder;
    }
  });
}, { rootMargin: '400px' });

function lazy(imgEl, src) {
  imgEl.dataset.src = src;
  imgEl.src = placeholder;
  observer.observe(imgEl);
}

// --- PARSOWANIE CSV ---
function parseCSV(text) {
  const rows=[]; let i=0,n=text.length;
  while(i<n){
    const row=[];
    while(i<n&&(text[i]==='\r'||text[i]==='\n'))i++;
    if(i>=n)break;
    while(i<n&&text[i]!=='\n'&&!(text[i]==='\r'&&text[i+1]==='\n')){
      let field='';
      if(text[i]==='"'){
        i++;
        while(i<n){if(text[i]==='"'&&text[i+1]==='"'){field+='"';i+=2}else if(text[i]==='"'){i++;break}else{field+=text[i];i++}}
      }else{while(i<n&&text[i]!==','&&text[i]!=='\n'&&!(text[i]==='\r'&&text[i+1]==='\n')){field+=text[i];i++}}
      row.push(field.trim());
      if(i<n&&text[i]===',')i++;
    }
    if(row.length>1||row[0]!=='')rows.push(row);
    if(i<n&&text[i]==='\r')i++;
    if(i<n&&text[i]==='\n')i++;
  }
  return rows;
}

async function loadData() {
  try {
    // Tutaj wklej link z Google Sheets (pamiętaj o cudzysłowach):
    const sheetUrl = 'classified'; 
    
    const resp = await fetch(sheetUrl);
    if (!resp.ok) throw new Error("Nie udało się pobrać danych z Google Sheets");
    const rows = parseCSV(await resp.text());
    
    const headers = rows[0].map(h=>h.toLowerCase());
    // Nie szukamy już idIdx
    const ilIdx = headers.findIndex(h=>h.includes('ilustracja'));
    const nzIdx = headers.findIndex(h=>h.includes('nazwa'));
    const setIdx = headers.findIndex(h=>h.includes('set') || h.includes('fusion'));
    const plIdx = headers.findIndex(h=>h.includes('plan') || h.includes('setting'));
    const colIdx = headers.findIndex(h=>h.match(/^colors?|kolory?$/i));
    const narIdx = headers.findIndex(h=>h.match(/narracj|narrative/i));
    const bestIdx = headers.findIndex(h=>h.match(/bestiariusz/i));
    const lorIdx = headers.findIndex(h=>h.match(/^lore/i));

    // Parsowanie bazy
    const baseCards = rows.slice(1).map(r => {
      const ilustracja = (r[ilIdx] || '').trim();
      // Pobieranie ID z nazwy ilustracji
      const idMatch = ilustracja.match(/^\d+/);
      const id = idMatch ? parseInt(idMatch[0], 10) : NaN;
      
      const setRaw = (r[setIdx] || '').trim();
      
      const isLegacyKRA = /KRA$/i.test(ilustracja);
      const isStory = !isLegacyKRA && /^\d+\s*-\s*\d+$/.test(setRaw);
      const isFusion = !isLegacyKRA && !isStory && /^\d[\d,\s]*$/.test(setRaw); 
      const isBase = !isLegacyKRA && !isStory && !isFusion;

      let StoryFrom = null;
      let StorySeed = null;
      let Fusion = null; 

      if (isStory) {
        const parts = setRaw.split('-');
        StoryFrom = parseInt(parts[0]);
        StorySeed = parseInt(parts[1]); 
      } else if (isFusion) {
        Fusion = setRaw.split(',').map(s=>parseInt(s.trim())).filter(n=>!isNaN(n));
      }

      const kraSource = isLegacyKRA ? parseInt(setRaw) : null;

      const rawColors = (colIdx !== -1 && r[colIdx]) ? r[colIdx].trim().toUpperCase() : '';
      const hasKRA = rawColors.includes('K');
      const hasFOT = rawColors !== '' && !isStory && !isLegacyKRA;
      const narracja = (narIdx !== -1 && r[narIdx]) ? r[narIdx].trim() : null;
      
      const bestText = (bestIdx !== -1 && r[bestIdx]) ? r[bestIdx].trim() : '';
      let isDFC = false;
      let dfcTarget = null;
      let dfcSide = null;
      if (bestText.includes(',')) {
          const parts = bestText.split(',');
          if (parts.length >= 2) {
              const side = parts[1].trim().toUpperCase();
              if (side === 'F' || side === 'B') {
                  isDFC = true;
                  dfcTarget = parts[0].trim();
                  dfcSide = side;
              }
          }
      }
      const hasBEST = bestText !== '' && !isDFC;
      const lorText = (lorIdx !== -1 && r[lorIdx]) ? r[lorIdx].trim() : '';
      // Zabezpieczenie: Generuj wirtualną kartę LOR tylko jeśli to NIE jest karta STO
      const hasLOR = (lorText !== '') && !isStory && !isLegacyKRA;

      return {
            ID: id, Ilustracja: ilustracja, Nazwa: r[nzIdx] || '',
            Set: isBase ? setRaw : null, Plan: (r[plIdx] || '').trim(),
            isKRA: isLegacyKRA, isFOT: false, isStory, isBase, isFusion, Fusion, StoryFrom, StorySeed, kraSource, hasKRA, hasFOT,
            Narracja: narracja, hasBEST, BestText: bestText, isDFC, dfcTarget, dfcSide, hasLOR, LorText: lorText,
            Colors: rawColors
          };
    }).filter(c => !isNaN(c.ID) && c.Ilustracja && (c.isBase || c.isFusion || c.isStory || c.isKRA));

    const virtualCards = [];
    baseCards.forEach(c => {
      if (c.hasKRA) {
        virtualCards.push({
          ID: c.ID + 100000, 
          Ilustracja: c.ID + 'KRA', Nazwa: c.Nazwa, Set: c.Set, Plan: c.Plan,
          isKRA: true, isFOT: false, isStory: false, isBase: false, kraSource: c.ID,
          Narracja: c.Narracja // Dziedziczenie narracji
        });
      }
      if (c.hasFOT) {
        virtualCards.push({
          ID: c.ID + 200000,
          Ilustracja: c.ID + 'FOT', Nazwa: c.Nazwa, Set: c.Set, Plan: c.Plan,
          isKRA: false, isFOT: true, isStory: false, isBase: false, kraSource: c.ID,
          Narracja: c.Narracja // Dziedziczenie narracji
        });
      }
      if (c.hasBEST) {
        virtualCards.push({
          ID: c.ID + 300000,
          Ilustracja: c.ID + 'KON', Nazwa: c.Nazwa, Set: c.Set, Plan: c.Plan,
          isKRA: false, isFOT: false, isStory: false, isBase: false, isBEST: true, kraSource: c.ID,
          Narracja: c.Narracja
        });
      }
      if (c.hasLOR) {
        virtualCards.push({
          ID: c.ID + 400000,
          Ilustracja: c.ID + 'LOR', Nazwa: c.Nazwa, Set: c.Set, Plan: c.Plan,
          isKRA: false, isFOT: false, isStory: false, isBase: false, isBEST: false, isLOR: true, kraSource: c.ID,
          Narracja: c.Narracja, LorText: c.LorText // Dziedziczymy tekst do AI
        });
      }
    });

    const allCards = [...baseCards, ...virtualCards];

    allCards.forEach(c => cardMap[c.ID] = c);

    // KRA dziedziczą Set i Plan po kartach bazowych (dla legacy)
    allCards.filter(c => c.isKRA && c.ID < 100000).forEach(c => {
      const src = cardMap[c.kraSource];
      if (src) { c.Set = src.Set; c.Plan = src.Plan; if(!c.Nazwa) c.Nazwa = src.Nazwa; }
    });

    cards = allCards;
    
    // Pobieranie istniejących Opowieści z osobnego CSV
    if (TALE_CSV_URL.startsWith("http")) {
       try {
         const taleResp = await fetch(TALE_CSV_URL);
         const taleText = await taleResp.text();
         const taleRows = parseCSV(taleText);
         
         // Zabezpieczenie: pierwszy wiersz to nagłówki (ID, Frag1, Frag2...)
         taleRows.slice(1).forEach(row => {
            const tId = parseInt(row[0]);
            if (!isNaN(tId) && cardMap[tId]) {
               // Bierzemy wszystkie kolumny od 2 w górę, ignorując puste
               const frags = row.slice(1).map(f => f.trim()).filter(f => f.length > 0);
               cardMap[tId].StoryFragments = frags;
            }
         });
       } catch (e) {
         console.warn("Nie udało się pobrać arkusza opowieści:", e);
       }
    }

    // Pobieranie danych Manga
    try {
      const mangaResp = await fetch(MANGA_CSV_URL);
      const mangaText = await mangaResp.text();
      const mangaRows = parseCSV(mangaText);
      
      // Parsowanie Mangi (pomijamy wiersz nagłówka)
      mangaData = mangaRows.slice(1).map(row => {
        const id = row[0] ? row[0].trim() : "";
        const analiza = row[1] ? row[1].trim() : "";

        // Parsowanie metadanych w locie
        let mangaTitle = "Nieznana Manga";
        let chapterNum = 0;
        let chapterText = "";

        const firstSection = analiza.split('|||')[0];
        if (firstSection && firstSection.includes('**Manga:**')) {
            const cleanMeta = firstSection.replace(/\*\*/g, '').split('|').map(s => s.trim());
            const titlePart = cleanMeta.find(s => s.startsWith('Manga:'));
            const chapPart = cleanMeta.find(s => s.startsWith('Rozdział:'));
            
            if (titlePart) mangaTitle = titlePart.replace('Manga:', '').trim();
            if (chapPart) {
                chapterText = chapPart.replace('Rozdział:', '').trim();
                const numMatch = chapterText.match(/^\d+/);
                if (numMatch) chapterNum = parseInt(numMatch[0], 10);
            }
        }

        return { id, analiza, mangaTitle, chapterNum, chapterText };
      }).filter(m => m.id !== ""); // Odrzucamy puste wiersze
    } catch (e) {
      console.warn("Nie udało się pobrać arkusza Mang:", e);
    }

    initApp();

  } catch(e) {
    document.getElementById("loader").innerHTML = "Błąd: " + e.message;
  }
}

  document.getElementById("lore-sub-bar").style.display = currentMode === 'lor' ? 'flex' : 'none';
  document.getElementById("manga-sub-bar").style.display = currentMode === 'manga' ? 'flex' : 'none';

  document.querySelectorAll(".tab-btn").forEach(btn => {

      document.getElementById("const-sub-bar").style.display = currentMode === 'const' ? 'flex' : 'none';
      document.getElementById("lore-sub-bar").style.display = currentMode === 'lor' ? 'flex' : 'none';
      document.getElementById("manga-sub-bar").style.display = currentMode === 'manga' ? 'flex' : 'none';
      
      // Ukrywamy filtry (set/plan) dla Bitwy, Opowieści, Mangi, Dashboardu ORAZ Wirtualnego Stołu
      document.querySelector(".filters").style.display = (currentMode === 'bat' || currentMode === 'tale' || currentMode === 'manga' || currentMode === 'gameshow_dash' || currentMode === 'playtable') ? 'none' : 'flex';

      if (currentMode === 'gameshow_dash') {
          gameshowDashboardState.cachedSessions = null; // Wyciszenie cache, by wymusić świeże pobranie wszystkich gier z chmury
          renderGameshowDashboard();
          return;
      }

      if (currentMode === 'playtable') {
          renderPlaytable();
          return;
      }

      // --- NOWA LOGIKA: Ustawianie domyślnych sub-filtrów ---
      if (currentMode === 'fot') {
          activeFotFilter = 'base';

          document.querySelector('[data-fotfilt="base"]').classList.add('active');

          document.querySelectorAll('[data-lorfilt]').forEach(b => b.classList.remove('active'));
          document.querySelector('[data-lorfilt="lor"]').classList.add('active');
      }
      // --- KONIEC NOWEJ LOGIKI ---

      if (currentMode === 'tale') { renderTale(); return; } 
      if (currentMode === 'manga') { renderManga(); return; }
      render();
    };
  });

  // Ustawienie inicjalne (ukrywanie filtrów po odświeżeniu)
  if (currentMode === 'bat' || currentMode === 'tale' || currentMode === 'manga' || currentMode === 'playtable') {
      document.querySelector(".filters").style.display = 'none';
  }

  // Obsługa przycisków sub-filtrów (Fotosy i Konstelacje)

        activeLorFilter = btn.dataset.lorfilt;
      }
      render();
    };
  });

  setSel.onchange = (e) => { activeSet = e.target.value; render(); };
  planSel.onchange = (e) => { activePlan = e.target.value; render(); };

  render();
}

// --- RENDEROWANIE ---
function getFilteredCards(filterFunc) {
  return cards.filter(c => {
    if (!filterFunc(c)) return false;
    if (activeSet !== 'all' && c.Set !== activeSet) return false;
    if (activePlan !== 'all' && c.Plan !== activePlan) return false;
    return true;
  });
}

function render() {
  if (currentMode === 'tale') { renderTale(); return; }
  if (currentMode === 'playtable') { renderPlaytable(); return; }

  const content = document.getElementById("content");
  content.innerHTML = "";

  if (currentMode === 'base') renderGallery(getFilteredCards(c => c.isBase), 'base-ratio');
  else if (currentMode === 'kra') renderGallery(getFilteredCards(c => c.isKRA), 'kra-ratio');
  else if (currentMode === 'best') renderGallery(getFilteredCards(c => c.isBEST), 'base-ratio');
  else if (currentMode === 'bat') renderBattle();
  else if (currentMode === 'lor') {
    const list = getFilteredCards(c => {
      if (!c.isLOR && !c.isStory) return false;
      if (activeLorFilter === 'lor' && !c.isLOR) return false;
      if (activeLorFilter === 'sto' && !c.isStory) return false;
      return true;
    });
    renderGallery(list, 'base-ratio');
  } 
  else if (currentMode === 'fot') {
    const list = getFilteredCards(c => {
      if(!c.isFOT) return false;
      if(activeFotFilter === 'all') return true;
      const source = cardMap[c.kraSource];
      if(!source) return false;
      if(activeFotFilter === 'base') return source.isBase;
      if(activeFotFilter === 'fusion') return source.isFusion;
      return true;
    });
    renderGallery(list, 'kra-ratio');
  } 
  else if (currentMode === 'sto') renderStoryTrees();
  else if (currentMode === 'const') renderConstellations();
  else if (currentMode === 'manga') renderManga();
}

// --- MANGA RENDERER ---
function parseMangaTextToHTML(text) {
  if (!text) return "";
  
  let html = text
    .replace(/\|\|\|/g, '<hr class="manga-hr-main">')
    .replace(/\|\|/g, '<br><br>')
    .replace(/\|/g, '<br>')
    // Nagłówki: szukamy ciągu #, czyścimy gwiazdki z wnętrza, domykamy na końcu linii lub br
    .replace(/###+\s*(\*\*)?([\s\S]*?)\1?(?=<br>|<hr>|$)/g, (m, g, content) => {
        return `<div class="manga-section-title">${content.replace(/\*/g, '')}</div>`;
    })
    .replace(/####+\s*(\*\*)?([\s\S]*?)\1?(?=<br>|<hr>|$)/g, (m, g, content) => {
        return `<div class="manga-section-subtitle">${content.replace(/\*/g, '')}</div>`;
    })
    // Pogrubienia: używamy [\s\S] żeby łapać tekst wieloliniowy, ale ograniczamy zasięg
    .replace(/\*\*([\s\S]*?)\*\*/g, '<b>$1</b>')
    // Tagi
    .replace(/`(.*?)`/g, '<span class="manga-tag">$1</span>')
    // FINALNE CZYSZCZENIE: usuwamy wszystkie ocalałe płotki i gwiazdki (śmieci)
    .replace(/\*/g, '')
    .replace(/#/g, '');

  return `<div>${html}</div>`;
}

function getMangaVisualHTML(mObj) {
  const srcId = mObj.imageId ? mObj.imageId : mObj.id;
  return `
    <div class="manga-visual-wrap" id="visual-wrap-${mObj.id}" onclick="showMangaFullZoom('./img/${srcId}.png')">
      <img src="./img/${srcId}.png" class="manga-visual-img" onerror="document.getElementById('visual-wrap-${mObj.id}').style.display='none'">
    </div>`;
}

function showMangaFullZoom(src) {
  const zoom = document.getElementById('manga-full-zoom');
  document.getElementById('manga-full-zoom-img').src = src;
  zoom.classList.add('active');
}

function renderManga() {
  const content = document.getElementById("content");
  content.innerHTML = "";

  // Filtrowanie bazy
  const filteredManga = mangaData.filter(m => {
      if (activeMangaTitle !== 'all' && m.mangaTitle !== activeMangaTitle) return false;
      
      // Filtrowanie po numerach rozdziałów (od-do)
      if (mangaChapterFrom !== null && m.chapterNum < mangaChapterFrom) return false;
      if (mangaChapterTo !== null && m.chapterNum > mangaChapterTo) return false;
      
      return true;
  });

  if (filteredManga.length === 0) {
    content.innerHTML = "<div style='text-align:center; padding: 20px;'>Brak wyników dla tych filtrów (lub arkusz ładuje się).</div>";
    return;
  }

  const gridContainer = document.createElement("div");
  gridContainer.className = "manga-grid";

  filteredManga.forEach(manga => {
    const card = document.createElement("div");
    card.className = "manga-card";
    card.dataset.id = manga.id; // Dodajemy dataset dla łatwego powrotu
    
    card.innerHTML = `
      <div class="manga-title">${manga.mangaTitle}</div>
      <div class="manga-meta">${manga.chapterText || "Kliknij, aby przeczytać..."}</div>
    `;

    card.onclick = () => {
      mangaDiscState.manga = manga;
      mangaDiscState.contextType = 'manga'; // Oznaczamy tryb
      document.getElementById('manga-gameshow-btn-start').style.display = 'block';
      document.getElementById('manga-battle-btn-start').style.display = 'block';
      document.getElementById('manga-disc-btn-start').style.display = 'block'; // Przywracamy przyciski 
      document.getElementById('manga-tale-btn-start').style.display = 'block';

      document.getElementById('manga-overlay-title').textContent = manga.chapterText ? `${manga.mangaTitle} - Rozdział ${manga.chapterNum}` : manga.mangaTitle;
      
      let bodyHtml = ""; 
      if (manga.analiza) bodyHtml += parseMangaTextToHTML(manga.analiza);
      
      const contentOverlay = document.getElementById('manga-overlay-content');
      contentOverlay.innerHTML = bodyHtml;
      
      document.getElementById('manga-overlay').classList.add('active');
      
      // setTimeout gwarantuje, że scroll ustawi się na 0 PO wyrenderowaniu (namalowaniu) nowego widoku
      setTimeout(() => {
          contentOverlay.scrollTop = 0;
      }, 0);
    };

    gridContainer.appendChild(card);
  });

  content.appendChild(gridContainer);

  // Podpiecie przycisków w overlayu
  document.getElementById('manga-gameshow-btn-start').onclick = () => {
    document.getElementById('manga-overlay').classList.remove('active');
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    currentMode = 'gameshow'; // Nowy, niewidoczny w tabach tryb
    document.querySelector(".filters").style.display = 'none';
    document.querySelectorAll(".sub-filters").forEach(sf => sf.style.display = 'none');
    
    gameshowState = {
        phase: 'setup',
        manga: mangaDiscState.manga,
        numPlayers: 4,
        numQuestions: 8,
        qGenModel: AI_MODELS[0].id,
        players: [],
        questions: [],
        currentQIdx: 0,
        currentTurnIdx: 0,
        roundStartPlayerIdx: 0,
        gameHistory: [], // Historia zakończonych rund
        roundChat: []    // Czat obecnej rundy
    };
    renderGameshow();
  };

  document.getElementById('manga-battle-btn-start').onclick = () => {
    document.getElementById('manga-overlay').classList.remove('active');
    
    // Zmiana wizualna zakładki
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelector('.tab-btn[data-mode="bat"]').classList.add("active");
    
    // Przełączenie trybów aplikacji
    currentMode = 'bat';
    document.querySelector(".filters").style.display = 'none';
    document.querySelectorAll(".sub-filters").forEach(sf => sf.style.display = 'none');
    
    // Konfiguracja Bitwy z ominięciem Setupu
    batConfig.battleType = 'manga';
    batConfig.fighters[0] = { set: 'all', plan: 'all', mangaTitle: mangaDiscState.manga.mangaTitle, mangaChapter: mangaDiscState.manga.chapterNum, model: AI_MODELS[0].id };
    
    const cardData = {
         ID: mangaDiscState.manga.id,
         Nazwa: `${mangaDiscState.manga.mangaTitle} - ${mangaDiscState.manga.chapterText || 'Rozdział ' + mangaDiscState.manga.chapterNum}`,
         Ilustracja: mangaDiscState.manga.id,
         Plan: "Manga",
         LorText: mangaDiscState.manga.analiza,
         isManga: true
    };
    batState.fighters = [{ card: cardData, score: 0, configModel: AI_MODELS[0].id }];
    batState.phase = 'draft'; // Trafiamy od razu do fazy wyboru Modelu zadającego pytania
    renderBattle();
  };

  document.getElementById('manga-disc-btn-start').onclick = () => {
    mangaDiscState.active = true;
    mangaDiscState.mode = 'studio'; // Różnicujemy tryb: studio / tale
    mangaDiscState.phase = 'setup';
    mangaDiscState.history =[];
    mangaDiscState.chapters = [mangaDiscState.manga];
    mangaDiscState.currentIdx = 0;
    mangaDiscState.numDiscussants = 2; // Reset do domyślnej wartości
    mangaDiscState.cachedSetupSessions = null; // Wymusza pobranie nowych sesji dla rozdziału
    renderMangaDiscussion();
  };

  document.getElementById('manga-tale-btn-start').onclick = () => {
    mangaDiscState.active = true;
    mangaDiscState.mode = 'tale'; // Tryb kontynuacji
    mangaDiscState.phase = 'setup';
    mangaDiscState.history = [];
    mangaDiscState.chapters =[mangaDiscState.manga];
    mangaDiscState.currentIdx = 0;
    mangaDiscState.numDiscussants = 1; // W opowieści zawsze 1
    mangaDiscState.cachedSetupSessions = null; // Wymusza pobranie nowych sesji dla rozdziału
    renderMangaDiscussion(); 
  };
} // <--- TUTAJ DODAJESZ TEN NAWIAS ZAMYKAJĄCY FUNKCJĘ renderManga()

// Funkcja wywoływana przy otwieraniu karty mangi, aby zapamiętać którą dyskutujemy
const oldCardOnClick = null; // To obsłużymy w renderManga

function showSessionPreview(sessionId) {
  // UWAGA: Ta funkcja teraz przyjmuje tylko ID sesji, a nie cały obiekt.

  // Znajdź sesję w pamięci na nowo, żeby uniknąć problemów z referencją
