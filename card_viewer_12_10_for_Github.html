    let ratedScore = -1;
    for(let i=0; i<=5; i++) {
       const btn = document.createElement("button"); btn.className = "scale-btn"; btn.textContent = i;
       btn.onclick = () => {
          if (ratedScore !== -1) return; ratedScore = i;
          initAiModelScore(taleState.genModelId);
          const m = aiScores[taleState.genModelId];
          m.sAvg = (((m.sAvg||0)*(m.sCount||0))+i)/((m.sCount||0)+1); m.sCount = (m.sCount||0)+1;
          saveAIScores();
          ratingPanel.querySelectorAll('.scale-btn').forEach(b => { b.disabled=true; if(b.textContent==i) b.classList.add("selected"); });
       };
       ratingPanel.appendChild(btn);
    }
    arena.appendChild(ratingPanel);

    const actions = document.createElement("div"); actions.style.cssText = "display:flex; gap:15px; margin-top:20px; justify-content:center;";
    
    const rejectBtn = document.createElement("button"); rejectBtn.className = "battle-btn"; rejectBtn.textContent = "ODRZUĆ (Zbyt słabe)";
    rejectBtn.style.cssText = "background: #ff336633; font-size: 14px; padding: 12px;";
    rejectBtn.onclick = () => { taleState.phase = 'draft'; taleState.currentFragText = ""; taleState.currentContext = ""; renderTale(); };

    const acceptBtn = document.createElement("button"); acceptBtn.className = "battle-btn"; acceptBtn.textContent = "AKCEPTUJ I ZAPISZ";
    acceptBtn.style.cssText = "background: #10b98133; border-color: var(--lor-color); color: var(--lor-color);";
    acceptBtn.onclick = async () => {
       if (ratedScore === -1 && !confirm("Nie oceniłeś modelu. Akceptować mimo to?")) return;
       
       acceptBtn.disabled = true; acceptBtn.textContent = "WYSYŁANIE DO BAZY...";

       if (!taleState.mainCard.StoryFragments) taleState.mainCard.StoryFragments = [];
       taleState.mainCard.StoryFragments.push(taleState.currentFragText);
       
       if (TALE_WRITE_API_URL.startsWith("http")) {
           try {
               fetch(TALE_WRITE_API_URL, {
                   method: "POST", mode: "no-cors",
                   body: JSON.stringify({ id: taleState.mainCard.ID, fragment: taleState.currentFragText }),
                   headers: { "Content-Type": "text/plain;charset=utf-8" }
               });
               // KRYTYCZNY BUFOR CZASOWY - Czekamy, aż żądanie fizycznie opuści przeglądarkę
               await new Promise(resolve => setTimeout(resolve, 1500));
           } catch (e) {
               console.error("Błąd lokalny podczas wysyłania Opowieści:", e);
           }
       }

       taleState.currentFragText = ""; taleState.currentContext = "";
       taleState.roundFrags++;
       if (taleState.roundFrags >= 5) {
           alert("Zakończono rundę 5 fragmentów dla tej karty!");
           taleState.roundFrags = 0; taleState.phase = 'setup';
       } else {
           taleState.phase = 'draft';
       }
       renderTale();
    };
    
    actions.appendChild(rejectBtn); actions.appendChild(acceptBtn); arena.appendChild(actions); content.appendChild(arena);
  }
}

// --- BATTLE ENGINE ---

function renderBattle() {
  const content = document.getElementById("content");
  content.innerHTML = "";

  if (batState.phase === 'setup') {
    const sets = [...new Set(cards.map(c => c.Set).filter(Boolean))].sort();
    const plans = [...new Set(cards.map(c => c.Plan).filter(Boolean))].sort();
    const mangaTitles = [...new Set(mangaData.map(m => m.mangaTitle).filter(Boolean))].sort();
    
    const buildSelect = (options, value, onChange) => {
      const s = document.createElement("select"); s.className = "filter-select";
      s.add(new Option("Wszystkie", "all"));
      options.forEach(o => s.add(new Option(o, o)));
      s.value = value;
      s.onchange = onChange;
      return s;
    };

    const setupDiv = document.createElement("div"); setupDiv.className = "battle-setup";
    
    const typeToggle = document.createElement("div");
    typeToggle.style.cssText = "display: flex; gap: 10px; margin-bottom: 10px;";
    const btnMtg = document.createElement("button");
    btnMtg.className = "sub-filter-btn " + (batConfig.battleType === 'mtg' ? 'active' : '');
    btnMtg.textContent = "⚔️ LORE MTG";
    btnMtg.onclick = () => { batConfig.battleType = 'mtg'; renderBattle(); };
    
    const btnManga = document.createElement("button");
    btnManga.className = "sub-filter-btn " + (batConfig.battleType === 'manga' ? 'active' : '');
    btnManga.textContent = "📖 MANGI";
    btnManga.onclick = () => { 
        batConfig.battleType = 'manga'; 
        batConfig.fighters = [batConfig.fighters[0]]; // Tylko 1 slot dla Mangi
        const firstManga = mangaTitles[0] || '';
        batConfig.fighters[0].mangaTitle = batConfig.fighters[0].mangaTitle !== 'all' ? batConfig.fighters[0].mangaTitle : firstManga;
        const availableChapters = mangaData.filter(m => m.mangaTitle === batConfig.fighters[0].mangaTitle).map(m => m.chapterNum).sort((a,b)=>a-b);
        batConfig.fighters[0].mangaChapter = batConfig.fighters[0].mangaChapter || availableChapters[0];
        renderBattle(); 
    };
    
    typeToggle.appendChild(btnMtg); typeToggle.appendChild(btnManga);
    setupDiv.appendChild(typeToggle);

    const cols = document.createElement("div"); cols.className = "battle-setup-cols";
    cols.style.flexWrap = "wrap"; cols.style.justifyContent = "center";
    
    batConfig.fighters.forEach((fConfig, p) => {
      const col = document.createElement("div"); col.className = "battle-col";
      col.style.minWidth = "220px";
      col.innerHTML = `<h3 style="color:var(--bat-color); font-family:var(--font-ui)">Slot ${p+1}</h3>`;
      
      if (batConfig.battleType === 'manga') {
          col.appendChild(buildSelect(mangaTitles, fConfig.mangaTitle, e => {
              fConfig.mangaTitle = e.target.value;
              const chaps = mangaData.filter(m => m.mangaTitle === fConfig.mangaTitle).map(m => m.chapterNum).sort((a,b)=>a-b);
              fConfig.mangaChapter = chaps[0];
              renderBattle();
          }));
          const availableChapters = mangaData.filter(m => m.mangaTitle === fConfig.mangaTitle).map(m => m.chapterNum).sort((a,b)=>a-b);
          const selChap = document.createElement("select"); selChap.className = "filter-select";
          availableChapters.forEach(ch => selChap.add(new Option(`Rozdział ${ch}`, ch)));
          selChap.value = fConfig.mangaChapter;
          selChap.onchange = e => fConfig.mangaChapter = parseInt(e.target.value);
          col.appendChild(selChap);
      } else {
          col.appendChild(buildSelect(sets, fConfig.set || 'all', e => fConfig.set = e.target.value));
          col.appendChild(buildSelect(plans, fConfig.plan || 'all', e => fConfig.plan = e.target.value));
      }
      
      if (batConfig.fighters.length > 1) {
         const remBtn = document.createElement("button");
         remBtn.textContent = "Usuń slot";
         remBtn.style.cssText = "background: transparent; border: 1px solid #ff3366; color: #ff3366; border-radius: 4px; padding: 4px 8px; font-size: 10px; cursor:pointer; margin-top:5px;";
         remBtn.onclick = () => { batConfig.fighters.splice(p, 1); renderBattle(); };
         col.appendChild(remBtn);
      }
      cols.appendChild(col);
    });

    if (batConfig.battleType !== 'manga' && batConfig.fighters.length < 4) {
      const addCol = document.createElement("div"); 
      addCol.className = "battle-col";
      addCol.style.cssText = "justify-content:center; cursor:pointer; background: transparent; border: 1px dashed var(--muted); min-width: 220px; transition: 0.2s;";
      addCol.onmouseover = () => addCol.style.background = "#ffffff0a";
      addCol.onmouseout = () => addCol.style.background = "transparent";
      addCol.innerHTML = `<div style="font-size: 24px; color: var(--muted);">+</div><div style="font-size:12px; color:var(--muted); font-family:var(--font-ui);">Dodaj kolejnego</div>`;
      addCol.onclick = () => {
         const base = batConfig.fighters[0];
         batConfig.fighters.push({ set: base.set, plan: base.plan, mangaTitle: base.mangaTitle || 'all', model: base.model });
         renderBattle();
      };
      cols.appendChild(addCol);
    }

    const actionBtnsRow = document.createElement("div");
    actionBtnsRow.style.cssText = "display: flex; gap: 15px; margin-top: 10px; flex-wrap: wrap; justify-content: center;";
    
    const btn = document.createElement("button"); btn.className = "battle-btn"; 
    btn.textContent = batConfig.battleType === 'manga' ? "ROZPOCZNIJ BITWĘ" : "LOSUJ ZAWODNIKÓW";
    btn.onclick = () => rollFighters();
    actionBtnsRow.appendChild(btn);
    
    const scoreBtn = document.createElement("button");
    scoreBtn.className = "battle-btn";
    scoreBtn.style.cssText = "background: #10b98133; border-color: var(--lor-color); color: var(--lor-color);";
    scoreBtn.textContent = "RANKING AI";
    scoreBtn.onclick = showAiScoreboard;
    actionBtnsRow.appendChild(scoreBtn);

    setupDiv.appendChild(cols); 
    setupDiv.appendChild(actionBtnsRow);
    content.appendChild(setupDiv);

  } else if (batState.phase === 'draft') {
    const arena = document.createElement("div"); arena.className = "arena";
    
    const title = document.createElement("h2");
    title.style.cssText = "text-align:center; color:var(--bat-color); font-family:var(--font-ui);";
    title.textContent = "WYLOSOWANI ZAWODNICY";
    arena.appendChild(title);

    const top = document.createElement("div"); top.className = "arena-top";
    top.style.flexWrap = "wrap"; top.style.justifyContent = "center";
    
    batState.fighters.forEach((f, i) => {
       const fDiv = document.createElement("div"); fDiv.className = "arena-fighter";
       fDiv.style.maxWidth = "250px";
       fDiv.innerHTML = f.card.isManga
                 ? `<div style="font-family:var(--font-ui); font-size:16px; font-weight:bold; color:var(--text); text-align:center; margin-bottom: 10px;">${f.card.Nazwa}</div>`
                 : `<img src="./img/${f.card.Ilustracja}.png" style="cursor:zoom-in" onclick="document.getElementById('battle-quick-view').querySelector('img').src=this.src; document.getElementById('battle-quick-view').classList.add('active');">
                    <div style="font-family:var(--font-ui); font-size:12px; text-align:center; margin-bottom: 5px;">${f.card.Nazwa}</div>`;
               
               const mSel = document.createElement("select"); 
               mSel.className = "filter-select"; 
               mSel.style.cssText = "width:100%; font-size:11px; padding:4px; margin-bottom:10px;";
               AI_MODELS.forEach(m => mSel.add(new Option(m.name, m.id)));
               mSel.value = f.configModel || batConfig.fighters[i].model || AI_MODELS[0].id;
               mSel.onchange = e => {
                   f.configModel = e.target.value;
                   batConfig.fighters[i].model = e.target.value; 
               };
               fDiv.appendChild(mSel);

               if (!f.card.isManga) {
                   const reroll = document.createElement("button");
                   reroll.textContent = "Zmień (Losuj)";
                   reroll.style.cssText = "background: #22d3ee22; border: 1px solid var(--fot-color); color: var(--fot-color); padding: 6px 12px; font-size: 11px; border-radius: 4px; cursor: pointer; font-family:var(--font-ui); transition:0.2s;";
                   reroll.onmouseover = () => reroll.style.background = "#22d3ee44";
                   reroll.onmouseout = () => reroll.style.background = "#22d3ee22";
                   reroll.onclick = () => reRollFighter(i);
                   fDiv.appendChild(reroll);
               }
       top.appendChild(fDiv);
    });
    
    arena.appendChild(top);

    const actions = document.createElement("div");
    actions.style.cssText = "display:flex; gap: 15px; justify-content:center; margin-top:20px; flex-wrap:wrap;";

    const cancelBtn = document.createElement("button"); cancelBtn.className = "battle-btn"; cancelBtn.textContent = "WRÓĆ DO USTAWIEŃ";
    cancelBtn.style.cssText = "background: #ff336633; font-size: 12px; padding: 12px;";
    cancelBtn.onclick = () => { batState.phase = 'setup'; renderBattle(); };

    const genBtn = document.createElement("button"); genBtn.className = "battle-btn"; genBtn.textContent = "GENERUJ PYTANIA";
    genBtn.style.cssText = "background: #10b98133; border-color: var(--lor-color); color: var(--lor-color);";
    genBtn.onclick = () => generateQuestions();
    
    actions.appendChild(cancelBtn);
    actions.appendChild(genBtn);
    arena.appendChild(actions);

    if (batConfig.battleType === 'manga' && batState.fighters.length > 0) {
        const mangaTextContainer = document.createElement("div");
        mangaTextContainer.className = "manga-overlay-content"; 
        mangaTextContainer.style.cssText = "margin-top: 30px; border-top: 2px solid var(--border); padding-top: 20px; background: transparent;";
        mangaTextContainer.innerHTML = parseMangaTextToHTML(batState.fighters[0].card.LorText);
        arena.appendChild(mangaTextContainer);
    }

    content.appendChild(arena);
  } else if (batState.phase === 'loading') {
    const arena = document.createElement("div"); arena.className = "arena";
    arena.style.position = "relative";
    
    const abortBtn = document.createElement("button");
    abortBtn.className = "battle-abort-btn";
    abortBtn.textContent = "PRZERWIJ";
    abortBtn.onclick = () => { if(confirm("Przerwać generowanie?")) { batState.phase = 'setup'; renderBattle(); } };
    arena.appendChild(abortBtn);

    const arenaInner = document.createElement("div");
    const top = document.createElement("div"); top.className = "arena-top";
    top.style.flexWrap = "wrap"; top.style.justifyContent = "center"; top.style.opacity = "0.6";

    batState.fighters.forEach((f) => {
       const fDiv = document.createElement("div"); fDiv.className = "arena-fighter"; fDiv.style.maxWidth = "200px";
       fDiv.innerHTML = f.card.isManga 
         ? `<div style="font-family:var(--font-ui); font-size:16px; font-weight:bold; color:var(--text); text-align:center;">${f.card.Nazwa}</div>`
         : `<img src="./img/${f.card.Ilustracja}.png" style="cursor:zoom-in" onclick="document.getElementById('battle-quick-view').querySelector('img').src=this.src; document.getElementById('battle-quick-view').classList.add('active');"><div style="font-family:var(--font-ui); font-size:12px; text-align:center;">${f.card.Nazwa}</div>`;
       top.appendChild(fDiv);
    });

    arenaInner.appendChild(top);
    arenaInner.innerHTML += `<div class="arena-vs" style="color:var(--bat-color); font-size:16px; text-align:center; margin-top:20px;">Trwa czytanie lore i wymyślanie pytań...</div>`;
    arena.appendChild(arenaInner);
    content.appendChild(arena);
  } else if (batState.phase === 'battle' || batState.phase === 'end') {
    const arena = document.createElement("div"); arena.className = "arena";
    arena.style.position = "relative";

    const abortBtn = document.createElement("button");
    abortBtn.className = "battle-abort-btn";
    abortBtn.textContent = batState.phase === 'end' ? "POWRÓT" : "PRZERWIJ";
    abortBtn.onclick = () => { batState.phase = 'setup'; renderBattle(); };
    arena.appendChild(abortBtn);
    
    const top = document.createElement("div"); top.className = "arena-top";
    top.style.flexWrap = "wrap"; top.style.justifyContent = "center";
    
    const curQ = batState.q[batState.qIdx];
    
    batState.fighters.forEach((f, i) => {
       const isActive = (curQ && curQ.fIdx === i);
       const fDiv = document.createElement("div"); 
       fDiv.className = `arena-fighter ${isActive ? 'active' : ''}`;
       fDiv.style.maxWidth = "200px";
       fDiv.innerHTML = `
         <div class="arena-score">${f.score}</div>
         ${f.card.isManga 
            ? `<div style="font-family:var(--font-ui); font-size:16px; font-weight:bold; color:var(--text); text-align:center;">${f.card.Nazwa}</div>` 
            : `<img src="./img/${f.card.Ilustracja}.png" style="cursor:zoom-in" onclick="document.getElementById('battle-quick-view').querySelector('img').src=this.src; document.getElementById('battle-quick-view').classList.add('active');">
               <div style="font-family:var(--font-ui); font-size:12px; text-align:center;">${f.card.Nazwa}</div>`}
       `;
       top.appendChild(fDiv);
       
       if (i < batState.fighters.length - 1 && batState.fighters.length <= 2) {
           const vs = document.createElement("div"); vs.className = "arena-vs"; vs.textContent = "VS";
           top.appendChild(vs);
       }
    });
    arena.appendChild(top);

    if (batState.phase === 'battle') {
      const qPanel = document.createElement("div"); qPanel.className = "question-panel";
      const targetFighter = batState.fighters[curQ.fIdx];
      const targetName = targetFighter.card.Nazwa;
      
      const helpBtn = document.createElement("button"); helpBtn.className = "ai-help-btn"; helpBtn.title = "Zapytaj AI"; helpBtn.textContent = "🤖";
      const modelList = document.createElement("div"); modelList.className = "ai-model-list";
      AI_MODELS.forEach(model => {
        const mBtn = document.createElement("button"); mBtn.className = "ai-model-btn"; mBtn.textContent = model.name;
        mBtn.onclick = () => { modelList.classList.remove("active"); useAIHelp(curQ, helpBtn, model.id); };
        modelList.appendChild(mBtn);
      });
      helpBtn.onclick = () => { if (!helpBtn.disabled) modelList.classList.toggle("active"); };
      
      const textDiv = document.createElement("div"); textDiv.className = "question-text";
      textDiv.innerHTML = `<b style="color:var(--bat-color)">Pytanie o planszę: ${targetName}</b><br><br>${curQ.q}`;
      
      qPanel.appendChild(helpBtn); qPanel.appendChild(modelList); qPanel.appendChild(textDiv);
      
      if (!curQ.loggedContent) {
          let qLogText = `[ZADAWANE PYTANIE ${batState.qIdx + 1}]\nTreść: ${curQ.q}\nOpcje:\n`;
          curQ.opts.forEach((opt, oi) => { qLogText += `  ${['A','B','C','D'][oi]}: ${opt}\n`; });
          sendLogEvent(qLogText.trim());
          curQ.loggedContent = true;
      }
      
      curQ.opts.forEach((optText, idx) => {
        const btn = document.createElement("button"); btn.className = "answer-btn"; btn.id = `ans-btn-${idx}`; btn.textContent = `${['A','B','C','D'][idx]}: ${optText}`;
        btn.onclick = (e) => {
          if (btn.disabled) return;
          
          modelList.classList.remove("active");
          document.querySelectorAll('.answer-btn, .ai-help-btn').forEach(b => b.disabled = true);
          
          btn.classList.add("selected");
          curQ.answeredBy = e.isTrusted ? "Gracz" : (curQ.aiModelUsed || "AI");
          
          const rawAns = curQ.ans !== undefined ? curQ.ans : [];
          const correctAnswers = Array.isArray(rawAns) ? rawAns : [rawAns];
          curQ.isCorrect = correctAnswers.includes(idx);

          const isCorrectText = curQ.isCorrect ? "DOBRZE" : "ŹLE";
          let ansLog = `[ODPOWIEDŹ] Udziela: ${curQ.answeredBy}. Wybrano: ${['A','B','C','D'][idx]}. Wynik: ${isCorrectText}.`;
          
          if (!e.isTrusted && curQ.aiModelIdUsed) {
             initAiModelScore(curQ.aiModelIdUsed);
             if (curQ.isCorrect) { aiScores[curQ.aiModelIdUsed].aUp++; } else { aiScores[curQ.aiModelIdUsed].aDown++; }
             saveAIScores();
             ansLog += ` Punkty AI zaktualizowane.`;
          }

          document.querySelectorAll('.answer-btn').forEach((b, i) => {
            b.classList.remove("selected");
            const isCorrectOption = correctAnswers.includes(i);
            if (isCorrectOption) b.classList.add("correct");
            else if (i === idx && !isCorrectOption) b.classList.add("wrong"); 
          });

          if (curQ.isCorrect) {
            targetFighter.score++;
          }
          
          ansLog += `\n>> PUNKTACJA: ${batState.fighters.map(f => f.score).join(' : ')}`;
          sendLogEvent(ansLog);

          const rPanel = document.getElementById("q-rating-panel");
          if (rPanel) rPanel.style.display = "none";
          
          setTimeout(() => {
            batState.qIdx++;
            if (batState.qIdx >= batState.q.length) {
              if (batState.phase !== 'end') {
                 batState.phase = 'end';
                 saveBattleToHistory();
              }
            }
            renderBattle();
          }, 3000);
        };
        qPanel.appendChild(btn);
      });

      const ratingPanel = document.createElement("div"); ratingPanel.className = "rating-scale"; ratingPanel.id = "q-rating-panel";
      const rLabel = document.createElement("div"); rLabel.className = "rating-scale-label"; rLabel.textContent = "Oceń pytanie:";
      ratingPanel.appendChild(rLabel);

      const handleRate = (score) => {
          if (curQ.rated !== undefined) return;
          curQ.rated = score;
          const modelId = targetFighter.genModelId; 
          initAiModelScore(modelId);
          
          let oldAvg = aiScores[modelId].qAvg || 0;
          let oldCount = aiScores[modelId].qCount || 0;
          aiScores[modelId].qAvg = ((oldAvg * oldCount) + score) / (oldCount + 1);
          aiScores[modelId].qCount = oldCount + 1;
          saveAIScores();
          
          ratingPanel.querySelectorAll('.scale-btn').forEach(b => {
             b.disabled = true;
             if(parseInt(b.dataset.val) === score) b.classList.add("selected");
          });
          sendLogEvent(`[OCENA PYTANIA] Model ${targetFighter.genModelName} otrzymał ocenę: ${score}/5`);
      };

      for(let i=0; i<=5; i++) {
         const btn = document.createElement("button"); btn.className = "scale-btn"; btn.dataset.val = i; btn.textContent = i;
         if (curQ.rated === i) btn.classList.add("selected");
         if (curQ.rated !== undefined) btn.disabled = true;
         btn.onclick = () => handleRate(i);
         ratingPanel.appendChild(btn);
      }
      qPanel.appendChild(ratingPanel);
      arena.appendChild(qPanel);
    } else {
      const endPanel = document.createElement("div"); endPanel.className = "question-panel";
      endPanel.style.alignItems = "center";
      
      const maxScore = Math.max(...batState.fighters.map(f => f.score));
      const winners = batState.fighters.filter(f => f.score === maxScore);
      
      let resText = "";
      if (batState.fighters.length === 1) {
         resText = `KONIEC TRENINGU!<br><span style="font-size:20px;color:var(--text);">Zdobywasz: ${batState.fighters[0].score} / 5</span>`;
      } else if (winners.length > 1) {
         resText = "REMIS!";
      } else {
         resText = `ZWYCIĘŻA:<br>${winners[0].card.Nazwa}`;
      }
      
      endPanel.innerHTML = `<div class="question-text" style="font-size:28px; color:var(--bat-color); font-weight:bold;">${resText}</div>`;
      const resetBtn = document.createElement("button"); resetBtn.className = "battle-btn"; resetBtn.textContent = "NOWA GRA";
      resetBtn.onclick = () => { batState.phase = 'setup'; renderBattle(); };
      endPanel.appendChild(resetBtn);
      arena.appendChild(endPanel);
    }
    
    if (batConfig.battleType === 'manga' && batState.fighters.length > 0) {
        const mangaTextContainer = document.createElement("div");
        mangaTextContainer.className = "manga-overlay-content";
        mangaTextContainer.style.cssText = "margin-top: 30px; border-top: 2px solid var(--border); padding-top: 20px; background: transparent;";
        mangaTextContainer.innerHTML = parseMangaTextToHTML(batState.fighters[0].card.LorText);
        arena.appendChild(mangaTextContainer);
    }

    content.appendChild(arena);
  }
}

function getFightersPool(cfg) {
  if (batConfig.battleType === 'manga') {
      return mangaData.filter(m => m.analiza && (cfg.mangaTitle === 'all' || m.mangaTitle === cfg.mangaTitle)).map(m => ({
          ID: m.id,
          Nazwa: `${m.mangaTitle} - ${m.chapterText || 'Rozdział ' + m.chapterNum}`,
          Ilustracja: m.id,
          Plan: "Manga",
          LorText: m.analiza,
          isManga: true
      }));
  }
  return cards.filter(c => (c.isLOR || c.isStory) && c.LorText && (cfg.set === 'all' || c.Set === cfg.set) && (cfg.plan === 'all' || c.Plan === cfg.plan));
}

function rollFighters() {
  batState.fighters = [];
  for (let i = 0; i < batConfig.fighters.length; i++) {
     if (batConfig.battleType === 'manga') {
         const cfg = batConfig.fighters[i];
         const exactManga = mangaData.find(m => m.mangaTitle === cfg.mangaTitle && m.chapterNum === cfg.mangaChapter);
         if (!exactManga) { alert("Błąd: Nie znaleziono mangi."); return; }
         const cardData = {
             ID: exactManga.id,
             Nazwa: `${exactManga.mangaTitle} - ${exactManga.chapterText || 'Rozdział ' + exactManga.chapterNum}`,
             Ilustracja: exactManga.id,
             Plan: "Manga",
             LorText: exactManga.analiza,
             isManga: true
         };
         batState.fighters.push({ card: cardData, score: 0, configModel: cfg.model });
     } else {
         const pool = getFightersPool(batConfig.fighters[i]);
         if (!pool.length) {
             alert(`Dla slotu ${i+1} brakuje kart z LORE dla wybranych filtrów!`);
             return;
         }
         const usedIds = batState.fighters.map(f => f.card.ID);
         let available = pool.filter(c => !usedIds.includes(c.ID));
         if (!available.length) available = pool; 
         
         const rolled = available[Math.floor(Math.random() * available.length)];
         batState.fighters.push({ card: rolled, score: 0, configModel: batConfig.fighters[i].model });
     }
  }
  batState.phase = 'draft';
  renderBattle();
}

function reRollFighter(idx) {
    const pool = getFightersPool(batConfig.fighters[idx]);
    const usedIds = batState.fighters.map(f => f.card.ID);
    let available = pool.filter(c => !usedIds.includes(c.ID));
    if (!available.length && pool.length > 1) available = pool.filter(c => c.ID !== batState.fighters[idx].card.ID);
    if (!available.length) available = pool;
    batState.fighters[idx].card = available[Math.floor(Math.random() * available.length)];
    renderBattle();
}

async function generateQuestions() {
  if(!OPENROUTER_API_KEY.startsWith("sk-")) {
    alert("Najpierw musisz wkleić klucz OpenRouter API w kodzie!"); return;
  }
  
  batState.phase = 'loading';
  batState.qIdx = 0;
  renderBattle();

  let logNames = batState.fighters.map((f, i) => `${i+1}. ${f.card.Nazwa} (${f.card.Plan})`).join('\n');
  sendLogEvent(`=== NOWA BITWA (GENEROWANIE) ===\nZawodnicy:\n${logNames}`);

  try {
    let allQs = [];
    for (let i=0; i < batState.fighters.length; i++) {
       const f = batState.fighters[i];
       const qs = await askAIForQuestions(f.card.LorText, f.configModel, f.card.isManga, 5);
       
       const finalModelId = (f.configModel === 'external' && batState.genModelId) ? batState.genModelId : f.configModel;
       const finalModelName = AI_MODELS.find(m => m.id === finalModelId)?.name || finalModelId;
       
       f.genModelId = finalModelId;
       f.genModelName = finalModelName;

       const sq = qs.map(q => ({...q, fIdx: i})).sort(() => Math.random() - 0.5);
       f.qList = sq.slice(0, 5); // Ucinamy do 5, tak jak prosiłeś
    }

    // Zszywamy pytania naprzemiennie (Round Robin)
    for(let qNum=0; qNum < 5; qNum++) {
       for(let fIdx=0; fIdx < batState.fighters.length; fIdx++) {
          if (batState.fighters[fIdx].qList[qNum]) {
              allQs.push(batState.fighters[fIdx].qList[qNum]);
          }
       }
    }
    batState.q = allQs;
    batState.phase = 'battle';
    renderBattle();
  } catch (e) {
      batState.phase = 'error';
      const content = document.getElementById("content");
      content.innerHTML = `
        <div style="padding:20px; max-width:800px; margin:0 auto; font-family:monospace; font-size:14px; line-height:1.5;">
          <h2 style="color:var(--bat-color); font-family:var(--font-ui); margin-bottom:20px; text-align:center;">BŁĄD GENEROWANIA BITWY</h2>
          <div style="background:#ffe4e6; border:1px solid #fda4af; color:#9f1239; padding:15px; border-radius:8px; white-space:pre-wrap; word-wrap:break-word; margin-bottom: 20px;">${e.message}</div>
          <button class="battle-btn" style="width: 100%;" onclick="batState.phase='setup'; renderBattle();">WRÓĆ DO WYBORU</button>
        </div>`;
  }
}

async function askAIForQuestions(loreText, modelId, isManga, numQs = 5, externalSignal = null) {
  let prompt = "";
  if (isManga) {
      prompt = `Jesteś krytykiem i ekspertem od mangi. Otrzymasz tekst analizy konkretnego rozdziału. 
  Stwórz DOKŁADNIE ${numQs} unikalnych pytań wielokrotnego wyboru testujących wiedzę o fabule i wydarzeniach z samej mangi (na bazie otrzymanego tekstu).
  
  BARDZO WAŻNE REGUŁY:
  1. Pytaj WYŁĄCZNIE o świat przedstawiony (postacie, fakty, techniki, miejsca, walki). Pytaj tak, jakbyś pytał fana, który czytał ten rozdział.
  2. KATEGORYCZNIE ZABRONIONE JEST używanie słów i zwrotów meta-tekstowych: notatka, analiza, w tekście, dokument, w sekcji, punkt, ilustracja, rysunek, plansza, pokazuje, opisuje, brzmi, mówi.
  3. NIE ZADAWAJ pytań typu "O czym jest sekcja pierwsza?", "Jakie jest podsumowanie analizy?". Pytaj o FAKTY ze świata mangi (np. "Kto wygrał walkę?", "Jak nazywa się atak...").`;
  } else {
      prompt = `Jesteś mistrzem fabuły (lore) światów fantasy. Otrzymasz tekst opisujący historię i świat z danej tablicy edukacyjnej. 
  Stwórz DOKŁADNIE ${numQs} unikalnych pytań wielokrotnego wyboru testujących wiedzę o lore opisanym w tym tekście.
  
  BARDZO WAŻNE REGUŁY:
  1. Pytaj WYŁĄCZNIE o opisane fakty, zjawiska, obiekty, postacie. PYTAJ O LORE opisane na tej tablicy. 
  2. NIE PYTAJ o to szczegóły graficzne ilustracji np. co jest na poszczególnych rysunkach, jakie są kolory, kto jest narysowany, co wyznacza akcent kolorystyczny itp. 
  3. KATEGORYCZNIE ZABRONIONE JEST używanie słów: notatka, ciekawostka, ilustracja, rysunek, adnotacja, plansza, tablica, mapa, diagram, wykres, kompozycja, przekrój, po prawej, po lewej, u góry, u dołu, w środku, centralna, napisano, narysowano, pokazuje, podaje, opisuje, mówi.`;
  }
  
  prompt += `\n  4. Każde pytanie musi mieć DOKŁADNIE 4 opcje (odpowiedzi).
  5. DOKŁADNIE JEDNA odpowiedź musi być poprawna. Pozostałe 3 opcje muszą być błędne.
  6. W treści pytań i odpowiedzi pod żadnym pozorem NIE UŻYWAJ znaku cudzysłowu ("). Używaj wyłącznie apostrofu (').
  7. Pytania i odpowiedzi w języku polskim.
  
  ZWRÓĆ WYNIK W FORMACIE JSON jako obiekt z kluczem "questions".
  W polu "ans" podaj indeks (od 0 do 3) jedynej poprawnej odpowiedzi.
  Format: {"questions": [{"q": "Pytanie", "opts": ["Opcja 1", "Opcja 2", "Opcja 3", "Opcja 4"], "ans": 2}]}
  
  Poprawne odpowiedzi umieszczaj możliwie równomiernie w odpowiedziach C, B i A.
  
  Analiza: "${loreText}"`;

  let text = "";

  if (modelId === "external") {
    // --- OBSŁUGA MODELU ZEWNĘTRZNEGO ---
    const extResult = await waitForExternalAI(prompt);
    text = extResult.text;
    
    // Aktualizujemy główny stan bitwy, żeby kciuki i oceny trafiały do tego konkretnego modelu
    batState.genModelId = extResult.modelId;
    batState.genModelName = extResult.modelName;
    
    // Logujemy fakt użycia modelu zewnętrznego
    sendLogEvent(`[ZEWNĘTRZNY GENERATOR PYTAŃ] Użyto modelu: ${extResult.modelName}`);

  } else {
    const controller = new AbortController();
    const activeSignal = externalSignal || controller.signal;
    const waitTimer = setTimeout(() => {
      const statusEl = document.querySelector(".arena-vs");
      if (statusEl) {
        statusEl.innerHTML = `Oczekiwanie...<br><small style="font-size:9px; color:#888;">Minęło 30s</small><br><button id="abort-gen" class="battle-btn" style="padding:5px 10px; font-size:10px; margin-top:10px; background:#ff336633;">PRZERWIJ</button>`;
        document.getElementById("abort-gen").onclick = () => {
            if (externalSignal) {
                // Jeśli przekazano zewnętrzny sygnał, przerwanie obsłuży nadrzędny przycisk
            } else {
                controller.abort();
            }
        };
      }
    }, 30000);

    try {
      const resp = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: { "Authorization": `Bearer ${OPENROUTER_API_KEY}`, "Content-Type": "application/json" },
        body: JSON.stringify({ model: modelId, messages: [{ role: "user", content: prompt }] }),
        signal: activeSignal
      });
      
      if (!resp.ok) {
        const errorBody = await resp.text();
        throw new Error(`Odrzucono żądanie HTTP (Kod: ${resp.status}). Szczegóły serwera:\n${errorBody}`);
      }
      
      const data = await resp.json();
      text = data.choices[0].message.content;
    } catch (err) {
      if (err.name === 'AbortError') throw new Error("Generowanie przerwane przez użytkownika po 30 sekundach.");
      throw err;
    } finally {
      clearTimeout(waitTimer);
    }
  }

  // --- CZYSZCZENIE I PARSOWANIE JSON ---
  text = text.replace(/```json/g, '').replace(/```/g, '').trim();
  
  // IZOLACJA JSONA: Wycięcie wstępów ("Oto pytania:") i podsumowań
  const objStart = text.indexOf('{');
  const objEnd = text.lastIndexOf('}');
  const arrStart = text.indexOf('[');
  const arrEnd = text.lastIndexOf(']');

  if (objStart !== -1 && objEnd !== -1 && objEnd > objStart) {
    text = text.substring(objStart, objEnd + 1);
  } else if (arrStart !== -1 && arrEnd !== -1 && arrEnd > arrStart) {
    text = text.substring(arrStart, arrEnd + 1);
  }

  // BARDZIEJ PANCERNE zabezpieczenie cudzysłowów i przecinków
  let cleanedText = text
    // Naprawa kluczy: {'klucz': ...} -> {"klucz": ...}
    .replace(/([\{,]\s*)'([^']+)'(\s*:)/g, '$1"$2"$3')
    // Naprawa wartości stringów (również w tablicach): ['wartość'] -> ["wartość"]
    .replace(/([\[{,:]\s*)'(.*?)'(?=\s*[,}\]])/g, (match, p1, p2) => p1 + '"' + p2.replace(/"/g, '\\"') + '"')
    // Usunięcie wiszących przecinków na końcu tablic/obiektów
    .replace(/,(?=\s*[\]}])/g, "");

  let finalQs = [];
  try {
    const parsed = JSON.parse(cleanedText);
    finalQs = parsed.questions || parsed; 
  } catch (err) {
    try {
      // Fallback 1: Naprawa zagnieżdżonych, podwójnych cudzysłowów (zastąpienie ich pojedynczymi)
      let fixedText = cleanedText.replace(/(?<![:\[,])"(?![:\],}])/g, "'");
      const parsedFixed = JSON.parse(fixedText);
      finalQs = parsedFixed.questions || parsedFixed;
    } catch (err2) {
      try {
        // Fallback 2: Obiekt JS - naprawia sytuacje, gdzie wynik nie jest idealnym JSONem, ale jest poprawnym obiektem programistycznym (natywnie ignoruje błędy apostrofów itp.)
        const parsedJs = (new Function("return " + text))();
        finalQs = parsedJs.questions || parsedJs;
      } catch (err3) {
        throw new Error("Błąd składni JSON: " + err.message + "\n\n=== SUROWA ODPOWIEDŹ AI ===\n" + text);
      }
    }
  }

  // Normalizacja wielkości liter klucza "opts" / "Opts" na poziomie wyjściowym
  if (Array.isArray(finalQs)) {
    return finalQs.map(q => {
      q.opts = q.opts || q.Opts || q.options || q.Options || [];
      return q;
    });
  }
  return finalQs;
}

  const callAI = async (prompt, isJson) => {
     let text = "";
     let activeModelName = modelName;

     if (chosenModelId === "external") {

        text = extResult.text;
        activeModelName = extResult.modelName;

     } else {
        const resp = await fetch("https://openrouter.ai/api/v1/chat/completions", {
           method: "POST",
           headers: { "Authorization": `Bearer ${OPENROUTER_API_KEY}`, "Content-Type": "application/json" },

           signal: controller.signal
        });

        const data = await resp.json();
        text = data.choices[0].message.content.trim();
     }
     
     if (isJson) {
        text = text.replace(/```json/g, '').replace(/```/g, '').trim();
        
        // Czasami AI lubi dodać tekst typu "Oto moja decyzja:" na początku. Odcinamy go.
        let objStart = text.indexOf('{');
        let objEnd = text.lastIndexOf('}');
        if (objStart !== -1 && objEnd !== -1 && objEnd > objStart) {
           text = text.substring(objStart, objEnd + 1);
        }

        let cleanedText = text
           .replace(/([\{,]\s*)'([^']+)'(\s*:)/g, '$1"$2"$3')
           .replace(/([\[{,:]\s*)'(.*?)'(?=\s*[,}\]])/g, (match, p1, p2) => p1 + '"' + p2.replace(/"/g, '\\"') + '"')
           .replace(/,(?=\s*[\]}])/g, "");

        try { return { ...JSON.parse(cleanedText), _extModelName: activeModelName }; } 
        catch (e) {
           try {
              let fixed = cleanedText.replace(/(?<![:\[,])"(?![:\],}])/g, "'");

           } catch (e2) {

                 const parsedJs = (new Function("return " + text))();
                 return { ...parsedJs, _extModelName: activeModelName };
              } catch (e3) {
                 const match = text.match(/["']?final_answer["']?\s*:\s*["']?([ABCD])["']?/i);
                 if (match) {
                    let cleanRec = text
                       .replace(/[{}]/g, '')
                       .replace(/["']?recommendation["']?\s*:\s*/i, '')

"${r1}"

${qContext}`;

Drugi gracz napisał: "${r2}"

Styl odpowiedzi: ${styleHint}. Język polski.
ZWRÓĆ WYNIK W FORMACIE JSON jako obiekt z kluczami: "recommendation" (twoja tekstowa wypowiedź) oraz "final_answer" (jedna litera wybranej odpowiedzi: A, B, C lub D).
Przykład: {"recommendation": "Zgadzam się z graczem 2, ponieważ...", "final_answer": "C"}

${qContext}`;

    const existingMsg = document.getElementById(msgId);
    if(existingMsg) existingMsg.remove();

          document.getElementById(`retry-btn-${step}`).onclick = () => {
            errorMsgBox.classList.remove("team-error-msg");
            errorMsgBox.innerHTML = `<div class="team-chat-header">${header}</div><div class="team-loading">${loadingText}</div>`;
            resolve(); // Odblokowuje pętle while, która ponawia próbę
          };
          document.getElementById(`abort-btn-${step}`).onclick = () => {
             abortBtn.onclick();
             reject(new Error("Przerwano przez użytkownika"));
          };
        });
      }
    }
  };

  (async () => {
    try {
      r1 = await executeTeamStep(1);
      r2 = await executeTeamStep(2);
      r3 = await executeTeamStep(3);

      const finalLetter = r3.final_answer.toUpperCase().trim();
      
      const summaryText = `<span style="color:#fff;">Ostateczna decyzja:</span> <b style="font-size:24px; color:var(--bat-color); padding-left: 10px;">${finalLetter}</b>`;
      const msgP3 = document.getElementById('msg-p3');
      msgP3.innerHTML += `<div style="margin-top:20px; font-size: 16px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 6px; text-align: center; border: 1px solid var(--border);">${summaryText}</div>`;

      const teamLog = `\n[TRYB DRUŻYNOWY AI: ${modelName}]\n>>> GRACZ 1:\n${r1}\n\n>>> GRACZ 2:\n${r2}\n\n>>> GRACZ 3 (KAPITAN):\n${r3.recommendation}\n\n>>> DRUŻYNA ZAGŁOSOWAŁA NA: ${finalLetter}\n`;
      sendLogEvent(teamLog);

      actionsBox.style.display = "block";
      voteBtn.textContent = `POTWIERDŹ I WYŚLIJ ODPOWIEDŹ: ${finalLetter}`;
      
      voteBtn.onclick = () => {
        closeTeamMode();
        const letterMap = {'A':0, 'B':1, 'C':2, 'D':3};
        const btnIdx = letterMap[finalLetter];
        const targetBtn = document.getElementById(`ans-btn-${btnIdx}`);
        
        if (targetBtn) {
           targetBtn.disabled = false;
           targetBtn.click();
        } else {
           alert("AI wygenerowało nieprawidłową literę: " + finalLetter);
           closeTeamMode();
        }
      };

    } catch (err) {
      if (!userAborted) {
        console.error("Przerwano tryb drużynowy z powodu błędu", err);
      }
    }
  })();
}

const BATTLE_DOC_API_URL = "classified"; // <--- WKLEJ URL DO NOWEGO SKRYPTU DOKUMENTU

function sendLogEvent(text) {
  if (!BATTLE_DOC_API_URL.startsWith("http")) return;
  const time = new Date().toLocaleTimeString("pl-PL");
  const logStr = `[${time}] ${text}`;
  
  fetch(BATTLE_DOC_API_URL, {
    method: "POST",
    mode: "no-cors", // <--- TA LINIJKA WYŁĄCZA BLOKADĘ PRZEGLĄDARKI
    body: JSON.stringify({ logText: logStr }),
    headers: { "Content-Type": "text/plain;charset=utf-8" }
  }).catch(e => console.error("Błąd logowania:", e));
}

function saveBattleToHistory() {
  const maxScore = Math.max(...batState.fighters.map(f => f.score));
  const winners = batState.fighters.filter(f => f.score === maxScore);
  
  // Aktualizacja globalnych punktów wygranych per slot, ale tylko jeśli to tryb pojedynkowy (minimum 2 zawodników)
  batState.fighters.forEach((f, i) => {
      if (f.score === maxScore && batState.fighters.length > 1) {
          battleGlobalScore[i]++;
      }
  });

  let aiUp = 0, aiDown = 0;
  batState.q.forEach(q => {
    if (q.answeredBy && q.answeredBy !== "Gracz") {
       if (q.isCorrect) aiUp++; else aiDown++;
    }
  });

  let endLog = `\n=== KONIEC BITWY ===\nWyniki:\n`;
  batState.fighters.forEach(f => {
      endLog += `${f.card.Nazwa}: ${f.score}\n`;
  });
  
  if (batState.fighters.length === 1) endLog += "Status: Trening Zakończony\n";
  else if (winners.length > 1) endLog += "Status: REMIS!\n";
  else endLog += `Zwycięża: ${winners[0].card.Nazwa}\n`;

  if (aiUp > 0 || aiDown > 0) endLog += `Punkty AI (jako gracz): Trafienia: ${aiUp}, Pudła: ${aiDown}\n`;
  
  if (batState.fighters.length > 1) {
     endLog += `Punktacja ogólna slotów: ${battleGlobalScore.slice(0, batState.fighters.length).join(' : ')}\n`;
  }
  endLog += `====================\n`;

  sendLogEvent(endLog);
}

// Drzewa Story (STO) - Liniowe (Wersja 12.4)
function renderStoryTrees() {
  const content = document.getElementById("content");
  
  const stoCards = getFilteredCards(c => c.isStory);
  if (!stoCards.length) { content.innerHTML = "<div style='text-align:center; padding: 20px;'>Brak kart STO.</div>"; return; }

  // Szukamy korzeni (karty bazowe, które są "daniem" dla jakiejś karty STO)
  const roots = cards.filter(c => c.isBase && stoCards.some(sto => sto.StoryFrom === c.ID));
  
  // Aplikujemy filtry setu/planu na korzenie
  const filteredRoots = roots.filter(root => (activeSet === 'all' || root.Set === activeSet) && (activePlan === 'all' || root.Plan === activePlan));

  if (!filteredRoots.length) { content.innerHTML = "<div style='text-align:center; padding: 20px;'>Brak drzew dla tych filtrów.</div>"; return; }

  filteredRoots.forEach(root => {
    const row = document.createElement("div");
    row.className = "story-tree-row";
    
    const timeline = document.createElement("div");
    timeline.className = "timeline";
    
    // Szukamy odpowiednika LOR dla tej karty bazowej. Jeśli z jakiegoś powodu go nie ma, użyjemy samej bazy jako ostateczności.
    const lorCard = cards.find(c => c.isLOR && c.kraSource === root.ID) || root;
    
    // Dodajemy korzeń (LOR) w kolumnie (żeby wyrównał się do dołu)
    const rootCol = document.createElement("div");
    rootCol.className = "story-col";
    rootCol.appendChild(createNodeHtml(lorCard, 'base-node'));
    timeline.appendChild(rootCol);

    // Budujemy liniowy łańcuch dwurzędowy
    let currentId = root.ID;
    while(true) {
      const child = stoCards.find(c => c.StoryFrom === currentId);
      if (!child) break;
      
      const arrow = document.createElement("div"); 
      arrow.className = "arrow"; 
      arrow.textContent = "→";
      timeline.appendChild(arrow);
      
      const stepCol = document.createElement("div");
      stepCol.className = "story-col";
      
      // Jeśli karta STO ma przyprawę (StorySeed), szukamy jej odpowiednika (LOR -> FOT -> Baza) i dodajemy na górę kolumny
      if (child.StorySeed) {
        const seedLor = cards.find(c => c.isLOR && c.kraSource === child.StorySeed);
        const seedFot = cards.find(c => c.isFOT && c.kraSource === child.StorySeed);
        const spiceCard = seedLor || seedFot || cardMap[child.StorySeed];
        
        if (spiceCard) {
          stepCol.appendChild(createNodeHtml(spiceCard, ''));
        }
      }
      
      // Dodajemy główną kartę STO na dół kolumny
      stepCol.appendChild(createNodeHtml(child, ''));
      timeline.appendChild(stepCol);
      
      currentId = child.ID;
    }

    row.appendChild(timeline);
    content.appendChild(row);
  });
}

function createNodeHtml(card, borderClass) {
  const node = document.createElement("div");
  // Klasa sto-aspect została usunięta, wszystkie węzły mają teraz z góry przypisane w CSS sztywne 16:9
  node.className = `sto-node ${borderClass}`;
  
  const img = document.createElement("img");
  lazy(img, `./img/${card.Ilustracja}.png`);
  
  const name = document.createElement("div");
  name.className = "name"; name.textContent = card.Nazwa;
  
  node.appendChild(img); node.appendChild(name);
  node.onclick = () => openLightbox(card);
  
  return node;
}

let touchstartX = 0;
let touchstartY = 0;
let lastTapTime = 0; // Powrót detekcji double-tap
let isPinchGesture = false; // Flaga blokująca losowe akcje przy pinch-to-zoom

function closeLightbox() {
  lightbox.classList.remove("active");

  // Teraz tekst opiera się wyłącznie na CSS, zachowuje 26px i pozwala na naturalny scroll.

function openLightbox(indexOrCard, forceFullscreen = false) {
  let card;
  if (typeof indexOrCard === 'number') {
    viewerIndex = indexOrCard;
    card = viewerList[viewerIndex];
  } else {
    card = indexOrCard;
  }
  
  if (!card) return;
  currentActiveCard = card;
  
  // Wyczyść stany widoczności i zresetuj licznik stron Opowieści!
  narrativePageIndex = 0;
  
  branchChoiceScreen.style.display = "none";
  clbFusionSplit.style.display = "none";
  lbImg.style.display = "none";
  lbImgContainer.style.flexDirection = "row";
  const lbNarrative = document.getElementById("lb-narrative-overlay");
  lbNarrative.classList.remove("active");

  lbTitle.textContent = card.Nazwa;
  lbMeta.textContent = [card.Set, card.Plan].filter(Boolean).join(" · ");
  
  const lbNarrativeText = document.getElementById("lb-narrative-text");
  lbNarrativeText.innerHTML = card.Narracja ? card.Narracja.replace(/\n/g, '<br>') : "";

  // ZAWSZE chowaj narrację, przyprawę i resetuj zoom przy zmianie karty
  lbNarrative.classList.remove("active");
  inspOverlay.classList.remove("active");
  lbImg.classList.remove("is-zoomed");
  inspImg.classList.remove("is-zoomed");
  document.getElementById("lb-header").style.opacity = "1";
  
  inspBtnDesktop.style.display = "none";
  inspBtnDesktop.classList.remove("active");
  narrBtnDesktop.style.display = "none";
  narrBtnDesktop.classList.remove("active");
  document.getElementById("lb-studio-btn-desktop").style.display = "none"; // Reset mikrofonu
  
  // Ukrywamy Narrację, jeśli jesteśmy w zakładkach Story lub Lore
  if (card.Narracja && currentMode !== 'sto' && currentMode !== 'lor') {
    narrBtnDesktop.style.display = "block";
  }
  
  // Pokaż Mikrofon dla kart LOR i Story (jeśli mają tekst lore/narrację)
  if ((card.isLOR || card.isStory) && (card.LorText || card.Narracja)) {
      document.getElementById("lb-studio-btn-desktop").style.display = "block";
  }

  // Pokaż Mikrofon dla kart FOT (tylko z kart bazowych z narracją)
  if (card.isFOT && card.Narracja) {
      const sourceCard = cardMap[card.kraSource];
      if (sourceCard && sourceCard.isBase) {
          document.getElementById("lb-studio-btn-desktop").style.display = "block";
      }
  }
  if (currentMode === 'sto' && card.StorySeed && cardMap[card.StorySeed]) {
    inspBtnDesktop.style.display = "block";
  }

  let showSplit = false;
  let parentFots = [];

  if (currentMode === 'const' && !forceFullscreen) {
    const baseCard = cardMap[card.kraSource];
    if (baseCard && baseCard.isFusion && baseCard.Fusion && baseCard.Fusion.length > 0) {
      parentFots = baseCard.Fusion.map(pid => cards.find(c => c.isFOT && c.kraSource === pid)).filter(Boolean);
      if (parentFots.length > 0) showSplit = true;
    }
  }

  if (showSplit) {
    viewerMode = "fusion";
    clbFusionSplit.style.display = "flex";
    const pContainer = document.getElementById("lb-fs-parents");
    pContainer.innerHTML = "";
    parentFots.forEach(pFot => {
      const pDiv = document.createElement("div");
      pDiv.className = "fs-parent-card";
      pDiv.innerHTML = `<img src="./img/${pFot.Ilustracja}.png"><div class="fs-label" style="font-size:11px; padding:25px 5px 8px;">${pFot.Nazwa}</div>`;
      pDiv.onclick = (e) => { e.stopPropagation(); openLightbox(pFot, true); };
      pContainer.appendChild(pDiv);
    });
    const mContainer = document.getElementById("lb-fs-main");
    mContainer.innerHTML = `<img src="./img/${card.Ilustracja}.png"><div class="fs-label" style="font-size:14px; padding:30px 10px 15px;">${card.Nazwa}<br><span style="font-size:9px;color:#ffd93d;letter-spacing:1px">KLIKNIJ ABY POWIĘKSZYĆ</span></div>`;
    mContainer.onclick = (e) => { e.stopPropagation(); openLightbox(card, true); };
  } else {
    viewerMode = "fullscreen";
    lbImg.style.display = "block";
    lbImg.src = `./img/${card.Ilustracja}.png`;
    lbImg.style.opacity = 1;
    lbImg.onclick = null;
  }

  lightbox.classList.add("active");
  document.body.style.overflow = "hidden";
}

function nextImg() {
  if (inspOverlay.classList.contains("active") || viewerMode === "choice") return;

  if (currentMode === 'const') {
    if (viewerMode === "fusion") {
      openLightbox(currentActiveCard, true);
      return;
    }
    const baseId = currentActiveCard.kraSource;
    const childIds = cards.filter(c => c.isFusion && c.Fusion && c.Fusion.includes(baseId)).map(c => c.ID);
    const childFots = childIds.map(cid => cards.find(f => f.isFOT && f.kraSource === cid)).filter(Boolean);
    if (childFots.length === 0) return;
    if (childFots.length > 1) {
      showBranchChoice(childFots, "right");
    } else {
      openLightbox(childFots[0], false);
    }
  } else if (currentMode === 'sto') {
    // Karta LOR to karta wirtualna, więc jej "prawdziwym" ID z bazy jest kraSource
    const baseId = currentActiveCard.isLOR ? currentActiveCard.kraSource : currentActiveCard.ID;
    const child = cards.find(c => c.StoryFrom === baseId);
    if (child) openLightbox(child);
  } else {
    if (viewerIndex + 1 < viewerList.length) openLightbox(viewerIndex + 1);
  }
}

function prevImg() {
  if (inspOverlay.classList.contains("active")) return;
  if (viewerMode === "choice") {
    openLightbox(currentActiveCard, true);
    return;
  }
  if (currentMode === 'const') {
    const baseCard = cardMap[currentActiveCard.kraSource];
    const isFusion = baseCard && baseCard.isFusion;
    if (isFusion && viewerMode === "fullscreen") {
      openLightbox(currentActiveCard, false);
      return;
    }
    if (viewerMode === "fusion") return; 
  } else if (currentMode === 'sto') {
    if (currentActiveCard.StoryFrom) {
      const parentId = currentActiveCard.StoryFrom;
      // Szukamy odpowiednika LOR dla rodzica. W ostateczności bierzemy kartę bazową.
      const parentLor = cards.find(c => c.isLOR && c.kraSource === parentId);
      const parentBase = cardMap[parentId];
      if (parentLor) openLightbox(parentLor);
      else if (parentBase) openLightbox(parentBase);
    }
  } else {
    if (viewerIndex - 1 >= 0) openLightbox(viewerIndex - 1);
  }
}

function showBranchChoice(options, side) {
  viewerMode = "choice";
  const opts = document.getElementById("lb-branch-options");
  opts.innerHTML = "";
  lbImgContainer.style.flexDirection = side === "left" ? "row-reverse" : "row";
  clbFusionSplit.style.display = "none";
  lbImg.style.display = "block";

  lbImg.onclick = () => openLightbox(currentActiveCard, true);
  options.forEach(opt => {
    const btn = document.createElement("div");
    btn.className = "branch-btn";
    btn.innerHTML = `<img src="./img/${opt.Ilustracja}.png"><span>${opt.Nazwa}</span>`;
    btn.onclick = (e) => { e.stopPropagation(); openLightbox(opt, false); };
    opts.appendChild(btn);

  branchChoiceScreen.style.display = "flex";
}

const lbNarrative = document.getElementById("lb-narrative-overlay");

lightbox.addEventListener('touchstart', e => {
  touchstartX = e.changedTouches[0].clientX;
  touchstartY = e.changedTouches[0].clientY;
  if (e.touches.length > 1) {
    lastTapTime = 0;
    isPinchGesture = true;

  }

function updateNarrativeNavVisibility() {
    const downBtn = document.getElementById('nav-down-top');
    const upBtn = document.getElementById('nav-up-top');

        downBtn.style.visibility = 'hidden';

// Pomocnicza funkcja do wyświetlania stron opowieści
function showNarrativePage(card, pageIdx) {
    const narrativeText = document.getElementById("lb-narrative-text");
    
    // Szukamy źródła: jeśli to karta wirtualna, weź dane z karty bazowej (kraSource)
    const sourceCard = card.kraSource ? cardMap[card.kraSource] : card;
    const frags = (sourceCard && sourceCard.StoryFragments) ? sourceCard.StoryFragments : [];
    const maxPage = frags.length; // 0 = Narracja, 1 = Frag1...
    
    if (pageIdx < 0 || pageIdx > maxPage) return false; // Poza zakresem
    
    if (pageIdx === 0) {
       if (!card.Narracja) return false;
       narrativeText.innerHTML = `<div style="font-size:14px; color:var(--muted); font-family:var(--font-ui); margin-bottom:10px;">LORE KARTY (BAZA)</div>` + card.Narracja.replace(/\n/g, '<br>');
    } else {
       const fragText = frags[pageIdx - 1];
       narrativeText.innerHTML = `<div style="font-size:14px; color:var(--sto-color); font-family:var(--font-ui); margin-bottom:10px;">FRAGMENT OPOWIEŚCI [${pageIdx}/${maxPage}]</div>` + fragText.replace(/\n/g, '<br>');
    }
    
    lbNarrative.classList.add("active");
    narrBtnDesktop.classList.add("active");
    narrativeText.scrollTop = 0;
    narrativePageIndex = pageIdx;
    updateNarrativeNavVisibility(); // Aktualizujemy widoczność strzałek
    return true;
}

lightbox.addEventListener('touchend', e => {
  if (isPinchGesture) {
    if (e.touches.length === 0) isPinchGesture = false;
    return;
  }

  const touchendX = e.changedTouches[0].clientX;
  const touchendY = e.changedTouches[0].clientY;
  const now = Date.now();
  const dx = touchendX - touchstartX;
  const dy = touchendY - touchstartY;
  const absDx = Math.abs(dx);
  const absDy = Math.abs(dy);
  
  if (absDx < 40 && absDy < 40) {
    if (now - lastTapTime < 300 && now - lastTapTime > 40) {
      e.preventDefault(); 
      const isSpiceActive = inspOverlay.classList.contains("active");
      const img = isSpiceActive ? document.getElementById("lb-inspiration-img") : document.getElementById("lb-img");
      if (!img) return;

      const hasJsZoom = img.classList.contains("is-zoomed");
      const hasNativeZoom = window.visualViewport && window.visualViewport.scale > 1.01;
      
      if (hasJsZoom || hasNativeZoom) {
        img.classList.remove("is-zoomed");
        document.getElementById("lb-header").style.opacity = "1";
        if (hasNativeZoom) {
          window.scrollTo(0, 0);
          const viewportMeta = document.querySelector('meta[name="viewport"]');
          if (viewportMeta) {
            viewportMeta.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no';
            setTimeout(() => viewportMeta.content = 'width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes', 50);
          }
        }
      } else {
        const rect = img.getBoundingClientRect();
        const xPercent = ((touchstartX - rect.left) / rect.width) * 100;
        const yPercent = ((touchstartY - rect.top) / rect.height) * 100;
        img.style.transformOrigin = `${xPercent}% ${yPercent}%`;
        img.classList.add("is-zoomed");
        document.getElementById("lb-header").style.opacity = "0";
      }
      lastTapTime = 0; return;
    }
    lastTapTime = now; return;
  }

  const isSpiceActiveLocal = inspOverlay.classList.contains("active");
  const activeImgForZoom = isSpiceActiveLocal ? document.getElementById("lb-inspiration-img") : document.getElementById("lb-img");
  
  if (activeImgForZoom && activeImgForZoom.classList.contains("is-zoomed")) {
    activeImgForZoom.classList.remove("is-zoomed");
    document.getElementById("lb-header").style.opacity = "1";
    return; 
  }

  if (window.visualViewport && window.visualViewport.scale > 1.05) return;

  const threshold = 60;
  
  if (absDx > absDy) {
    if (dx < -threshold) nextImg(); 
    if (dx > threshold) prevImg(); 
  } else {
    const isNarrativeActive = lbNarrative.classList.contains("active");
    const narrativeText = document.getElementById("lb-narrative-text");
    const blockNarrative = (currentMode === 'sto' || currentMode === 'lor');

    if (dy > threshold) {
      // SWIPE W DÓŁ (Poprzednia strona lub wyjście)
      if (isSpiceActiveLocal) {
        if (!isNarrativeActive && !blockNarrative) {
          const seedCard = cardMap[currentActiveCard.StorySeed];
          if (seedCard) showNarrativePage(seedCard, 0);
        }
      } else if (isNarrativeActive) {
        if (narrativeText.scrollTop <= 0) {
           if (narrativePageIndex > 0) {
              showNarrativePage(currentActiveCard, narrativePageIndex - 1);
           } else {
              lbNarrative.classList.remove("active");
              narrBtnDesktop.classList.remove("active");
           }
        }
      } else if (currentMode === 'sto' && currentActiveCard && currentActiveCard.StorySeed) {
        const seedCard = cardMap[currentActiveCard.StorySeed];
        if (seedCard) {
          inspImg.src = `./img/${seedCard.ID}${seedCard.hasLOR ? 'LOR' : 'FOT'}.png`;
          inspOverlay.classList.add("active");
          inspBtnDesktop.classList.add("active");
        }
      }
    } else if (dy < -threshold) {
      // SWIPE W GÓRĘ (Kolejna strona)
      if (isSpiceActiveLocal) {
        if (isNarrativeActive) {
           lbNarrative.classList.remove("active");
           narrBtnDesktop.classList.remove("active");
        } else {
           inspOverlay.classList.remove("active");
           inspBtnDesktop.classList.remove("active");
        }
      } else if (isNarrativeActive) {
          // Próba załadowania kolejnego fragmentu opowieści
          const maxScroll = narrativeText.scrollHeight - narrativeText.clientHeight;
          if (narrativeText.scrollTop >= maxScroll - 10) { // Tolerancja 10px
             showNarrativePage(currentActiveCard, narrativePageIndex + 1);
          }
      } else if (!blockNarrative) {
          // Otwarcie na pierwszej stronie (Narracji lub fragmencie)
          showNarrativePage(currentActiveCard, currentActiveCard.Narracja ? 0 : 1);
      }
    }
  }
}, { passive: false });

// Smart Point Zoom dla Myszki (Scroll Kółkiem)
lightbox.addEventListener('wheel', e => {
  // Ignoruj powiększanie, jeśli użytkownik przewija tekst Narracji lub opcje gałęzi/fuzji
  if (e.target.closest('#lb-narrative-text') || e.target.closest('.branch-options') || e.target.closest('#lb-fs-parents')) return;
  
  const isSpiceActive = inspOverlay.classList.contains("active");

  if (!img || img.style.display === "none") return;

  // Zatrzymujemy domyślne przesuwanie strony (np. na touchpadach)
  e.preventDefault(); 

  const isZoomedNow = img.classList.contains("is-zoomed");

  if (e.deltaY < 0 && !isZoomedNow) {
    // Scroll UP (od siebie) -> ZOOM IN
    const rect = img.getBoundingClientRect();
    const offsetX = e.clientX - rect.left;
    const offsetY = e.clientY - rect.top;
    const xPercent = (offsetX / rect.width) * 100;
    const yPercent = (offsetY / rect.height) * 100;
    
    img.style.transformOrigin = `${xPercent}% ${yPercent}%`;
    img.classList.add("is-zoomed");
    document.getElementById("lb-header").style.opacity = "0";
  } else if (e.deltaY > 0 && isZoomedNow) {
    // Scroll DOWN (do siebie) -> ZOOM OUT
    img.classList.remove("is-zoomed");
    document.getElementById("lb-header").style.opacity = "1";
  }
}, { passive: false });

// --- LPM DRAG-TO-PAN DLA RZĘDÓW (Story / Konstelacje) ---
// (Na telefonie swipe palcem działa natywnie bez JS. Skrypt obsługuje myszkę na desktopie/tabletach)
const mainContent = document.getElementById("content");
let rowDrag = false, activeRow = null, rowStartX = 0, rowScrollLeft = 0;

mainContent.addEventListener("mousedown", e => {
  activeRow = e.target.closest(".story-tree-row");
  if (!activeRow) return;
  // Blokujemy przeciąganie, jeśli kliknięto w kafelek (zapobiega konfliktom z otwieraniem lightboxa)
  if (e.target.closest(".sto-node") || e.target.tagName === 'IMG' || e.target.style.cursor === 'pointer') return;
  
  rowDrag = true;
  activeRow.style.cursor = "grabbing";
  rowStartX = e.clientX;
  rowScrollLeft = activeRow.scrollLeft;
  e.preventDefault();
});

window.addEventListener("mousemove", e => {
  if (!rowDrag || !activeRow) return;
  const walk = (e.clientX - rowStartX) * 1.5;
  activeRow.scrollLeft = rowScrollLeft - walk;
});

window.addEventListener("mouseup", () => {
  if (rowDrag && activeRow) {
    rowDrag = false;
    activeRow.style.cursor = "grab";
    activeRow = null;
  }
});
window.addEventListener("mouseleave", () => {
  if (rowDrag && activeRow) { rowDrag = false; activeRow.style.cursor = "grab"; activeRow = null; }
});

// --- WIDOK TABELI WYNIKÓW AI ---
function showAiScoreboard() {
  const container = document.getElementById("ai-scoreboard-content");
  container.innerHTML = "";
  
  const table = document.createElement("table");
  table.className = "score-table";
  table.style.fontSize = "12px"; // Trochę mniejsza czcionka, żeby 3 sekcje weszły ładnie na ekran
  
  // Nagłówki sortujące
  table.innerHTML = `
    <thead>
      <tr>
        <th rowspan="2">Model AI</th>
        <th colspan="2">Pytania (0-5)</th>
        <th colspan="2">Odpowiedzi (%)</th>
        <th colspan="2">Opowieści (0-5)</th>
        <th rowspan="2">Opcje</th>
      </tr>
      <tr>
        <th id="th-sort-generator" style="color:var(--lor-color); cursor:pointer; text-decoration: underline dashed;">Średnia ${aiScoreSortMode === 'generator' ? '▼' : ''}</th>
        <th style="color:var(--muted)">Oceny</th>
        <th id="th-sort-solver" style="color:var(--lor-color); cursor:pointer; text-decoration: underline dashed;">Skuteczność ${aiScoreSortMode === 'solver' ? '▼' : ''}</th>
        <th style="color:var(--muted)">Próby</th>
        <th id="th-sort-story" style="color:var(--sto-color); cursor:pointer; text-decoration: underline dashed;">Średnia ${aiScoreSortMode === 'story' ? '▼' : ''}</th>
        <th style="color:var(--muted)">Oceny</th>
      </tr>
    </thead>
  `;
  
  const tbody = document.createElement("tbody");
  
  const allModels = [...AI_MODELS];
  Object.keys(aiScores).forEach(id => {
      if (!allModels.find(m => m.id === id) && id !== 'external') {
          allModels.push({ id: id, name: id.replace('ext_', '').replace(/_/g, ' ') });
      }
  });
  
  // Logika potrójnego sortowania
  allModels.sort((a, b) => {
      const sA = aiScores[a.id] || {};
      const sB = aiScores[b.id] || {};
      
      if (aiScoreSortMode === 'generator') {
          const avgA = sA.qAvg !== undefined ? sA.qAvg : 0;
          const avgB = sB.qAvg !== undefined ? sB.qAvg : 0;
          if (avgB !== avgA) return avgB - avgA;
          return (sB.qCount || 0) - (sA.qCount || 0);
      } else if (aiScoreSortMode === 'story') {
          const avgA = sA.sAvg !== undefined ? sA.sAvg : 0;
          const avgB = sB.sAvg !== undefined ? sB.sAvg : 0;
          if (avgB !== avgA) return avgB - avgA;
          return (sB.sCount || 0) - (sA.sCount || 0);
      } else {
          const totalA = (sA.aUp || 0) + (sA.aDown || 0);
          const totalB = (sB.aUp || 0) + (sB.aDown || 0);
          const pctA = totalA > 0 ? (sA.aUp || 0) / totalA : -1;
          const pctB = totalB > 0 ? (sB.aUp || 0) / totalB : -1;
          if (pctB !== pctA) return pctB - pctA;
          return totalB - totalA;
      }
  });
  
  allModels.forEach(model => {
    const s = aiScores[model.id] || {};
    // Generowanie
    const qAvg = s.qAvg !== undefined ? s.qAvg : 0;
    const qCount = s.qCount !== undefined ? s.qCount : 0;
    // Odpowiedzi
    const aUp = s.aUp || 0;
    const aDown = s.aDown || 0;
    const aTotal = aUp + aDown;
    // Opowieści
    const sAvg = s.sAvg !== undefined ? s.sAvg : 0;
    const sCount = s.sCount !== undefined ? s.sCount : 0;
    
    let pctText = "-", pctColor = "var(--muted)";
    if (aTotal > 0) {
        const percentage = Math.round((aUp / aTotal) * 100);
        pctText = percentage + "%";
        if (percentage > 90) pctColor = "#10b981";      
        else if (percentage >= 75) pctColor = "#a3e635"; 
        else if (percentage >= 50) pctColor = "#ffd93d";  
        else if (percentage >= 25) pctColor = "#fb923c";  
        else pctColor = "#ff3366";                       
    }
    
    // Pokaż, jeśli cokolwiek robił
    if (qCount > 0 || aTotal > 0 || sCount > 0 || s.qUp > 0 || s.qDown > 0) {
        const tr = document.createElement("tr");
        
        let qAvgColor = "var(--gold)";
        if (qAvg >= 4) qAvgColor = "var(--lor-color)"; else if (qAvg <= 2 && qCount > 0) qAvgColor = "var(--bat-color)";
        
        let sAvgColor = "var(--gold)";
        if (sAvg >= 4) sAvgColor = "var(--lor-color)"; else if (sAvg <= 2 && sCount > 0) sAvgColor = "var(--bat-color)";

        tr.innerHTML = `
          <td class="name-col" style="font-size:14px;">${model.name}</td>
          <td style="color: ${qAvgColor}; font-weight: bold; font-size: 14px;">${qCount > 0 ? qAvg.toFixed(2) : '-'}</td>
          <td style="color: var(--muted);">${qCount}</td>
          <td style="color: ${pctColor}; font-weight: bold; font-size: 14px;">${pctText}</td>
          <td style="color: var(--muted);">${aTotal > 0 ? aTotal : '-'}</td>
          <td style="color: ${sAvgColor}; font-weight: bold; font-size: 14px;">${sCount > 0 ? sAvg.toFixed(2) : '-'}</td>
          <td style="color: var(--muted);">${sCount}</td>
          <td>
            <button class="reset-single-btn" data-id="${model.id}" title="Resetuj statystyki tego modelu">🗑️</button>
          </td>
        `;
        tbody.appendChild(tr);
    }
  });

  if (tbody.children.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 30px; color: #888;">Brak danych.</td></tr>`;
  }
  
  table.appendChild(tbody);
  container.appendChild(table);

  document.getElementById("th-sort-generator").onclick = () => { aiScoreSortMode = 'generator'; showAiScoreboard(); };
  document.getElementById("th-sort-solver").onclick = () => { aiScoreSortMode = 'solver'; showAiScoreboard(); };
  document.getElementById("th-sort-story").onclick = () => { aiScoreSortMode = 'story'; showAiScoreboard(); };

  container.querySelectorAll(".reset-single-btn").forEach(btn => {
      btn.style.cssText = "background: transparent; border: 1px solid var(--bat-color); color: var(--bat-color); border-radius: 4px; padding: 4px 8px; cursor: pointer; transition: 0.2s;";
      btn.onmouseover = () => btn.style.background = "#ff336633";
      btn.onmouseout = () => btn.style.background = "transparent";
      btn.onclick = () => {
          if(confirm(`Czy wyzerować model: ${AI_MODELS.find(m => m.id === btn.dataset.id)?.name || "AI"}?`)) {
              delete aiScores[btn.dataset.id]; saveAIScores(); showAiScoreboard();
          }
      };
  });
  
  const clearBtn = document.createElement("button");
  clearBtn.className = "battle-btn";
  clearBtn.style.cssText = "margin: 20px auto; display: block; font-size: 12px; padding: 10px; background: #ff336633;";
  clearBtn.textContent = "RESETUJ CAŁY RANKING AI";
  clearBtn.onclick = () => {
      if(confirm("Czy usunąć WSZYSTKIE oceny AI?")) { aiScores = {}; saveAIScores(); showAiScoreboard(); }
  };
  container.appendChild(clearBtn);

  document.getElementById("ai-scoreboard-overlay").classList.add("active");
}

let gameshowState = {};

function renderGameshowDashboard() {

    const dash = document.createElement("div");
    dash.className = "arena";
    dash.style.maxWidth = "800px";

    // --- PANEL 1: ROZPOCZĘCIE NOWEJ GRY ---
    const newGamePanel = document.createElement("div");
    newGamePanel.className = "question-panel";
    newGamePanel.style.borderColor = "var(--sto-color)";
    newGamePanel.innerHTML = `<div style="font-family:var(--font-ui); font-size:16px; color:var(--sto-color); font-weight:bold; margin-bottom:15px; text-align:center;">STWÓRZ NOWĄ KAMPANIĘ</div>`;
    
    // Selekt Mang
    const mTitles = [...new Set(mangaData.map(m => m.mangaTitle).filter(Boolean))].sort();
    const mSel = document.createElement("select"); mSel.className = "filter-select"; mSel.style.cssText = "width:100%; margin-bottom:15px;";
    mTitles.forEach(t => mSel.add(new Option(t, t)));
    
    // Selekt Rozdziałów
    const cSel = document.createElement("select"); cSel.className = "filter-select"; cSel.style.cssText = "width:100%; margin-bottom:20px;";
    
    const updateDashboardChapters = (mangaTitle) => {
        cSel.innerHTML = "";
        const chaps = mangaData.filter(m => m.mangaTitle === mangaTitle).map(m => m.chapterNum).sort((a,b)=>a-b);
        chaps.forEach(ch => cSel.add(new Option(`Rozdział ${ch}`, ch)));
    };

    mSel.onchange = e => updateDashboardChapters(e.target.value);
    updateDashboardChapters(mTitles[0]);

    const startBtn = document.createElement("button");
    startBtn.className = "battle-btn"; startBtn.style.width = "100%";
    startBtn.style.background = "#e07cff22"; startBtn.style.borderColor = "var(--sto-color)"; startBtn.style.color = "var(--sto-color)";
    startBtn.textContent = "ROZPOCZNIJ KAMPANIĘ TELETURNIEJOWĄ";
    startBtn.onclick = () => {
        const selManga = mangaData.find(m => m.mangaTitle === mSel.value && m.chapterNum === parseInt(cSel.value));
        if (!selManga) return;
        currentMode = 'gameshow';
        gameshowState = {
            phase: 'setup',
            manga: selManga,
            numPlayers: 4,
            numQuestions: 8,
            qGenModel: AI_MODELS[0].id,
            players: [],
            questions: [],
            currentQIdx: 0,
            currentTurnIdx: 0,
            roundStartPlayerIdx: 0,
            gameHistory: [],
            roundChat: []
        };
        renderGameshow();
    };

    newGamePanel.appendChild(mSel); newGamePanel.appendChild(cSel); newGamePanel.appendChild(startBtn);
    dash.appendChild(newGamePanel);

    // --- PANEL 2: HISTORIA AKTYWNYCH KAMPANII W CHMURZE ---
    const activePanel = document.createElement("div");
    activePanel.className = "question-panel";
    activePanel.style.marginTop = "30px";
    activePanel.innerHTML = `<div style="font-family:var(--font-ui); font-size:16px; color:var(--gold); font-weight:bold; margin-bottom:15px; text-align:center;">WZNÓW ROZPOCZĘTĄ KAMPANIĘ</div>`;
