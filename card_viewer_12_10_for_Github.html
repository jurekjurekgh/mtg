           ` : `
              <div class="pt-zone-label" style="color:var(--gold);">DECYZJA PRZECIWNIKA AI:</div>
              <div style="font-family:'Inter', sans-serif; font-size:14px; line-height:1.5; color:var(--text); white-space:pre-wrap; margin-top:5px;">${playtableState.aiResponse}</div>
           `}
        </div>

        <div style="display:flex; gap:10px; border-top:1px solid var(--border); padding-top:12px; margin-top:5px;">
           <button class="battle-btn" style="flex:1; font-size:11px; padding:8px;" onclick="saveGameStateCloud()">💾 ZAPISZ</button>
           <button class="battle-btn" style="flex:1; font-size:11px; padding:8px; background:#fef08a33; color:#ca8a04; border-color:#ca8a04;" onclick="undoPtAction()">↩️ COFNIJ</button>
           <button class="battle-btn" style="flex:1; font-size:11px; padding:8px; background:#ff336633;" onclick="showPtCustomModal({ type: 'confirm', title: 'ZAKOŃCZ GRĘ', content: 'Na pewno wyjść do menu głównego? Niezapisany stan stołu zostanie usunięty.', onConfirm: () => { playtableState.phase='setup'; renderPlaytable(); } })">🚪 ZAKOŃCZ</button>
        </div>

        <div style="margin-top:15px; border-top:1px solid var(--border); padding-top:10px;">
           <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
             <div class="pt-zone-label" style="color:var(--fot-color);">AKTUALNY PROMPT:</div>
             <button id="pt-copy-prompt-btn" class="battle-btn" style="padding:4px 8px; font-size:10px; background:#22d3ee33; color:var(--fot-color); border-color:var(--fot-color);">KOPIUJ DO SCHOWKA</button>
           </div>
           <textarea id="pt-live-prompt-textarea" class="ext-ai-textarea" readonly style="min-height:100px; font-size:11px; color:var(--muted);">${getPtPromptText()}</textarea>
        </div>
        
        <div style="margin-top:15px; border-top:1px solid var(--border); padding-top:10px;">
           <div class="pt-zone-label" style="color:var(--bat-color); margin-bottom:5px;">LOKALNY DZIENNIK AKCJI:</div>
           <div id="pt-action-log-container" style="background:var(--bg-panel); border:1px solid var(--border); border-radius:6px; padding:8px; font-size:11px; color:var(--muted); max-height:150px; overflow-y:auto; font-family:monospace; white-space:pre-wrap;">${(playtableState.actionLogs || []).length > 0 ? playtableState.actionLogs.join('\n') : 'Brak zarejestrowanych akcji.'}</div>
        </div>
      `;

      grid.appendChild(side);
      container.appendChild(grid);

      setTimeout(() => {
         const selectModel = document.getElementById("pt-model-select");
         if (selectModel) selectModel.onchange = e => playtableState.selectedModel = e.target.value;

         const selectTurn = document.getElementById("pt-turn-select");
         if (selectTurn) selectTurn.onchange = e => {
            savePtStateForUndo();
            playtableState.activeTurn = e.target.value;
            const livePrompt = document.getElementById("pt-live-prompt-textarea");
            if (livePrompt) livePrompt.value = getPtPromptText();
            logPtAction(`Zmiana tury: ${e.target.options[e.target.selectedIndex].text}`);
         };

         const selectPhase = document.getElementById("pt-phase-select");
         if (selectPhase) selectPhase.onchange = e => {
            savePtStateForUndo();
            playtableState.activePhase = e.target.value;
            const livePrompt = document.getElementById("pt-live-prompt-textarea");
            if (livePrompt) livePrompt.value = getPtPromptText();
            logPtAction(`Zmiana fazy: ${e.target.options[e.target.selectedIndex].text}`);
         };

         const askBtn = document.getElementById("pt-ask-ai-btn");
         if (askBtn) askBtn.onclick = () => triggerPlaytableAIQuery();

         const livePrompt = document.getElementById("pt-live-prompt-textarea");

         const copyBtn = document.getElementById("pt-copy-prompt-btn");
         if (copyBtn && livePrompt) {
             copyBtn.onclick = () => {
                 const wasReadonly = livePrompt.hasAttribute('readonly');
                 if (wasReadonly) livePrompt.removeAttribute('readonly'); 
                 livePrompt.focus();
                 livePrompt.select();
                 livePrompt.setSelectionRange(0, 999999);
                 try {
                     document.execCommand('copy');
                     const old = copyBtn.textContent;
                     copyBtn.textContent = "SKOPIOWANO!";
                     setTimeout(() => copyBtn.textContent = old, 2000);
                 } catch(e) {
                     showPtNotification("Błąd kopiowania do schowka.");
                 }
                 livePrompt.setSelectionRange(0, 0);
                 livePrompt.blur();
                 if (wasReadonly) livePrompt.setAttribute('readonly', 'true');
             };
         }
      }, 50);
  }

  content.appendChild(container);
  
  // Zdejmujemy tymczasową wysokość i przywracamy dokładną pozycję scrolla
  content.style.minHeight = "";
  window.scrollTo(0, prevScrollY);

  } catch(err) {
     content.style.minHeight = "";
     // Bezpieczny fallback UI w przypadku błędu połączenia z chmurą
     content.innerHTML = `
       <div style="padding:40px 20px; max-width:600px; margin:0 auto; text-align:center;">
         <h3 style="color:#e11d48; font-family:var(--font-ui); margin-bottom:20px;">BŁĄD KOMUNIKACJI Z CHMURĄ</h3>
         <div style="background:#ffe4e6; border:1px solid #fda4af; color:#9f1239; padding:15px; border-radius:8px; white-space:pre-wrap; word-wrap:break-word; margin-bottom: 20px;">${err.message}</div>
         <button class="battle-btn" style="width: 100%;" onclick="playtableState.cachedDecks=null; playtableState.cachedSaves=null; renderPlaytable();">SPRÓBUJ PONOWNIE</button>
       </div>
     `;
  }
}

// Menu biblioteki (Odkryj X kart, przeszukaj itp.)
function showLibraryMenu(isPlayer, event) {
  event.stopPropagation();
  const existing = document.getElementById("pt-active-card-menu");
  if (existing) existing.remove();

  const prefix = isPlayer ? 'player' : 'ai';
  const labelPrefix = isPlayer ? 'Gracz' : 'AI';
  const zones = isPlayer ? playtableState.playerZones : playtableState.aiZones;

  // Ukrywamy podgląd hover, by nie zasłaniał menu biblioteki
  document.getElementById("pt-hover-preview").style.display = "none";

  const menu = document.createElement("div");
  menu.id = "pt-active-card-menu";
  menu.style.cssText = "position:absolute; background:var(--bg-panel); border:1px solid var(--border); border-radius:6px; box-shadow:0 4px 15px rgba(0,0,0,0.3); z-index:2000; padding:5px; display:flex; flex-direction:column; gap:2px;";
  menu.style.left = `${event.pageX}px`;
  // Umieszczamy w górę
  const menuY = Math.max(10, event.pageY - 160);
  menu.style.top = `${menuY}px`;

  // Opcja 1: Dobierz w ciemno
  if (zones.library.length > 0) {
      const optDraw = document.createElement("button"); optDraw.className = "ai-model-btn"; optDraw.style.fontSize = "11px";
      optDraw.textContent = "Dobierz górną kartę (w ciemno)";
      optDraw.onclick = () => {
         savePtStateForUndo();
         const card = zones.library.pop();
         zones.hand.unshift(card);
         logPtAction(`Dobrano kartę z biblioteki (${labelPrefix}).`);
         renderPlaytable();
      };
      menu.appendChild(optDraw);

      const optMill = document.createElement("button"); optMill.className = "ai-model-btn"; optMill.style.fontSize = "11px";
      optMill.textContent = "Spal górną kartę (na cmentarz)";
      optMill.onclick = () => {
         savePtStateForUndo();
         const card = zones.library.pop();
         zones.graveyard.unshift(card);
         logPtAction(`Przeniesiono kartę z góry biblioteki na cmentarz (${labelPrefix}).`);
         renderPlaytable();
      };
      menu.appendChild(optMill);

      const optMillBottom = document.createElement("button"); optMillBottom.className = "ai-model-btn"; optMillBottom.style.fontSize = "11px";
      optMillBottom.textContent = "Spal dolną kartę (na cmentarz)";
      optMillBottom.onclick = () => {
         savePtStateForUndo();
         const card = zones.library.shift();
         zones.graveyard.unshift(card);
         logPtAction(`Przeniesiono kartę ze spodu biblioteki na cmentarz (${labelPrefix}).`);
         renderPlaytable();
      };
      menu.appendChild(optMillBottom);

      // Opcja 2: Odkryj górne X kart
      const optReveal = document.createElement("button"); optReveal.className = "ai-model-btn"; optReveal.style.fontSize = "11px";
      optReveal.textContent = "Odkryj górne X kart...";
      optReveal.onclick = () => {
         showPtCustomModal({
             type: 'input',
             inputType: 'number',
             title: 'ODKRYJ KARTY Z GÓRY',
             placeholder: 'Ile kart odsłonić?',
             onConfirm: (val) => {
                 const num = parseInt(val, 10);
                   if (!isNaN(num) && num > 0) {
                       const slice = zones.library.slice(-num).reverse(); // Podgląd wierzchnich kart
                       openPlaytableModal('library_reveal', isPlayer, slice);
                   }
             }
         });
      };
      menu.appendChild(optReveal);
  }

  // Opcja 3: Przeszukaj całą talię
  const optSearch = document.createElement("button"); optSearch.className = "ai-model-btn"; optSearch.style.fontSize = "11px";
  optSearch.textContent = "Przeszukaj całą bibliotekę...";
  optSearch.onclick = () => {
     playtableState.currentInspectedZone = { zoneName: 'library', isPlayer: isPlayer, limit: null };
     playtableState.currentInspectedCards = [...zones.library].reverse(); // Widok od góry do dołu
     openPlaytableModal('library', isPlayer);
  };
  menu.appendChild(optSearch);

  // Opcja 4: Przetasuj talię
  const optShuffle = document.createElement("button"); optShuffle.className = "ai-model-btn"; optShuffle.style.fontSize = "11px";
  optShuffle.textContent = "🔄 Przetasuj talię (Shuffle)";
  optShuffle.onclick = () => {
     savePtStateForUndo();
     zones.library.sort(() => Math.random() - 0.5);
     logPtAction(`Przetasowano bibliotekę (${labelPrefix}).`);
     renderPlaytable();
  };
  menu.appendChild(optShuffle);

  document.body.appendChild(menu);
  
  const clickOutside = () => { menu.remove(); document.removeEventListener("click", clickOutside); };
  setTimeout(() => document.addEventListener("click", clickOutside), 50);
}

// Menu akcji na pojedynczej karcie
function showPtCardMenu(cardInst, zoneName, event) {
  event.stopPropagation();
  const existing = document.getElementById("pt-active-card-menu");
  if (existing) existing.remove();

  // Natychmiast ukrywamy podgląd hover, aby nie zasłaniał menu akcji karty
  const hoverPrev = document.getElementById("pt-hover-preview");
  if (hoverPrev) hoverPrev.style.display = "none";

  const parts = zoneName.split("_");
  // KRYTYCZNA POPRAWKA: Odczytujemy stałego właściciela z instancji karty, z bezpiecznym fallbackiem na aktualną strefę
  const isPlayer = cardInst.owner ? (cardInst.owner === 'player') : (parts[0] === 'player');
  const zKey = parts[1]; // hand, battlefield, graveyard, exile
  const labelPrefix = isPlayer ? 'Gracz' : 'AI';

  const menu = document.createElement("div");
  menu.id = "pt-active-card-menu";
  menu.style.cssText = "position:absolute; background:var(--bg-panel); border:1px solid var(--border); border-radius:6px; box-shadow:0 4px 15px rgba(0,0,0,0.3); z-index:2000; padding:5px; display:flex; flex-direction:column; gap:2px;";
  menu.style.left = `${event.pageX}px`;
  
  // Pozycjonowanie w górę (upwards): odsuwamy menu do góry od kursora (zabezpieczenie przed wyjściem ponad górę okna)
  const menuY = Math.max(10, event.pageY - 230);
  menu.style.top = `${menuY}px`;

  const cardObj = cardInst.isToken ? { Nazwa: cardInst.name, isToken: true } : (cardMap[cardInst.cardId] || BASIC_LANDS.find(l => l.ID === cardInst.cardId));
  const cName = cardObj ? cardObj.Nazwa : "Nieznana Karta";

  // Opcje specyficzne dla POLA BITWY (Battlefield)
  if (zKey === 'battlefield') {
      if (cardObj.isDFC && (cardObj.dfcTarget || cardObj.dfcTargetId)) {
          const btnTransform = document.createElement("button"); btnTransform.className = "ai-model-btn"; btnTransform.style.fontSize = "11px";
          btnTransform.style.fontWeight = "bold"; btnTransform.style.color = "var(--sto-color)";
          btnTransform.textContent = "🔄 Transformuj (Odwróć kartę)";
          btnTransform.onclick = () => {
              let targetCard = cards.find(c => c.Ilustracja === cardObj.dfcTarget);
              if (!targetCard && cardObj.dfcTargetId) {
                  targetCard = BASIC_LANDS.find(l => l.ID === cardObj.dfcTargetId);
              }
              
              if (targetCard) {
                  savePtStateForUndo();
                  cardInst.cardId = targetCard.ID;
                  playtableState.lastAction = { instanceId: cardInst.instanceId, type: 'Transformacja' };
                  logPtAction(`Transformacja: ${cName} -> ${targetCard.Nazwa}`);
                  renderPlaytable();
              } else {
                  showPtNotification("Nie znaleziono drugiej strony karty w bazie.");
              }
          };
          menu.appendChild(btnTransform);
      }

      const hasSummoningSickness = cardInst.counters.find(c => c.name === "summoning sickness");
      if (hasSummoningSickness) {
          const optRemoveSS = document.createElement("button"); optRemoveSS.className = "ai-model-btn"; optRemoveSS.style.fontSize = "11px";
          optRemoveSS.style.color = "var(--lor-color)";
          optRemoveSS.style.fontWeight = "bold";
          optRemoveSS.textContent = "✅ Usuń summoning sickness";
          optRemoveSS.onclick = () => {
             savePtStateForUndo();
             cardInst.counters = cardInst.counters.filter(c => c.name !== "summoning sickness");
             logPtAction(`Usunięto Summoning Sickness z: ${cName}`);
             renderPlaytable();
          };
          menu.appendChild(optRemoveSS);
      }

      const hasAttackMarker = cardInst.counters.find(c => c.name === "Zadeklarował atak");
      if (hasAttackMarker) {
          const optRemoveAttack = document.createElement("button"); optRemoveAttack.className = "ai-model-btn"; optRemoveAttack.style.fontSize = "11px";
          optRemoveAttack.style.color = "var(--lor-color)";
          optRemoveAttack.style.fontWeight = "bold";
          optRemoveAttack.textContent = "✅ Usuń znacznik ataku";
          optRemoveAttack.onclick = () => {
             savePtStateForUndo();
             cardInst.counters = cardInst.counters.filter(c => c.name !== "Zadeklarował atak");
             logPtAction(`Usunięto znacznik ataku z: ${cName}`);
             renderPlaytable();
          };
          menu.appendChild(optRemoveAttack);
      }

      const isLastAction = playtableState.lastAction && playtableState.lastAction.instanceId === cardInst.instanceId;
      const optMarkAct = document.createElement("button"); optMarkAct.className = "ai-model-btn"; optMarkAct.style.fontSize = "11px";
      optMarkAct.style.color = "var(--sto-color)";
      optMarkAct.style.fontWeight = "bold";
      optMarkAct.textContent = isLastAction ? "❌ Odznacz znacznik akcji" : "⭐️ Oznacz: Ostatnio aktywowana";
      optMarkAct.onclick = () => {
         savePtStateForUndo();
         if (isLastAction) {
             playtableState.lastAction = { instanceId: null, type: null };
             logPtAction(`Usunięto znacznik akcji z: ${cName}`);
         } else {
             playtableState.lastAction = { instanceId: cardInst.instanceId, type: 'Aktywowana' };
             logPtAction(`Oznaczono aktywność na: ${cName}`);
         }
         renderPlaytable();
      };
      menu.appendChild(optMarkAct);

      const optTap = document.createElement("button"); optTap.className = "ai-model-btn"; optTap.style.fontSize = "11px";
      optTap.textContent = cardInst.isTapped ? "Odtapuj (Untap)" : "Ztapuj (Tap)";
      optTap.onclick = () => {
         savePtStateForUndo();
         cardInst.isTapped = !cardInst.isTapped;
         if (cardInst.isTapped) playtableState.lastAction = { instanceId: cardInst.instanceId, type: 'Aktywowana' };
         logPtAction(`${cardInst.isTapped ? 'Ztapowano' : 'Odtapowano'}: ${cName}`);
         renderPlaytable();
      };
      menu.appendChild(optTap);

      const optAttack = document.createElement("button"); optAttack.className = "ai-model-btn"; optAttack.style.fontSize = "11px";
      optAttack.style.color = "var(--bat-color)";
      optAttack.textContent = "⚔️ Atakuj (Zadeklaruj atak)";
      optAttack.onclick = () => {
         savePtStateForUndo();
         cardInst.isTapped = true;
         if (!cardInst.counters.find(c => c.name === "Zadeklarował atak")) {
             cardInst.counters.push({ name: "Zadeklarował atak", value: 1 });
         }
         playtableState.lastAction = { instanceId: cardInst.instanceId, type: 'Aktywowana' };
         logPtAction(`Zadeklarowano atak: ${cName}`);
         renderPlaytable();
      };
      menu.appendChild(optAttack);

      const optFlip = document.createElement("button"); optFlip.className = "ai-model-btn"; optFlip.style.fontSize = "11px";
      optFlip.textContent = cardInst.isFacedown ? "Odkryj (Face up)" : "Zakryj (Face down)";
      optFlip.onclick = () => {
         savePtStateForUndo();
         cardInst.isFacedown = !cardInst.isFacedown;
         logPtAction(`${cardInst.isFacedown ? 'Zakryto (Facedown)' : 'Odkryto (Face up)'}: ${cName}`);
         renderPlaytable();
      };
      menu.appendChild(optFlip);

      // Dołączanie kart (Attachments/Aury/Ekwipunki)
      const siblingZones = isPlayer ? playtableState.playerZones : playtableState.aiZones;
      const otherBfCards = siblingZones.battlefield.filter(c => c.instanceId !== cardInst.instanceId && !c.attachedTo);
      
      if (otherBfCards.length > 0) {
          const optAttach = document.createElement("button"); optAttach.className = "ai-model-btn"; optAttach.style.fontSize = "11px";
          optAttach.textContent = cardInst.attachedTo ? "Odczep kartę" : "Podepnij pod inną kartę...";
          optAttach.onclick = () => {
             if (cardInst.attachedTo) {
                 savePtStateForUndo();
                 cardInst.attachedTo = null;
                 logPtAction(`Odpięto kartę: ${cName}`);
                 renderPlaytable();
             } else {
                 const items = otherBfCards.map(c => {
                     const obj = c.isToken ? { Nazwa: c.name + (c.desc ? ` (${c.desc})` : "") } : (cardMap[c.cardId] || BASIC_LANDS.find(l => l.ID === c.cardId));
                     return { label: obj ? obj.Nazwa : "Nieznana", value: c.instanceId };
                 });
                 showPtCustomModal({
                     type: 'list',
                     title: 'PODEPNIJ POD KARTĘ:',
                     items: items,
                     onConfirm: (targetInstanceId) => {
                         savePtStateForUndo();
                         cardInst.attachedTo = targetInstanceId;
                         const tName = items.find(i => i.value === targetInstanceId)?.label || "innej karty";
                         logPtAction(`Podpięto kartę ${cName} do: ${tName}`);
                         renderPlaytable();
                     }
                 });
             }
          };
          menu.appendChild(optAttach);
      }
  }

  // Zarządzanie licznikami na karcie (Dostępne globalnie, niezależnie od strefy)
  const optCounters = document.createElement("button"); optCounters.className = "ai-model-btn"; optCounters.style.fontSize = "11px";
  optCounters.style.color = "var(--sto-color)";
  optCounters.textContent = "⚙️ Zarządzaj znacznikami...";
  optCounters.onclick = () => {
     showPtCustomModal({
         type: 'counters',
         title: `ZNACZNIKI: ${cName}`,
         counters: JSON.parse(JSON.stringify(cardInst.counters)),
         onConfirm: (newCounters) => {
             savePtStateForUndo();
             cardInst.counters = newCounters;
             logPtAction(`Zaktualizowano znaczniki na: ${cName}`);
             
             // Dynamiczne odświeżenie okna modalnego, jeśli to tam zmienialiśmy znaczniki (np. Exile)
             if (playtableState.currentInspectedZone) {
                 renderPlaytableModalBody();
             }
             renderPlaytable();
         }
     });
  };
  menu.appendChild(optCounters);

  // PRZENOSZENIE: Uniwersalne i zgodne z zasadami MtG menu ruchu (Zapis stref właściciela)
  const moveHeader = document.createElement("div");
  moveHeader.style.cssText = "font-size:9px; color:var(--muted); font-family:var(--font-ui); text-transform:uppercase; padding:4px; border-top:1px solid var(--border); margin-top:2px;";
  moveHeader.textContent = "Miejsce docelowe:";
  menu.appendChild(moveHeader);

  // 1. Pole bitwy (jedyne miejsce, gdzie można przejąć kontrolę nad kartą przeciwnika)
  const btnToPTable = document.createElement("button"); btnToPTable.className = "ai-model-btn"; btnToPTable.style.fontSize = "11px";
  btnToPTable.textContent = "Przenieś na stół Gracza";
  btnToPTable.onclick = () => movePlaytableCard(cardInst.instanceId, zoneName, "player_battlefield");

  const btnToAITable = document.createElement("button"); btnToAITable.className = "ai-model-btn"; btnToAITable.style.fontSize = "11px";
  btnToAITable.textContent = "Przenieś na stół AI";
  btnToAITable.onclick = () => movePlaytableCard(cardInst.instanceId, zoneName, "ai_battlefield");

  // Dynamiczne sortowanie opcji: Domyślna strefa właściciela karty wyświetla się zawsze jako pierwsza
      if (isPlayer) {
          if (zoneName !== 'player_battlefield') menu.appendChild(btnToPTable);
          if (zoneName !== 'ai_battlefield') menu.appendChild(btnToAITable);
      } else {
          if (zoneName !== 'ai_battlefield') menu.appendChild(btnToAITable);
          if (zoneName !== 'player_battlefield') menu.appendChild(btnToPTable);
      }

  // 2. Strefy własne właściciela (zgodnie z MtG: cmentarz, exile, biblioteka i ręka zawsze należą do właściciela!)
  const ownerPrefix = isPlayer ? "player" : "ai";

  if (zKey !== 'hand') {
      const btnToHand = document.createElement("button"); btnToHand.className = "ai-model-btn"; btnToHand.style.fontSize = "11px";
      btnToHand.textContent = "Przenieś do Ręki";
      btnToHand.onclick = () => movePlaytableCard(cardInst.instanceId, zoneName, `${ownerPrefix}_hand`);
      menu.appendChild(btnToHand);
  }
  if (zKey !== 'graveyard') {
      const btnToGy = document.createElement("button"); btnToGy.className = "ai-model-btn"; btnToGy.style.fontSize = "11px";
      btnToGy.textContent = "Przenieś na Cmentarz";
      btnToGy.onclick = () => movePlaytableCard(cardInst.instanceId, zoneName, `${ownerPrefix}_graveyard`);
      menu.appendChild(btnToGy);
  }
  if (zKey !== 'exile') {
      const btnToEx = document.createElement("button"); btnToEx.className = "ai-model-btn"; btnToEx.style.fontSize = "11px";
      btnToEx.textContent = "Przenieś na Wygnanie (Exile)";
      btnToEx.onclick = () => movePlaytableCard(cardInst.instanceId, zoneName, `${ownerPrefix}_exile`);
      menu.appendChild(btnToEx);
  }

  // Biblioteka właściciela (góra/spód)
  const btnToLibTop = document.createElement("button"); btnToLibTop.className = "ai-model-btn"; btnToLibTop.style.fontSize = "11px";
  btnToLibTop.textContent = "Wsuń do Biblioteki (Na górę)";
  btnToLibTop.onclick = () => movePlaytableCard(cardInst.instanceId, zoneName, `${ownerPrefix}_library`, { atTop: true });
  menu.appendChild(btnToLibTop);

  const btnToLibBot = document.createElement("button"); btnToLibBot.className = "ai-model-btn"; btnToLibBot.style.fontSize = "11px";
  btnToLibBot.textContent = "Wsuń do Biblioteki (Na spód)";

  document.body.appendChild(menu);

}

function openPlaytableModal(zoneName, isPlayer, preselectedCards = null) {
  playtableState.currentInspectedZone = { zoneName, isPlayer };
  if (preselectedCards) {
      playtableState.currentInspectedCards = preselectedCards;
  } else {
      const zObj = isPlayer ? playtableState.playerZones : playtableState.aiZones;
      playtableState.currentInspectedCards = [...zObj[zoneName]];
  }

  const modal = document.getElementById("playtable-modal");
  const title = document.getElementById("pt-modal-title");
  const sInput = document.getElementById("pt-modal-search");

  const isLibrary = zoneName === "library";
  const playerPrefix = isPlayer ? "Gracz" : "AI";
  const zoneLabel = { library: "Biblioteka", library_reveal: "Górne karty biblioteki", graveyard: "Cmentarz", exile: "Wygnanie" }[zoneName];

  title.textContent = `Podgląd: ${playerPrefix} - ${zoneLabel}`;
  sInput.style.display = isLibrary ? "block" : "none";
  sInput.value = "";

  sInput.oninput = (e) => {
     const q = e.target.value.toLowerCase().trim();
     if (!q) {
         playtableState.currentInspectedCards = [...zObj[zoneName]];
     } else {
         playtableState.currentInspectedCards = zObj[zoneName].filter(c => {
             const cardObj = cardMap[c.cardId] || BASIC_LANDS.find(l => l.ID === c.cardId);
             return cardObj && cardObj.Nazwa.toLowerCase().includes(q);
         });
     }
     renderPlaytableModalBody();
  };

  renderPlaytableModalBody();
  modal.classList.add("active");
}

function closePlaytableModal() {
  document.getElementById("playtable-modal").classList.remove("active");
  playtableState.currentInspectedZone = null;
  playtableState.currentInspectedCards = [];
}

function renderPlaytableModalBody() {
  const body = document.getElementById("pt-modal-body");
  body.innerHTML = "";

  if (playtableState.currentInspectedCards.length === 0) {
      body.innerHTML = `<div style="text-align:center; padding:30px; color:var(--muted); font-size:14px;">Strefa jest aktualnie pusta.</div>`;
      return;
  }

  const grid = document.createElement("div");
  grid.className = "pt-modal-grid";

  const inspectState = playtableState.currentInspectedZone;
  const sourceZoneFullName = `${inspectState.isPlayer ? 'player' : 'ai'}_${inspectState.zoneName.replace('_reveal','')}`;

  playtableState.currentInspectedCards.forEach(c => {
      const cardObj = c.isToken ? { Nazwa: c.name, isToken: true } : (cardMap[c.cardId] || BASIC_LANDS.find(l => l.ID === c.cardId));
      if (!cardObj) return;

      const tile = document.createElement("div");
      tile.className = "pt-card-item";
      
      const img = document.createElement("img");
      if (c.isToken) {
          img.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='448'><rect width='100%' height='100%' fill='%231f2937'/></svg>";
          const descDiv = document.createElement("div");
          descDiv.style.cssText = "position:absolute; inset:0; padding:10px 5px 25px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:#e5e7eb; font-size:10px; font-family:var(--font); pointer-events:none; overflow:hidden;";
          descDiv.innerHTML = `<div style="color:var(--gold); font-family:var(--font-ui); font-size:14px; margin-bottom:4px; font-weight:bold;">TOKEN</div><div>${(c.desc || '').replace(/\n/g, '<br>')}</div>`;
          tile.appendChild(img);
          tile.appendChild(descDiv);
      } else {
          img.src = getPlaytableFullCardImage(c.cardId);
          tile.appendChild(img);
      }

      const lbl = document.createElement("div");
      lbl.className = "pt-card-lbl";
      lbl.textContent = cardObj.Nazwa;
      tile.appendChild(lbl);

      // Nakładka liczników na karcie (wyświetlana w oknach Exile, Cmentarza itp.)
      if (c.counters && c.counters.length > 0) {
          const badgeBox = document.createElement("div");
          badgeBox.className = "pt-card-counters";
          c.counters.forEach(cnt => {
             let badgeClass = "pt-badge";
             if (cnt.name.includes("+1/+1")) badgeClass += " blue";
             else if (cnt.name.includes("stun") || cnt.name.includes("loyalty")) badgeClass += " gold";
             badgeBox.innerHTML += `<span class="${badgeClass}">${cnt.value}x ${cnt.name}</span>`;
          });
          tile.appendChild(badgeBox);
      }

      attachPtHoverEvents(tile, c.cardId, c.isToken);

      tile.onclick = (e) => {
          showPtCardMenu(c, sourceZoneFullName, e);
      };

      grid.appendChild(tile);
  });

  body.appendChild(grid);
}

function attachPtHoverEvents(element, cardId, isToken = false) {
   const isBasicLand = cardId >= 990001 && cardId <= 990005;
   if (isBasicLand || isToken) return;

   if (isTouchDevice) {
       let startX = 0, startY = 0;
       let swipeActive = false;

       element.ontouchstart = (e) => {
          const t = e.touches[0];
          startX = t.clientX; startY = t.clientY;
          swipeActive = false;
       };
       element.ontouchmove = (e) => {
          const t = e.touches[0];
          const dx = t.clientX - startX; const dy = t.clientY - startY;
          if (Math.sqrt(dx*dx + dy*dy) > 15 && !swipeActive) {
             swipeActive = true;
             e.preventDefault();
             updatePtHoverPreview(cardId, t.clientX, t.clientY, true);
             document.getElementById("pt-hover-preview").style.display = "block";
          }
       };
       element.ontouchend = (e) => {
          if (swipeActive) e.preventDefault();
       };
   } else {
           element.onmouseenter = (e) => {
              updatePtHoverPreview(cardId, e.clientX, e.clientY, false);
              document.getElementById("pt-hover-preview").style.display = "block";
           };
           element.onmousemove = (e) => {
              updatePtHoverPreview(cardId, e.clientX, e.clientY, false);
           };
           element.onmouseleave = () => {
              document.getElementById("pt-hover-preview").style.display = "none";
           };
           element.onwheel = (e) => {
              e.preventDefault();
              const modes = ['fot', 'scryfall', 'kon'];
              const currentIdx = modes.indexOf(playtableState.hoverMode);
              playtableState.hoverMode = modes[(currentIdx + 1) % modes.length];
              updatePtHoverPreview(cardId, e.clientX, e.clientY, false);
           };
       }
}

function serializePtZoneToText(array, isAI, isHand) {
  if (array.length === 0) return "brak";
  
  // Pobieramy wszystkie aktywne karty na stole (Gracza i AI), aby móc wyszukiwać wzajemne podpięcia
  const allBf = [...playtableState.playerZones.battlefield, ...playtableState.aiZones.battlefield];

  return array.map((c, i) => {
     const obj = c.isToken ? { Nazwa: c.name + (c.desc ? ` (${c.desc})` : ""), isToken: true } : (cardMap[c.cardId] || BASIC_LANDS.find(l => l.ID === c.cardId));
     const cName = obj ? obj.Nazwa : "Nieznana Karta";
     
     let lastActionStr = "";
     if (!isHand && playtableState.lastAction && playtableState.lastAction.instanceId === c.instanceId) {
         lastActionStr = ` [OSTATNIO ${playtableState.lastAction.type.toUpperCase()}]`;
     }

     if (isHand) {
         return `${i+1}. [${cName}]`;
     } else {
         let status = [];
         if (c.isToken) status.push("TOKEN");
         if (c.isTapped) status.push("ztapowany");
         if (c.isFacedown) status.push("zakryty rewersem (facedown)");
         
         // 1. Sprawdzamy, czy TA KARTA jest przypięta do innej
         if (c.attachedTo) {
             const targetC = allBf.find(x => x.instanceId === c.attachedTo);
             if (targetC) {
                 const tObj = targetC.isToken ? { Nazwa: targetC.name } : (cardMap[targetC.cardId] || BASIC_LANDS.find(l => l.ID === targetC.cardId));
                 status.push(`podpięta do: ${tObj ? tObj.Nazwa : "Nieznana Karta"}`);
             }
         }
         
         // 2. Sprawdzamy, czy INNE KARTY są przypięte do tej karty
         const attachedToMe = allBf.filter(x => x.attachedTo === c.instanceId);
         if (attachedToMe.length > 0) {
             const attNames = attachedToMe.map(x => {
                 const xObj = x.isToken ? { Nazwa: x.name } : (cardMap[x.cardId] || BASIC_LANDS.find(l => l.ID === x.cardId));
                 return xObj ? xObj.Nazwa : "Nieznana Karta";
             });
             status.push(`podpięte karty: ${attNames.join(", ")}`);
         }

         if (c.counters && c.counters.length > 0) {
             c.counters.forEach(cnt => status.push(`liczniki: ${cnt.value}x ${cnt.name}`));
         }
         const statusStr = status.length > 0 ? ` (${status.join(", ")})` : "";
         return `${i+1}. [${cName}]${statusStr}${lastActionStr}`;
     }
  }).join(", ");
}

async function triggerPlaytableAIQuery() {
  const askBtn = document.getElementById("pt-ask-ai-btn");
  const responseBox = document.getElementById("pt-ai-response-box");

  if (!OPENROUTER_API_KEY.startsWith("sk-")) {
      showPtNotification("Najpierw musisz uzupełnić klucz API OpenRouter w kodzie!");
      return;
  }

  askBtn.disabled = true;
  askBtn.textContent = "GENEROWANIE RUCHU AI...";

  // Resetujemy poprzednie wyniki i błędy przed wysłaniem nowego zapytania
  playtableState.aiError = "";
  playtableState.aiResponse = "";

  // 1. BUDOWANIE RAPORTU O STANIE STOŁU
  const finalPrompt = getPtPromptText();

  const controller = new AbortController();
  const abortBtn = document.createElement("button");
  abortBtn.className = "battle-btn";
  abortBtn.style.cssText = "width: 100%; margin-top: 5px; background: #ff336633; color: #e11d48; border-color: #e11d48;";
  abortBtn.textContent = "PRZERWIJ GENEROWANIE";
  abortBtn.onclick = () => controller.abort();
  
  if (askBtn && askBtn.parentNode) {
      askBtn.parentNode.insertBefore(abortBtn, askBtn.nextSibling);
  }

  try {
    let resultText = "";
    const modelId = playtableState.selectedModel;

    if (modelId === 'external') {
        const extResult = await waitForExternalAI(finalPrompt);
        resultText = extResult.text;
    } else {
                  const r = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                     method: "POST",
                     headers: { "Authorization": `Bearer ${OPENROUTER_API_KEY}`, "Content-Type": "application/json" },
                     body: JSON.stringify({ model: modelId, messages: [{ role: "user", content: finalPrompt }] }),
                     signal: controller.signal
                  });
                  
                  if (!r.ok) {
                      const errorBody = await r.text();
                      let errorMsg = `Błąd HTTP ${r.status}: ${errorBody.substring(0, 200)}`;
                      try {
                          const errJson = JSON.parse(errorBody);
                          if (errJson.error) {
                              let deepMsg = errJson.error.message || '';
                              if (deepMsg.includes("Provider returned error") && errJson.error.metadata && errJson.error.metadata.raw) {
                                  try {
                                      const rawObj = JSON.parse(errJson.error.metadata.raw);
                                      if (rawObj.error && rawObj.error.message) deepMsg = rawObj.error.message;
                                  } catch(errRaw) {
                                      deepMsg = errJson.error.metadata.raw;
                                  }
                              }
                              errorMsg = `Błąd API [${r.status}]: ${deepMsg}`;
                          }
                      } catch(errJsonParse) {}
                      throw new Error(errorMsg);
                  }
                  
                  const data = await r.json();
                  resultText = data.choices[0].message.content.trim();
              }

              playtableState.aiResponse = resultText;
              
              renderPlaytable();
           } catch(e) {
               if (e.name === 'AbortError') {
                   playtableState.aiError = "Generowanie ruchu przerwane przez użytkownika.";
               } else {
                   playtableState.aiError = e.message;
               }
               renderPlaytable();
           } finally {
               if (abortBtn && abortBtn.parentNode) abortBtn.remove();
               if (askBtn) {
                   askBtn.disabled = false;
                   askBtn.textContent = "PYTAJ AI (Generuj ruch)";
               }
           }
        }
