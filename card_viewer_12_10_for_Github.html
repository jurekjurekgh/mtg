        activePanel.innerHTML += `<div class="team-loading" style="text-align:center; padding:20px;">Wyszukiwanie kampanii w chmurze...</div>`;
        dash.appendChild(activePanel);
        content.appendChild(dash);

        if (MANGA_DISC_API_URL.startsWith("http")) {
            fetch(MANGA_DISC_API_URL)
                .then(r => r.json())
                .then(allEntries => {
                    const sessionsMap = {};
                    allEntries.forEach(e => {
                        const sId = String(e.sessionId).trim();
                        if (sId.startsWith("gs_")) {
                            if(!sessionsMap[sId]) sessionsMap[sId] = { id: sId, date: e.timestamp, turns: [] };
                            sessionsMap[sId].turns.push(e);
                        }
                    });
                    gameshowDashboardState.cachedSessions = Object.values(sessionsMap).sort((a,b) => new Date(b.date) - new Date(a.date));
                    renderGameshowDashboard();
                })
                .catch(err => {
                    console.error("Błąd bazy:", err);
                    gameshowDashboardState.cachedSessions = [];
                    renderGameshowDashboard();
                });
        } else {
            gameshowDashboardState.cachedSessions = [];
            renderGameshowDashboard();
        }
        return;
    }

    const sessions = gameshowDashboardState.cachedSessions || [];
    if (sessions.length === 0) {
        activePanel.innerHTML += `<div style="text-align:center; color:var(--muted); font-size:14px; padding:20px;">Brak aktywnych gier w chmurze. Rozpocznij nową powyżej!</div>`;
    } else {
        sessions.forEach(sess => {
                const firstTurn = sess.turns[0];
                const lastTurn = sess.turns[sess.turns.length - 1];
                const startManga = mangaData.find(m => String(m.id).trim() === String(firstTurn.chapterId).trim());
                const currentManga = mangaData.find(m => String(m.id).trim() === String(lastTurn.chapterId).trim());
                
                if (!startManga || !currentManga) return; 

                // Obliczamy rzeczywistą liczbę zadanych pytań w tej sesji
                const setupTurn = sess.turns.find(t => t.text.startsWith("GS_SETUP:"));
                let nPlayers = 4;
                if (setupTurn) {
                    const m = setupTurn.text.match(/numPlayers=(\d+)/);
                    if (m) nPlayers = parseInt(m[1], 10);
                }
                const totalChoices = sess.turns.filter(t => t.text.startsWith("GS_CHOICE:")).length;
                const questionsCount = Math.ceil(totalChoices / nPlayers);

                const row = document.createElement("div");
                row.className = "radio-setup-row";
                row.style.cssText = "width:100%; padding:15px; display:flex; flex-direction:column; cursor:pointer; margin-bottom:12px; border-left:4px solid var(--gold);";
                row.onclick = () => {
                    currentMode = 'gameshow';
                    gameshowState = { sessionId: sess.id, manga: currentManga, justLoaded: true };
                    reconstructGameshowState(sess.turns);
                    renderGameshow();
                };

                row.innerHTML = `
                    <div style="font-family:var(--font-ui); font-size:15px; font-weight:bold; color:var(--text);">${startManga.mangaTitle}</div>
                    <div style="font-size:13px; color:var(--text); margin-top:5px;">
                        Rozpoczęto od: <b>Rozdział ${startManga.chapterNum}</b> | Aktualnie: <b style="color:var(--sto-color);">Rozdział ${currentManga.chapterNum}</b>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px; border-top:1px dashed var(--border); padding-top:8px; flex-wrap:wrap; gap:10px;">
                        <small style="color:var(--muted); font-size:11px; margin-right:15px;">Ostatni ruch: ${new Date(sess.date).toLocaleString()}</small>
                        <small style="color:var(--sto-color); font-weight:bold; font-size:11px;">Ilość zadanych pytań: ${questionsCount}</small>
                    </div>
                `;
                activePanel.appendChild(row);
            });
    }

    dash.appendChild(activePanel);
    content.appendChild(dash);
}

function renderGameshow() {
    const content = document.getElementById("content");
    content.innerHTML = "";
    
    const arena = document.createElement("div");
    arena.className = "arena";
    
    // Header z możliwością wyjścia
    const header = document.createElement("div");
    header.style.cssText = "display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;";
    const abortBtn = document.createElement("button");
    abortBtn.className = "battle-abort-btn";
    abortBtn.style.position = "static";
    abortBtn.textContent = "ZAKOŃCZ TELETURNIEJ";
    abortBtn.onclick = () => { currentMode = 'manga'; renderManga(); };
    header.appendChild(abortBtn);
    arena.appendChild(header);

    const mangaInfo = document.createElement("div");
    mangaInfo.style.cssText = "font-family:var(--font-ui); font-size:24px; color:var(--gold); text-align:center; font-weight:bold; margin-bottom: 20px;";
    const mTitle = gameshowState.manga?.mangaTitle || "Nieznana Manga";
    const mChap = gameshowState.manga?.chapterNum || 1;
    mangaInfo.innerHTML = `🎲 TELETURNIEJ MANGI 🎲<br><span style="font-size:16px; color:var(--text);">${mTitle} - Rozdział ${mChap}</span>`;
    arena.appendChild(mangaInfo);

    if (gameshowState.phase === 'setup') {
        const setupBox = document.createElement("div");
        setupBox.className = "battle-setup";
        setupBox.style.maxWidth = "500px";
        setupBox.style.margin = "0 auto";

        // --- ASYNCHRONICZNE POBIERANIE SESJI Z CHMURY PRZY WEJŚCIU ---
        if (!gameshowState.cachedSessions) {
            setupBox.innerHTML = `<div class="team-loading" style="text-align:center;">Wyszukiwanie zapisanych teleturniejów w bazie...</div>`;
            arena.appendChild(setupBox);
            content.appendChild(arena);
            
            if (MANGA_DISC_API_URL.startsWith("http")) {
                fetch(MANGA_DISC_API_URL)
                    .then(r => r.json())
                    .then(allEntries => {
                        const sessionsMap = {};
                        allEntries.forEach(e => {
                            if (String(e.chapterId).trim() !== String(gameshowState.manga.id).trim()) return;
                            const sId = String(e.sessionId).trim();
                            if (sId.startsWith("gs_")) {
                                if(!sessionsMap[sId]) sessionsMap[sId] = { id: sId, date: e.timestamp, turns: [] };
                                sessionsMap[sId].turns.push(e);
                            }
                        });
                        gameshowState.cachedSessions = Object.values(sessionsMap).sort((a,b) => new Date(b.date) - new Date(a.date));
                        renderGameshow();
                    })
                    .catch(err => {
                        console.error("Błąd ładowania gier z chmury:", err);
                        gameshowState.cachedSessions = [];
                        renderGameshow();
                    });
                return;
            } else {
                gameshowState.cachedSessions = [];
            }
        }

        let existingSessions = gameshowState.cachedSessions || [];

        if (existingSessions.length > 0) {
            setupBox.insertAdjacentHTML('beforeend', `<div style="font-size:12px; color:var(--muted); margin-bottom:10px; width:100%;">WZNÓW POPRZEDNI TELETURNIEJ:</div>`);
            existingSessions.forEach(sess => {
                const rowDiv = document.createElement("div");
                rowDiv.className = "radio-setup-row";
                rowDiv.style.cssText = "width: 100%; padding: 12px; display: flex; flex-direction:column; cursor: pointer; margin-bottom:10px;";
                rowDiv.onclick = () => {
                    gameshowState.sessionId = sess.id;
                    gameshowState.justLoaded = true;
                    reconstructGameshowState(sess.turns);
                    renderGameshow();
                };
                rowDiv.innerHTML = `
                    <b style="color:#ca8a04; font-size:14px;">Teleturniej - ${new Date(sess.date).toLocaleString()}</b>
                    <small style="color:var(--muted); font-size:11px; margin-top:2px;">Wykonanych akcji w bazie: ${sess.turns.length}</small>
                `;
                setupBox.appendChild(rowDiv);
            });
            setupBox.insertAdjacentHTML('beforeend', `<hr style="margin:20px 0; border:none; border-top:1px dashed var(--border); width:100%;">`);
        }

        setupBox.insertAdjacentHTML('beforeend', `<div style="font-size:12px; color:var(--muted); margin-bottom:10px; width:100%;">ZAGRAJ NOWY TELETURNIEJ:</div>`);

        // Ilość graczy
        const pRow = document.createElement("div"); pRow.style.marginBottom = "15px";
        pRow.innerHTML = `<span style="margin-right:10px; font-family:var(--font-ui); color:var(--muted);">ILOŚĆ GRACZY:</span>`;
        const pSel = document.createElement("select"); pSel.className = "filter-select";
        for(let i=2; i<=8; i++) pSel.add(new Option(i, i));
        pSel.value = gameshowState.numPlayers;
        pSel.onchange = e => { 
            gameshowState.numPlayers = parseInt(e.target.value); 
            qSel.value = gameshowState.numPlayers * 2; 
            gameshowState.numQuestions = parseInt(qSel.value);
        };
        pRow.appendChild(pSel); setupBox.appendChild(pRow);

        // Ilość pytań
        const qRow = document.createElement("div"); qRow.style.marginBottom = "15px";
        qRow.innerHTML = `<span style="margin-right:10px; font-family:var(--font-ui); color:var(--muted);">ILOŚĆ PYTAŃ:</span>`;
        const qSel = document.createElement("select"); qSel.className = "filter-select";
        for(let i=1; i<=20; i++) qSel.add(new Option(i, i));
        qSel.value = gameshowState.numPlayers * 2;
        gameshowState.numQuestions = parseInt(qSel.value);
        qSel.onchange = e => gameshowState.numQuestions = parseInt(e.target.value);
        qRow.appendChild(qSel); setupBox.appendChild(qRow);

        // Model do generowania pytań
        const mRow = document.createElement("div"); mRow.style.marginBottom = "20px";
        mRow.innerHTML = `<div style="margin-bottom:5px; font-family:var(--font-ui); color:var(--muted);">MODEL GENERUJĄCY PYTANIA:</div>`;
        const mSel = document.createElement("select"); mSel.className = "filter-select"; mSel.style.width = "100%";
        AI_MODELS.forEach(m => mSel.add(new Option(m.name, m.id)));
        mSel.value = gameshowState.qGenModel;
        mSel.onchange = e => gameshowState.qGenModel = e.target.value;
        mRow.appendChild(mSel); setupBox.appendChild(mRow);

        const genBtn = document.createElement("button");
        genBtn.className = "battle-btn";
        genBtn.style.width = "100%";
        genBtn.style.background = "#fef08a33"; genBtn.style.color = "#ca8a04"; genBtn.style.borderColor = "#ca8a04";
        genBtn.textContent = "STWÓRZ POSTACIE I GENERUJ PYTANIA";
        genBtn.onclick = async () => {
            // Generuj Imiona
            gameshowState.players = [];
            const usedNames = new Set();
            for (let i = 0; i < gameshowState.numPlayers; i++) {
                let name = ""; do { name = mangaDiscNames[Math.floor(Math.random()*mangaDiscNames.length)]; } while(usedNames.has(name));
                usedNames.add(name);
                gameshowState.players.push({ name: name, score: 0, model: "manual" });
            }
            
            gameshowState.phase = 'loading_q';
            gameshowState.abortController = new AbortController();
            renderGameshow();
            
            try {
                const qs = await askAIForQuestions(gameshowState.manga.analiza, gameshowState.qGenModel, true, gameshowState.numQuestions, gameshowState.abortController.signal);
                gameshowState.questions = qs.slice(0, gameshowState.numQuestions);
                
                // Generowanie unikalnej sesji gry
                if (!gameshowState.sessionId) gameshowState.sessionId = "gs_" + Date.now();
                
                // Zapisz konfigurację w chmurze (Zapisujemy również qGenModel, by odtworzyć go bezbłędnie przy wznawianiu)
                postGameshowLog("SYSTEM", "system", `GS_SETUP: numPlayers=${gameshowState.numPlayers}, qGenModel=${gameshowState.qGenModel}, players=${JSON.stringify(gameshowState.players)}, questions=${JSON.stringify(gameshowState.questions)}`);

                if (gameshowState.qGenModel === 'external') {
                    gameshowState.qGenModelIdUsed = batState.genModelId;
                    gameshowState.qGenModelNameUsed = batState.genModelName;
                } else {
                    gameshowState.qGenModelIdUsed = gameshowState.qGenModel;
                    gameshowState.qGenModelNameUsed = AI_MODELS.find(m => m.id === gameshowState.qGenModel)?.name || gameshowState.qGenModel;
                }

                gameshowState.phase = 'round';
                renderGameshow();
            } catch (e) {
                gameshowState.errorMsg = e.name === 'AbortError' ? "Generowanie pytań zostało anulowane na żądanie użytkownika." : e.message;
                gameshowState.phase = 'error_q';
                renderGameshow();
            }
        };
        setupBox.appendChild(genBtn);
        arena.appendChild(setupBox);

    } else if (gameshowState.phase === 'loading_q') {
        arena.innerHTML += `<div style="text-align:center; color:#ca8a04; font-size:18px; margin-top:50px;">
            Przygotowywanie ${gameshowState.numQuestions} pytań przez AI...<br><br>
            <button id="gameshow-qgen-abort" class="battle-btn" style="background:#ff336633; color:#e11d48; border-color:#e11d48; max-width:260px; margin: 20px auto 0;">PRZERWIJ GENEROWANIE</button>
        </div>`;
    } else if (gameshowState.phase === 'error_q') {
        const hasHistory = gameshowState.questions && gameshowState.questions.length > 0;
        const targetPhase = hasHistory ? 'chapter_end' : 'setup';
        const btnText = hasHistory ? "WRÓĆ DO KONSOLI ROZDZIAŁU (ZACHOWAJ STAN)" : "WRÓĆ DO USTAWIEŃ TELETURNIEJU";

        arena.innerHTML += `
        <div style="padding:20px; max-width:800px; margin:50px auto 0; font-family:monospace; font-size:14px; line-height:1.5;">
          <h2 style="color:var(--bat-color); font-family:var(--font-ui); margin-bottom:20px; text-align:center;">BŁĄD GENEROWANIA PYTAŃ</h2>
          <div style="background:#ffe4e6; border:1px solid #fda4af; color:#9f1239; padding:15px; border-radius:8px; white-space:pre-wrap; word-wrap:break-word; margin-bottom: 20px;">${gameshowState.errorMsg}</div>
          <button class="battle-btn" style="width: 100%;" onclick="gameshowState.phase='${targetPhase}'; renderGameshow();">${btnText}</button>
        </div>`;
    } else if (gameshowState.phase === 'round' || gameshowState.phase === 'round_summary' || gameshowState.phase === 'end' || gameshowState.phase === 'final_comments' || gameshowState.phase === 'chapter_end' || gameshowState.phase === 'host_comment') {
        
        // --- 1. RENDEROWANIE TABELI WYNIKÓW (ZAWSZE NA GÓRZE) ---
        let actualPlayerIdx = -1;
        if (gameshowState.phase === 'round') {
            actualPlayerIdx = (gameshowState.roundStartPlayerIdx + gameshowState.currentTurnIdx) % gameshowState.numPlayers;
        } else if (gameshowState.phase === 'final_comments' || gameshowState.phase === 'host_comment') {
            actualPlayerIdx = gameshowState.currentTurnIdx % gameshowState.numPlayers;
        }

        const scoreBoard = document.createElement("div");
        scoreBoard.style.cssText = "display:flex; justify-content:center; gap:15px; flex-wrap:wrap; margin-bottom:20px; position:sticky; top:120px; z-index:40;";
        gameshowState.players.forEach((p, idx) => {
            const pBox = document.createElement("div");
            const isTurn = idx === actualPlayerIdx;
            pBox.style.cssText = `padding: 10px 15px; border-radius: 8px; border: 2px solid ${isTurn ? '#ca8a04' : 'var(--border)'}; background: ${isTurn ? '#fefce8' : 'var(--bg-panel)'}; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1);`;
            pBox.innerHTML = `<div style="font-size:11px; color:var(--muted);">${p.name}</div><div style="font-size:24px; font-weight:bold; color:var(--text);">${p.score}</div>`;
            scoreBoard.appendChild(pBox);
        });
        arena.appendChild(scoreBoard);

        // --- 2. RENDEROWANIE HISTORII ZAKOŃCZONYCH RUND ---
        let questionCounter = 0;
        gameshowState.gameHistory.forEach((h, i) => {
            const histPanel = document.createElement("div"); histPanel.className = "question-panel";
            histPanel.style.cssText = "margin-bottom: 20px; border-color: #10b981;";
            
            const isQuestion = h.opts && h.opts.length === 4;
            if (isQuestion) {
                questionCounter++;
            }
            
            // Warunkowe renderowanie opcji (zabezpieczenie na wypadek braku danych)
            let optionsHtml = "";
            if (isQuestion) {
                optionsHtml = `<div style="margin-top: 10px; font-size: 15px; line-height: 1.6; color: var(--text); border-top: 1px dashed var(--border); padding-top: 10px; text-align: left;">
                        <b>A:</b> ${h.opts ? h.opts[0] || "" : ""}<br><b>B:</b> ${h.opts ? h.opts[1] || "" : ""}<br><b>C:</b> ${h.opts ? h.opts[2] || "" : ""}<br><b>D:</b> ${h.opts ? h.opts[3] || "" : ""}
                    </div>`;
            }

            const roundLabel = isQuestion ? `PYTANIE ${questionCounter}` : "WTRĄCENIE / DYSKUSJA WOLNA";

            let histHtml = `<div style="font-size:12px; color:var(--muted); text-align:center;">${roundLabel}</div>
                <div class="question-text" style="font-size: 20px;"><b style="color:var(--bat-color)">${h.qText}</b></div>
                ${optionsHtml}
                <div style="margin-top: 15px; font-size: 18px; padding: 15px; background: #10b98122; border-radius: 8px; color: var(--text); text-align: center;">
                    PRAWIDŁOWA ODPOWIEDŹ: <b style="font-size: 24px; color: #10b981;">${h.ansLetter}</b>
                </div>
                <div style="margin-top: 20px; font-size: 16px;">`;
            
            h.playerResults.forEach(pr => {
                const resultLabel = pr.ans === 'KOMENTARZ' 
                    ? `<span style="color:var(--sto-color); font-weight:bold;">MOWA KOŃCOWA</span>`
                    : `WYBRAŁ: ${pr.ans} 👉 ${pr.isCorrect ? '<span style="color:#10b981;">+1 PKT</span>' : '<span style="color:#ff3366;">0 PKT</span>'}`;
                
                histHtml += `<div style="margin-bottom:15px; border-bottom:1px solid var(--border); padding-bottom:15px;">
                    <div style="font-family: var(--font-ui); color: #ca8a04; font-weight: bold; margin-bottom: 5px;">${pr.name} ${pr.modelName !== 'Manual' ? `<span style="font-size:10px; font-weight:normal; color:var(--muted);">(${pr.modelName})</span>` : ''}:</div>
                    <div style="font-family: 'Inter', sans-serif; font-size: 20px; line-height: 1.5; color: var(--text); margin-bottom: 10px;">${pr.reasoning.replace(/\n/g, '<br>')}</div>
                    <div style="font-weight:bold; color:var(--text); font-family:var(--font-ui);">${resultLabel}</div>
                </div>`;
            });
            histHtml += `</div>`;
            histPanel.innerHTML = histHtml;
            arena.appendChild(histPanel);
        });

        // --- 3. RENDEROWANIE OBECNEJ RUNDY (JEŚLI TRWA) ---
        if (gameshowState.phase === 'round') {
            const curQ = gameshowState.questions[gameshowState.currentQIdx];
            
            if (!curQ) {
                // Awaryjne wycofanie: brak zdefiniowanego pytania w pamięci.
                // Zapobiegamy awarii strony i cofamy grę do bezpiecznego stanu konfiguracji etapu.
                gameshowState.phase = 'chapter_end';
                renderGameshow();
                return;
            }
            
            // Panel Pytania
            const qPanel = document.createElement("div"); qPanel.className = "question-panel";
            qPanel.id = "active-round-panel";
            qPanel.style.borderColor = "var(--bat-color)";
            
            qPanel.innerHTML = `<div style="font-size:12px; color:var(--muted); text-align:center;">PYTANIE ${gameshowState.currentQIdx + 1} / ${gameshowState.questions.length}</div>
                <div class="question-text" style="font-size: 20px;"><b style="color:var(--bat-color)">${curQ.q}</b></div>
                <div style="font-size: 16px; line-height: 1.6; color: var(--text);">
                      <b>A:</b> ${curQ.opts ? curQ.opts[0] || "" : ""}<br><b>B:</b> ${curQ.opts ? curQ.opts[1] || "" : ""}<br><b>C:</b> ${curQ.opts ? curQ.opts[2] || "" : ""}<br><b>D:</b> ${curQ.opts ? curQ.opts[3] || "" : ""}
                    </div>`;
            
            // Ocena pytań (jak w bitwie)
            const ratingPanel = document.createElement("div"); ratingPanel.className = "rating-scale";
            ratingPanel.innerHTML = `<div class="rating-scale-label">Oceń pytanie:</div>`;
            for(let i=0; i<=5; i++) {
               const btn = document.createElement("button"); btn.className = "scale-btn"; btn.textContent = i;
               if (curQ.rated === i) btn.classList.add("selected");
               if (curQ.rated !== undefined) btn.disabled = true;
               btn.onclick = () => {
              if (curQ.rated !== undefined) return;
              curQ.rated = i;
              const modelId = gameshowState.qGenModelIdUsed; 
              if (modelId && modelId !== "undefined") {
                  initAiModelScore(modelId);
                  let oldAvg = aiScores[modelId].qAvg || 0;
                  let oldCount = aiScores[modelId].qCount || 0;
                  aiScores[modelId].qAvg = ((oldAvg * oldCount) + i) / (oldCount + 1);
                  aiScores[modelId].qCount = oldCount + 1;
                  saveAIScores();
              }
              ratingPanel.querySelectorAll('.scale-btn').forEach(b => { b.disabled = true; if(b.textContent == i) b.classList.add("selected"); });
           };
               ratingPanel.appendChild(btn);
            }
            qPanel.appendChild(ratingPanel);

            // Czat Rundy (Wypowiedzi graczy)
            const chatBox = document.createElement("div");
            chatBox.style.cssText = "margin-top: 20px; border-top: 1px dashed var(--border); padding-top: 20px;";
            gameshowState.roundChat.forEach(rc => {
                const msg = document.createElement("div");
                msg.className = "radio-msg";
                const safeAns = rc.ans >= 0 && rc.ans <= 3 ? ['A','B','C','D'][rc.ans] : 'BRAK (PUDŁO)';
                msg.innerHTML = `<div class="radio-name"><span>${rc.name} ${rc.modelName !== 'Manual' ? `<span style="font-size:10px; font-weight:normal; color:var(--muted);">(${rc.modelName})</span>` : ''}</span></div>
                                 <div class="radio-text">${rc.text.replace(/\n/g, '<br>')}</div>
                                 <div style="margin-top:10px; font-weight:bold; color:#ca8a04; font-family:var(--font-ui);">WYBRAŁ: ${safeAns}</div>`;
                chatBox.appendChild(msg);
            });
            qPanel.appendChild(chatBox);

            if (gameshowState.phase === 'round') {
                const curPlayer = gameshowState.players[actualPlayerIdx];
                const actionBox = document.createElement("div");
                actionBox.id = "gameshow-active-controls";
                actionBox.style.cssText = "margin-top: 20px; padding: 15px; border: 2px dashed #ca8a04; border-radius: 8px;";
                
                actionBox.innerHTML = `<div style="text-align:center; font-family:var(--font-ui); color:var(--muted); margin-bottom:10px;">Teraz odpowiada: <b style="color:#ca8a04; font-size:18px;">${curPlayer.name}</b></div>`;
                
                const mSel = document.createElement("select"); mSel.className = "filter-select"; mSel.style.width = "100%"; mSel.style.marginBottom = "15px";
                mSel.add(new Option("👤 GRACZ MANUALNY (Zaznaczam sam)", "manual"));
                AI_MODELS.forEach(m => mSel.add(new Option(m.name, m.id)));
                mSel.value = curPlayer.model;
                mSel.onchange = e => curPlayer.model = e.target.value;
                actionBox.appendChild(mSel);

                const btnArea = document.createElement("div");
                
                const renderManualBtns = () => {
                    btnArea.innerHTML = "";
                    curQ.opts.forEach((optText, idx) => {
                        const btn = document.createElement("button"); btn.className = "answer-btn"; btn.style.marginBottom = "5px";
                        btn.innerHTML = `<b>${['A','B','C','D'][idx]}:</b> ${optText}`;
                        btn.onclick = () => {
                            const letterCode = ['A','B','C','D'][idx];
                            postGameshowLog(curPlayer.name, "manual", `GS_CHOICE:${letterCode}|||(Gracz Manualny kliknął odpowiedź)`);
                            
                            gameshowState.roundChat.push({ name: curPlayer.name, text: "(Gracz Manualny kliknął odpowiedź)", ans: idx, modelId: "manual", modelName: "Manual" });
                            gameshowState.currentTurnIdx++;
                            if (gameshowState.currentTurnIdx >= gameshowState.numPlayers) resolveGameshowRound();
                            else renderGameshow();
                        };
                        btnArea.appendChild(btn);
                    });
                };

                const renderAIBtn = () => {
                    btnArea.innerHTML = "";

async function playGameshowAITurn(player, curQ, actionBox) {
    const btn = actionBox.querySelector("button");
    const originalText = btn.textContent;
    btn.textContent = "AI MYŚLI..."; btn.disabled = true;
    
    const controller = new AbortController();
    const abortBtn = document.createElement("button");
    abortBtn.className = "battle-btn";
    abortBtn.style.cssText = "width: 100%; margin-top: 10px; background: #ff336633; color: #e11d48; border-color: #e11d48; font-size: 12px;";
    abortBtn.textContent = "PRZERWIJ GENEROWANIE";
    abortBtn.onclick = () => controller.abort();
    actionBox.appendChild(abortBtn);

    const isFinalPhase = gameshowState.phase === 'final_comments';
    const isHostIntervention = gameshowState.phase === 'host_comment';
    const isCommentary = isFinalPhase || isHostIntervention;

    // 1. Pobieramy unikalne numery rozdziałów w kolejności ich faktycznego pojawiania się w grze
    const playedChapters = [];
    gameshowState.gameHistory.forEach(h => {
        if (h.chapterNum !== undefined && !playedChapters.includes(h.chapterNum)) {
            playedChapters.push(h.chapterNum);
        }
    });

    // 2. Dodajemy aktualnie grany rozdział na koniec chronologicznej listy
    const currentChapter = gameshowState.manga.chapterNum;
    if (!playedChapters.includes(currentChapter)) {
        playedChapters.push(currentChapter);
    }

    // 3. Wybieramy wyłącznie dwa ostatnio rozegrane rozdziały (poprzedni i aktualny)
    const allowedChapters = playedChapters.slice(-2);

    // 4. Filtrujemy historię do tych dwóch rozdziałów
    const filteredHistory = gameshowState.gameHistory.filter(h => 
        h.chapterNum === undefined || allowedChapters.includes(h.chapterNum)
    );

    // Obliczamy absolutne numery właściwych pytań (ignorując wtrącenia) w pełnej historii gry
    let absoluteQuestionCounter = 0;
    const absoluteQuestionNumbers = new Map();
    gameshowState.gameHistory.forEach(item => {
        const isQ = item.opts && item.opts.length === 4;
        if (isQ) {
            absoluteQuestionCounter++;
            absoluteQuestionNumbers.set(item, absoluteQuestionCounter);
        }
    });

    // Ograniczona historia rund przesyłana do AI (z zachowaniem poprawnej, bezwzględnej numeracji pytań)
    let historyText = filteredHistory.map(h => {
        const isQ = h.opts && h.opts.length === 4;
        let roundStr = "";
        
        if (isQ) {
            const qNum = absoluteQuestionNumbers.get(h) || 1;
            roundStr = `[PYTANIE ${qNum}]\nTreść pytania: ${h.qText}\nPoprawna odpowiedź: ${h.ansLetter}\nPrzebieg tury:\n`;
        } else {
            roundStr = `[WTRĄCENIE / DYSKUSJA WOLNA]\nTemat: ${h.qText}\nPrzebieg rozmowy:\n`;
        }

        h.playerResults.forEach(pr => {
            if (isQ) {
                roundStr += `- ${pr.name} (Wybór: ${pr.ans}, ${pr.isCorrect ? "Trafiony" : "Pudło"}): "${pr.reasoning}"\n`;
            } else {
                roundStr += `- ${pr.name}: "${pr.reasoning}"\n`;
            }
        });
        return roundStr;
    }).join("\n\n");
    if (!historyText) historyText = "Brak wcześniejszych rund.";

    // Przygotowanie aktualnej tabeli punktacyjnej dla AI
    const scoreText = gameshowState.players.map(p => `- ${p.name}: ${p.score} pkt`).join("\n");

    // Historia czatu w danej rundzie
    let currentRoundHistory = gameshowState.roundChat.map(rc => {
        if (isCommentary) return `${rc.name} podsumował: "${rc.text}"`;
        const safeAns = rc.ans >= 0 && rc.ans <= 3 ? ['A','B','C','D'][rc.ans] : 'BRAK';
        return `${rc.name} uważa, że to ${safeAns} i mówi: "${rc.text}"`;
    }).join("\n\n");
    
    if (!currentRoundHistory) {
        currentRoundHistory = isCommentary ? "Jesteś pierwszym wypowiadającym się w tej turze." : "Jesteś pierwszym odpowiadającym w tej rundzie.";
    }

    let prompt = "";
    
    if (isFinalPhase) {
        const sorted = [...gameshowState.players].sort((a,b)=>b.score-a.score);
        const resultsStr = sorted.map((p, i) => `${i+1}. ${p.name} - ${p.score} pkt`).join("\n");
        
        prompt = `Jesteś uczestnikiem teleturnieju wiedzowego o mandze.
Wcielasz się w postać o imieniu: ${player.name}. Teleturniej właśnie się zakończył.

WYNIKI KOŃCOWE:
${resultsStr}

HISTORIA CAŁEJ GRY (Pytania, odpowiedzi i wypowiedzi graczy):
${historyText}

Co powiedzieli inni gracze w podsumowaniu przed tobą:
${currentRoundHistory}

ZADANIE:
Skomentuj końcowe wyniki całego teleturnieju. Bądź krytyczny wobec wypowiedzi innych graczy i nie bierz ich za pewnik - oni tak jak ty mogą się mylić. Nawiązuj też do dotychczasowej historii gry - doceniaj trafne odpowiedzi w przeszłości i punktuj nieprawdziwe argumenty innych. Nie konfabuluj, bądź uczciwy - odnoś się do twardych faktów z historii rozgrywki. Jeśli sam się myliłeś nie bój przyznać się do błędu.
Maksymalna długość odpowiedzi: około 200 słów.

ZWRÓĆ WYNIK W FORMACIE JSON jako obiekt z kluczem: "comment" (twoja wypowiedź).
    PAMIĘTAJ: Ty nazywasz się ${player.name} i wypowiadasz się wyłącznie we własnym imieniu! Nie odgrywaj ról ani nie generuj wypowiedzi za innych graczy.
    Przykład: {"comment": "treść wypowiedzi"}`;

    } else if (isHostIntervention) {
        const hostText = gameshowState.roundChat[0]?.text || "(brak wtrącenia)";
        prompt = `Jesteś uczestnikiem teleturnieju wiedzowego o mandze.
Wcielasz się w postać o imieniu: ${player.name}. 

AKTUALNA TABELA WYNIKÓW (PUNKTACJA GRACZY):
${scoreText}

Prowadzący wtrącił się do programu i powiedział:
"${hostText}"

Co powiedzieli inni gracze w reakcji na słowa prowadzącego przed tobą:
${currentRoundHistory}

HISTORIA POPRZEDNICH RUND (Pokaże ci jak ty i przeciwnicy odpowiadaliście i jakich argumentów używaliście w poprzednich pytaniach):
${historyText}

ZADANIE:
Odnieś się do słów prowadzącego oraz komentarzy innych graczy. Możesz skomentować swoją aktualną pozycję w tabeli wyników, kłócić się o poprzednie pytania lub po prostu wejść w swobodną, naturalną dyskusję. Bądź krytyczny, nie bierz słów innych za pewnik. Nie konfabuluj, odnoś się do faktów z historii gry.
Maksymalna długość odpowiedzi: około 200 słów.

ZWRÓĆ WYNIK W FORMACIE JSON jako obiekt z kluczem: "comment" (twoja wypowiedź).
    PAMIĘTAJ: Ty nazywasz się ${player.name} i wypowiadasz się wyłącznie we własnym imieniu! Nie odgrywaj ról ani nie generuj wypowiedzi za innych graczy.
    Przykład: {"comment": "treść wypowiedzi"}`;

    } else {
        prompt = `Jesteś uczestnikiem teleturnieju wiedzowego o mandze.
Wcielasz się w postać o imieniu: ${player.name}. Gra z tobą jeszcze ${gameshowState.numPlayers - 1} innych graczy. Twoim zadaniem jest poprawne odpowiadanie na pytania, aby zdobyć punkty i wygrać.

AKTUALNA TABELA WYNIKÓW (PUNKTACJA GRACZY):
${scoreText}

HISTORIA POPRZEDNICH RUND (Pokaże ci jak ty i przeciwnicy odpowiadaliście i jakich argumentów używaliście w poprzednich pytaniach):
${historyText}

OBECNA RUNDA:
TEMAT PYTANIA: Manga ${gameshowState.manga.mangaTitle} - Rozdział ${gameshowState.manga.chapterNum}
Pytanie: ${curQ.q}
A: ${curQ.opts[0]}
B: ${curQ.opts[1]}
C: ${curQ.opts[2]}
D: ${curQ.opts[3]}

Co powiedzieli inni gracze w tej rundzie przed tobą:
${currentRoundHistory}

ZADANIE:
Zastanów się nad poprawną odpowiedzią. Opieraj się TYLKO na tym co na pewno wiesz. Jeśli nie znasz odpowiedzi na pytanie to jasno to powiedz i spróbuj wytypować odpowiedź opierając się na poszlakach, dotychczasowych pytaniach albo odpowiedziach innych graczy. UWAGA! Jasno opisz swój tok myślowy. 
Bądź krytyczny wobec wypowiedzi innych graczy i nie bierz ich za pewnik - oni tak jak ty mogą się mylić. Nawiązuj też do dotychczasowej historii gry - doceniaj trafne odpowiedzi w przeszłości i punktuj nieprawdziwe argumenty innych. Nie konfabuluj, bądź uczciwy - odnoś się do twardych faktów z historii rozgrywki. Jeśli sam się myliłeś nie bój przyznać się do błędu.
Odpowiedź powinna mieć maksymalnie do 200 słów.

ZWRÓĆ WYNIK W FORMACIE JSON jako obiekt z kluczami: "reasoning" (twoja krótka wypowiedź) oraz "final_answer" (jedna litera wybranej odpowiedzi: A, B, C lub D).
    PAMIĘTAJ: Ty nazywasz się ${player.name} i odpowiadasz wyłącznie we własnym imieniu! Nie odgrywaj ról ani nie generuj wypowiedzi za innych graczy.
    Przykład: {"reasoning": "treść wypowiedzi", "final_answer": "A"}`;
    }

    try {
        let text = "";
        let finalModelName = player.model;

        if (player.model === "external") {
            const extResult = await waitForExternalAI(prompt);
            text = extResult.text;
            finalModelName = extResult.modelName;
            
            // Rejestracja ukrytego ID modelu zew. do punktacji
            player.lastUsedExternalId = extResult.modelId;
        } else {
            const resp = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${OPENROUTER_API_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({ model: player.model, messages: [{ role: "user", content: prompt }] }),
                signal: controller.signal
            });
            if (!resp.ok) {
                const errorBody = await resp.text();
                throw new Error(`Błąd API ${resp.status}: ${errorBody.substring(0, 150)}`);
            }
            const data = await resp.json();
            text = data.choices[0].message.content.trim();
        }

        // Parsowanie JSON (agresywne czyszczenie)
        text = text.replace(/```json/g, '').replace(/```/g, '').trim();
        let objStart = text.indexOf('{'); let objEnd = text.lastIndexOf('}');
        if (objStart !== -1 && objEnd !== -1) text = text.substring(objStart, objEnd + 1);
        text = text.replace(/([\{,]\s*)'([^']+)'(\s*:)/g, '$1"$2"$3').replace(/([\[{,:]\s*)'(.*?)'(?=\s*[,}\]])/g, (m, p1, p2) => p1 + '"' + p2.replace(/"/g, '\\"') + '"').replace(/,(?=\s*[\]}])/g, "");
        
        let resultObj;
        try {
            resultObj = JSON.parse(text);
        } catch (e) {
            try {
                // Próba parsowania jako surowy obiekt JavaScript (Function)
                resultObj = (new Function("return " + text.replace(/(?<![:\[,])"(?![:\],}])/g, "'")))();
            } catch (e2) {
                // Jeśli oba podejścia zawiodą, zgłaszamy błąd formatowania
                throw new Error(`Błąd formatowania JSON (Otrzymano nieczytelną strukturę).\n\nSUROWA ODPOWIEDŹ AI:\n${text}`);
            }
        }

        // Walidacja struktury obiektu i obecności wymaganych pól
        if (isCommentary) {
            const commentText = resultObj.comment || resultObj.reasoning;
            if (!commentText || commentText.trim() === "") {
                throw new Error(`Błąd struktury JSON (Brak klucza 'comment' lub 'reasoning' z treścią komentarza).\n\nSUROWA ODPOWIEDŹ AI:\n${text}`);
            }
            resultObj.comment = commentText;

            // Zapisz odpowiedź w chmurze
            if (isHostIntervention) {
                postGameshowLog(player.name, player.model, `GS_COMMENT: ${resultObj.comment}`);
            }

            gameshowState.roundChat.push({
                name: player.name,
                text: resultObj.comment,
                ans: -1,
                modelId: player.model,
                modelName: finalModelName
            });
            
            gameshowState.currentTurnIdx++;
            if (gameshowState.currentTurnIdx >= gameshowState.numPlayers) {
                if (isFinalPhase) {
                    gameshowState.gameHistory.push({
                        qText: "Końcowe Podsumowanie Teleturnieju (Mowy Końcowe)",
                        ansLetter: "BRAK (Finał)",
                        playerResults: gameshowState.roundChat.map(rc => ({
                            name: rc.name,
                            ans: "KOMENTARZ",
                            isCorrect: true,
                            reasoning: rc.text,
                            modelName: rc.modelName
                        })),
                        chapterNum: gameshowState.manga.chapterNum
                    });
                    gameshowState.phase = 'end';
                } else {
                    // isHostIntervention (Koniec komentarzy do wtrącenia prowadzącego)
                    gameshowState.gameHistory.push({
                        qText: "Wtrącenie Prowadzącego",
                        ansLetter: "BRAK",
                        playerResults: gameshowState.roundChat.map(rc => ({
                            name: rc.name,
                            ans: "KOMENTARZ",
                            isCorrect: true,
                            reasoning: rc.text,
                            modelName: rc.modelName
                        })),
                        chapterNum: gameshowState.manga.chapterNum
                    });
                    gameshowState.roundChat = [];
                    gameshowState.currentTurnIdx = 0; // KRYTYCZNY RESET KOLEJKI PO REAKCJI NA HOST_COMMENT!
                    // Jeśli nie ma więcej pytań z tego rozdziału, lądujemy w chapter_end
                    if (gameshowState.currentQIdx >= gameshowState.questions.length) {
                        gameshowState.phase = 'chapter_end';
                    } else {
                        gameshowState.phase = 'round';
                    }
                }
            }
            renderGameshow();
            return;
        }

        // Sprawdzenie i normalizacja klucza final_answer
        const rawAns = resultObj.final_answer ? String(resultObj.final_answer).toUpperCase().trim() : "";
        if (!rawAns || !['A', 'B', 'C', 'D'].includes(rawAns)) {
            throw new Error(`Błąd struktury JSON (Brak poprawnego klucza 'final_answer' lub zadeklarowana wartość nie jest z zakresu A-D).\n\nSUROWA ODPOWIEDŹ AI:\n${text}`);
        }

        // Sprawdzenie obecności reasoning
        const reasonText = resultObj.reasoning;
        if (!reasonText || reasonText.trim() === "") {
            throw new Error(`Błąd struktury JSON (Brak klucza 'reasoning' z uzasadnieniem odpowiedzi).\n\nSUROWA ODPOWIEDŹ AI:\n${text}`);
        }

        resultObj.final_answer = rawAns;
        resultObj.reasoning = reasonText;

        const letterMap = {'A':0, 'B':1, 'C':2, 'D':3};
        let ansIdx = letterMap[resultObj.final_answer];

        // Zapis ID do punktacji na koniec rundy (Zapisujemy bezpośrednio na obiekcie player)
        player.lastActiveModelId = (player.model === 'external') ? player.lastUsedExternalId : player.model;

        // Zapisz odpowiedź w chmurze
        postGameshowLog(player.name, player.model, `GS_CHOICE:${resultObj.final_answer}|||${resultObj.reasoning}`);

        // Auto-Commit do logów rundy i przejście do następnego gracza
        gameshowState.roundChat.push({
            name: player.name,
            text: resultObj.reasoning,
            ans: ansIdx,
            modelId: player.model,
            modelName: finalModelName
        });
        
        gameshowState.currentTurnIdx++;
        if (gameshowState.currentTurnIdx >= gameshowState.numPlayers) {
            resolveGameshowRound();
        } else {
            renderGameshow();
        }

    } catch (e) {
        abortBtn.remove();
        if (e.name === 'AbortError') {
             actionBox.innerHTML += `<div style="background:#ffe4e6; border:1px solid #fda4af; color:#9f1239; padding:15px; border-radius:8px; margin-top:15px; font-size:14px; text-align:center;">Przerwano na żądanie użytkownika.</div>`;
        } else {
             actionBox.innerHTML += `<div style="background:#ffe4e6; border:1px solid #fda4af; color:#9f1239; padding:15px; border-radius:8px; margin-top:15px; font-size:13px; text-align:left; white-space:pre-wrap; font-family:monospace; word-break:break-all;">Błąd przetwarzania odpowiedzi:\n\n${e.message}</div>`;
        }
        const retryBtn = document.createElement("button"); retryBtn.className = "battle-btn"; retryBtn.style.marginTop = "10px"; retryBtn.style.width = "100%";
        retryBtn.textContent = "Spróbuj ponownie";
        retryBtn.onclick = () => renderGameshow();
        actionBox.appendChild(retryBtn);
    }
}

function resolveGameshowRound() {
    const curQ = gameshowState.questions[gameshowState.currentQIdx];
    const correctLetter = ['A','B','C','D'][curQ.ans];
    
    let resObjList = [];

    gameshowState.roundChat.forEach(rc => {
        const isCorrect = rc.ans === parseInt(curQ.ans, 10);
        if (isCorrect) {
            const pObj = gameshowState.players.find(p => p.name === rc.name);
            if (pObj) pObj.score++;
        }
        const safeAns = rc.ans >= 0 && rc.ans <= 3 ? ['A','B','C','D'][rc.ans] : 'BRAK';
        resObjList.push({ name: rc.name, ans: safeAns, isCorrect: isCorrect, reasoning: rc.text, modelName: rc.modelName });

        // Zapis do tabeli wyników AI, jeśli to nie gracz manualny
        const pStateObj = gameshowState.players.find(p => p.name === rc.name);
        if (pStateObj && pStateObj.model !== "manual" && pStateObj.lastActiveModelId) {
            initAiModelScore(pStateObj.lastActiveModelId);
            if (isCorrect) aiScores[pStateObj.lastActiveModelId].aUp++;
            else aiScores[pStateObj.lastActiveModelId].aDown++;
            saveAIScores();
        }
    });

    gameshowState.gameHistory.push({
        qText: curQ.q,
        ansLetter: correctLetter,
        opts: [...curQ.opts], // Kopiujemy opcje odpowiedzi
        playerResults: resObjList,
        chapterNum: gameshowState.manga.chapterNum
    });

    // Przeskok na następne pytanie lub podsumowanie rozdziału
    gameshowState.currentQIdx++;
    if (gameshowState.currentQIdx >= gameshowState.questions.length) {
        gameshowState.phase = 'chapter_end';
        gameshowState.roundStartPlayerIdx = (gameshowState.roundStartPlayerIdx + 1) % gameshowState.numPlayers;
        gameshowState.currentTurnIdx = 0;
        gameshowState.roundChat = [];
        
        // Po prostu zapamiętujemy obecnie ukończony rozdział jako domyślny, bez żadnego automatycznego podbijania
        gameshowState.targetChapterNum = gameshowState.manga.chapterNum;
    } else {
        gameshowState.roundStartPlayerIdx = (gameshowState.roundStartPlayerIdx + 1) % gameshowState.numPlayers;
        gameshowState.currentTurnIdx = 0;
        gameshowState.roundChat = [];
        gameshowState.phase = 'round';
    }

    renderGameshow();
}

function postGameshowLog(agent, model, text) {
    if (MANGA_DISC_API_URL.startsWith("http") && gameshowState.sessionId) {
        fetch(MANGA_DISC_API_URL, {
            method: "POST", mode: "no-cors",
            body: JSON.stringify({
                sessionId: gameshowState.sessionId,
                chapterId: gameshowState.manga?.id || "",
                agent: agent,
                model: model,
                text: text
            })
        });
    }
}

function reconstructGameshowState(turns) {
    gameshowState.players = [];
    gameshowState.questions = [];
    gameshowState.gameHistory = [];
    gameshowState.roundChat = [];
    gameshowState.currentQIdx = 0;
    gameshowState.currentTurnIdx = 0;
    gameshowState.roundStartPlayerIdx = 0;
    gameshowState.phase = 'round';

    turns.forEach(t => {
            if (t.text.startsWith("GS_SETUP:")) {
                const clean = t.text.replace("GS_SETUP:", "").trim();
                const numMatch = clean.match(/numPlayers=(\d+)/);
                if (numMatch) gameshowState.numPlayers = parseInt(numMatch[1]);
                
                // Odtwarzanie modelu, który wygenerował te pytania
                const modelMatch = clean.match(/qGenModel=(.*?)(?=\s*,\s*players=|$)/);
                if (modelMatch) {
                    gameshowState.qGenModel = modelMatch[1].trim();
                    gameshowState.qGenModelIdUsed = gameshowState.qGenModel;
                    gameshowState.qGenModelNameUsed = AI_MODELS.find(m => m.id === gameshowState.qGenModel)?.name || gameshowState.qGenModel;
                }

                // Parsowanie struktury graczy (bezpieczne odcięcie przed polem pytań)
                const playersMatch = clean.match(/players=(\[.*?\])(?=\s*,\s*questions=|$)/);
                if (playersMatch) {
                    let pClean = playersMatch[1].trim().replace(/&quot;/g, '"').replace(/\\"/g, '"');
                    try { 
                        gameshowState.players = JSON.parse(pClean); 
                    } catch(e){
                        try { gameshowState.players = (new Function("return " + pClean))(); } catch(e2){}
                    }
                }

                // Parsowanie struktury pytań (jeśli zostały połączone w jednym wierszu bazy)
                const questionsMatch = clean.match(/questions=(\[.*\])$/);
                if (questionsMatch) {
                    let qClean = questionsMatch[1].trim()
                        .replace(/&quot;/g, '"')
                        .replace(/&ldquo;/g, '"')
                        .replace(/&rdquo;/g, '"')
                        .replace(/“/g, '"')
                        .replace(/”/g, '"')
                        .replace(/\\"/g, '"');
                    try { 
                        let parsedQs = JSON.parse(qClean);
                        if (Array.isArray(parsedQs)) {
                            parsedQs = parsedQs.map(q => { q.opts = q.opts || q.Opts || q.options || q.Options || []; return q; });
                        }
                        gameshowState.questions = parsedQs;
                    } catch(e){
                        try { 
                            let parsedQs = (new Function("return " + qClean))(); 
                            if (Array.isArray(parsedQs)) {
                                parsedQs = parsedQs.map(q => { q.opts = q.opts || q.Opts || q.options || q.Options || []; return q; });
                            }
                            gameshowState.questions = parsedQs;
                        } catch(e2){}
                    }
                }
            }
            else if (t.text.startsWith("GS_QUESTIONS:")) {
                let clean = t.text.replace("GS_QUESTIONS:", "").trim();
                
                // Pancerne czyszczenie i dekodowanie znaków (zabezpieczenie przed modyfikacją cudzysłowów przez Google Sheets)
                clean = clean
                    .replace(/&quot;/g, '"')
                    .replace(/&ldquo;/g, '"')
                    .replace(/&rdquo;/g, '"')
                    .replace(/“/g, '"')
                    .replace(/”/g, '"')
                    .replace(/\\"/g, '"');

                try {
                    let parsedQs = JSON.parse(clean);
                    if (Array.isArray(parsedQs)) {
                        parsedQs = parsedQs.map(q => { q.opts = q.opts || q.Opts || q.options || q.Options || []; return q; });
                    }
                    gameshowState.questions = [...gameshowState.questions, ...parsedQs];
                } catch(e){
                    // Niezwykle tolerancyjny fallback silnika JS na wypadek uszkodzenia struktury JSON w chmurze
                    try {
                        let parsedQs = (new Function("return " + clean))();
                        if (Array.isArray(parsedQs)) {
                            parsedQs = parsedQs.map(q => { q.opts = q.opts || q.Opts || q.options || q.Options || []; return q; });
                            gameshowState.questions = [...gameshowState.questions, ...parsedQs];
                        }
                    } catch(e2) {
                        console.error("Błąd parsowania pytań:", e2);
                    }
                }

                // Przywrócenie fazy rundy, jeśli po dodaniu pytań wciąż są niezagrane pozycje
                if (gameshowState.currentQIdx < gameshowState.questions.length) {
                    gameshowState.phase = 'round';
                }
            }
        else if (t.text.startsWith("GS_CHOICE:")) {
            const clean = t.text.replace("GS_CHOICE:", "").trim();
            const parts = clean.split("|||");
            const letter = parts[0] ? parts[0].trim().toUpperCase() : "";
            const letterMap = {'A':0, 'B':1, 'C':2, 'D':3};
            const ansIdx = letterMap[letter] !== undefined ? letterMap[letter] : -1;
            const reasoning = parts.slice(1).join("|||");
            
            const curQ = gameshowState.questions[gameshowState.currentQIdx];
            
            // Dynamiczne przywrócenie ostatnio aktywnego modelu dla tego gracza
            const pObj = gameshowState.players.find(p => p.name === t.agent);
            if (pObj) {
                pObj.model = t.model;
                pObj.lastActiveModelId = t.model;
            }
            
            gameshowState.roundChat.push({
                name: t.agent,
                text: reasoning,
                ans: ansIdx,
                modelId: t.model,
                modelName: AI_MODELS.find(m => m.id === t.model)?.name || t.model
            });
            
            gameshowState.currentTurnIdx++;
                    if (gameshowState.currentTurnIdx >= gameshowState.numPlayers) {
                        // Rozstrzygnięcie rundy wewnątrz parsera (Zabezpieczone przed błędem undefined curQ)
                        const curQ = gameshowState.questions[gameshowState.currentQIdx];
                        let resObjList = [];
                        gameshowState.roundChat.forEach(rc => {
                            const isCorrect = curQ ? (rc.ans === parseInt(curQ.ans, 10)) : false;
                            if (isCorrect) {
                                const pObj = gameshowState.players.find(p => p.name === rc.name);
                                if (pObj) pObj.score++;
                            }
                            const safeAns = rc.ans >= 0 && rc.ans <= 3 ? ['A','B','C','D'][rc.ans] : 'BRAK';
                            resObjList.push({ name: rc.name, ans: safeAns, isCorrect: isCorrect, reasoning: rc.text, modelName: rc.modelName });
                        });
                        
                        const turnManga = mangaData.find(m => String(m.id).trim() === String(t.chapterId).trim());
                        const tChapterNum = turnManga ? turnManga.chapterNum : (gameshowState.manga?.chapterNum || 1);

                        gameshowState.gameHistory.push({
                            qText: curQ ? curQ.q : "Pytanie archiwalne (Błąd odczytu struktury pytania z bazy)",
                            ansLetter: curQ ? ['A','B','C','D'][curQ.ans] : "BRAK",
                            opts: curQ ? [...curQ.opts] : ["-", "-", "-", "-"],
                            playerResults: resObjList,
                            chapterNum: tChapterNum
                        });
                        
                        gameshowState.currentQIdx++;
                        gameshowState.roundStartPlayerIdx = (gameshowState.roundStartPlayerIdx + 1) % gameshowState.numPlayers;
                        gameshowState.currentTurnIdx = 0;
                        gameshowState.roundChat = [];
                        
                        // Jeśli wyczerpano pytania, faza przechodzi w chapter_end
                        if (gameshowState.currentQIdx >= gameshowState.questions.length) {
                            gameshowState.phase = 'chapter_end';
                            gameshowState.targetChapterNum = gameshowState.manga.chapterNum;
                        }
                    }
        }
        else if (t.text.startsWith("GS_HOST:")) {
            const clean = t.text.replace("GS_HOST:", "").trim();
            gameshowState.phase = 'host_comment';
            gameshowState.roundChat = [{
                name: "🎙️ PROWADZĄCY",
                text: clean,
                ans: -1,
                modelId: "user",
                modelName: "Manual"
            }];
            gameshowState.currentTurnIdx = 0;
        }
        else if (t.text.startsWith("GS_COMMENT:")) {
                    const clean = t.text.replace("GS_COMMENT:", "").trim();
                    
                    // Przywracamy model, który ostatnio komentował za tego gracza
                    const pObj = gameshowState.players.find(p => p.name === t.agent);
                    if (pObj) {
                        pObj.model = t.model;
                        pObj.lastActiveModelId = t.model;
                    }

                    gameshowState.roundChat.push({
                        name: t.agent,
                        text: clean,
                        ans: -1,
                        modelId: t.model,
                        modelName: AI_MODELS.find(m => m.id === t.model)?.name || t.model
                    });
                    gameshowState.currentTurnIdx++;
                    if (gameshowState.currentTurnIdx >= gameshowState.numPlayers) {
                        // Package Host comment round into history
                        const turnManga = mangaData.find(m => String(m.id).trim() === String(t.chapterId).trim());
                        const tChapterNum = turnManga ? turnManga.chapterNum : (gameshowState.manga?.chapterNum || 1);

                        gameshowState.gameHistory.push({
                            qText: "Wtrącenie Prowadzącego",
                            ansLetter: "BRAK",
                            playerResults: gameshowState.roundChat.map(rc => ({
                                name: rc.name,
                                ans: "KOMENTARZ",
                                isCorrect: true,
                                reasoning: rc.text,
                                modelName: rc.modelName
                            })),
                            chapterNum: tChapterNum
                        });
                        gameshowState.roundChat = [];
                        gameshowState.currentTurnIdx = 0; // KRYTYCZNY RESET W PARSERZE REKONSTRUKCJI DLA GS_COMMENT!
                        // Jeśli nie ma więcej pytań z tego rozdziału, lądujemy w chapter_end
                        if (gameshowState.currentQIdx >= gameshowState.questions.length) {
                            gameshowState.phase = 'chapter_end';
                            gameshowState.targetChapterNum = gameshowState.manga?.chapterNum || 1;
                        } else {
                            gameshowState.phase = 'round';
                        }
                    }
                }
    });

    // Końcowa weryfikacja poprawności fazy po odtworzeniu wszystkich logów
    if (gameshowState.currentQIdx < gameshowState.questions.length && gameshowState.phase === 'chapter_end') {
        gameshowState.phase = 'round';
    }
}

function showPtNotification(msg) {
  const existing = document.getElementById("pt-toast");
  if (existing) existing.remove();
  
  const toast = document.createElement("div");
  toast.id = "pt-toast";
  toast.style.cssText = "position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(17,24,39,0.95); color:#fff; padding:10px 20px; border-radius:8px; border:1px solid var(--gold); font-family:var(--font-ui); font-size:13px; z-index:3000; box-shadow:0 4px 15px rgba(0,0,0,0.5); pointer-events:none; transition:opacity 0.3s; opacity:0;";

function showPtCustomModal(config) {
  const existing = document.getElementById("pt-custom-modal");
  if (existing) existing.remove();

  const overlay = document.createElement("div");
  overlay.id = "pt-custom-modal";
  overlay.className = "pt-dialog-overlay active";

  const box = document.createElement("div");
  box.className = "pt-dialog-box";

  const title = document.createElement("div");
  title.className = "pt-dialog-title";
  title.textContent = config.title;
  box.appendChild(title);

  const content = document.createElement("div");
  content.style.cssText = "display:flex; flex-direction:column; gap:10px; max-height:60vh; overflow-y:auto;";
  
  let inputEl = null;

  if (config.type === 'confirm') {
      const msg = document.createElement("div");
      msg.style.cssText = "font-size:14px; color:var(--text); text-align:center; line-height:1.5;";
      msg.textContent = config.content;
      content.appendChild(msg);
  } else if (config.type === 'input') {
      inputEl = document.createElement("input");
      inputEl.className = "pt-dialog-input";
      inputEl.placeholder = config.placeholder || "";
      inputEl.value = config.defaultVal || "";
      if (config.inputType) inputEl.type = config.inputType;
      content.appendChild(inputEl);
      setTimeout(() => inputEl.focus(), 100);
      
      inputEl.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
              config.onConfirm(inputEl.value);
              overlay.remove();
          }
      });
  } else if (config.type === 'counters') {
      const listDiv = document.createElement("div");
      listDiv.style.cssText = "display:flex; flex-direction:column; gap:8px;";
      
      const renderList = () => {
          listDiv.innerHTML = "";
          if (config.counters.length === 0) {
              listDiv.innerHTML = `<div style="text-align:center; color:var(--muted); font-size:12px; padding:10px;">Brak znaczników. Dodaj nowy poniżej.</div>`;
          }
          config.counters.forEach((c, idx) => {
              const row = document.createElement("div");
              row.className = "pt-counter-row";
              
              const nDiv = document.createElement("div");
              nDiv.className = "pt-counter-name";
              nDiv.textContent = c.name;
              
              const ctrl = document.createElement("div");
              ctrl.className = "pt-counter-controls";
              
              const btnMinus = document.createElement("button");
              btnMinus.className = "sub-filter-btn"; btnMinus.textContent = "-";
              btnMinus.onclick = () => {
                  c.value--;
                  if (c.value <= 0) config.counters.splice(idx, 1);
                  renderList();
              };
              
              const valDiv = document.createElement("div");
              valDiv.style.cssText = "font-weight:bold; min-width:20px; text-align:center; color:var(--text); font-size:14px;";
              valDiv.textContent = c.value;
              
              const btnPlus = document.createElement("button");
              btnPlus.className = "sub-filter-btn"; btnPlus.textContent = "+";
              btnPlus.onclick = () => { c.value++; renderList(); };
              
              const btnDel = document.createElement("button");
              btnDel.className = "sub-filter-btn"; btnDel.style.borderColor = "var(--bat-color)"; btnDel.style.color = "var(--bat-color)"; btnDel.textContent = "🗑️";
              btnDel.onclick = () => { config.counters.splice(idx, 1); renderList(); };

              ctrl.appendChild(btnMinus); ctrl.appendChild(valDiv); ctrl.appendChild(btnPlus); ctrl.appendChild(btnDel);
              row.appendChild(nDiv); row.appendChild(ctrl);
              listDiv.appendChild(row);
          });
      };
      renderList();
      content.appendChild(listDiv);

      const addRow = document.createElement("div");
      addRow.style.cssText = "display:flex; gap:5px; margin-top:10px; border-top:1px dashed var(--border); padding-top:10px;";
      const newNameInput = document.createElement("input");
      newNameInput.className = "pt-dialog-input"; newNameInput.style.flex = "1"; newNameInput.placeholder = "Nazwa nowego znacznika...";
      const newAddBtn = document.createElement("button");
      newAddBtn.className = "battle-btn"; newAddBtn.style.padding = "0 15px"; newAddBtn.textContent = "DODAJ";
      newAddBtn.onclick = () => {
          const nn = newNameInput.value.trim();
          if (nn) {
              const exist = config.counters.find(x => x.name === nn);
              if (exist) exist.value++; else config.counters.push({name: nn, value: 1});
              newNameInput.value = "";
              renderList();
          }
      };
      
      newNameInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") newAddBtn.click();
      });

      addRow.appendChild(newNameInput); addRow.appendChild(newAddBtn);
      content.appendChild(addRow);
  } else if (config.type === 'token_form') {
      const nameInput = document.createElement("input");
      nameInput.className = "pt-dialog-input";
      nameInput.placeholder = "Nazwa (np. Goblin)";
      if (config.defaultName) nameInput.value = config.defaultName;
      content.appendChild(nameInput);
      
      const descInput = document.createElement("textarea");
      descInput.className = "pt-dialog-input";
      descInput.style.minHeight = "80px";
      descInput.style.fontFamily = "var(--font)";
      descInput.style.resize = "vertical";
      descInput.placeholder = "Opis / Zdolności (np. 1/1, Haste)";
      if (config.defaultDesc) descInput.value = config.defaultDesc;
      content.appendChild(descInput);
      
      setTimeout(() => {
          nameInput.focus();
          // Jeśli wpisano już nazwę z pamięci, zaznaczamy ją całą by łatwo było napisać nową jeśli zajdzie potrzeba
          if (nameInput.value) nameInput.select();
      }, 100);
      config.getValues = () => ({ name: nameInput.value, desc: descInput.value });
  } else if (config.type === 'list') {
          config.items.forEach((item) => {
              const btn = document.createElement("button");
          btn.className = "battle-btn";
          btn.style.cssText = "width:100%; text-align:left; font-size:13px; padding:10px;";
          btn.textContent = item.label;
          btn.onclick = () => {
              config.onConfirm(item.value);
              overlay.remove();
          };
          content.appendChild(btn);
      });
  }

  box.appendChild(content);

  const btns = document.createElement("div");
  btns.className = "pt-dialog-buttons";
  
  const cancelBtn = document.createElement("button");
  cancelBtn.className = "battle-btn";
  cancelBtn.style.cssText = "background: #ff336633; color: #e11d48; border-color: #e11d48; flex:1;";
  cancelBtn.textContent = config.cancelText || "ANULUJ";
  cancelBtn.onclick = () => {
      if (config.onCancel) config.onCancel();
      overlay.remove();
  };
  btns.appendChild(cancelBtn);

  if (config.type !== 'list') {
      const okBtn = document.createElement("button");
      okBtn.className = "battle-btn";
      okBtn.style.cssText = "background: #10b98133; color: var(--lor-color); border-color: var(--lor-color); flex:1;";
      okBtn.textContent = config.okText || "ZATWIERDŹ";
      okBtn.onclick = () => {
          if (config.type === 'input') config.onConfirm(inputEl ? inputEl.value : '');
          else if (config.type === 'token_form') config.onConfirm(config.getValues());
          else if (config.type === 'counters') config.onConfirm(config.counters);
          else if (config.type === 'confirm') config.onConfirm();
          overlay.remove();
      };
      btns.appendChild(okBtn);
  }

  box.appendChild(btns);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

async function loadPlaytableDecks() {
  if (playtableState.cachedDecks) return playtableState.cachedDecks;
  
  let defaultDecks = [
    { name: "Starter Deck (Mono Red)", cardIds: [990004,990004,990004,990004,990004,990004,990004,990004,990004,990004] }
  ];
  
  const saved = localStorage.getItem("mtgPlaytableDecks");
  if (saved) {
     try { defaultDecks = JSON.parse(saved); } catch(e){}
  }

  if (DECK_API_URL.startsWith("http")) {
             try {
               // Dodany znacznik czasu całkowicie omija cache przeglądarki
               const r = await fetch(DECK_API_URL + "?action=get_decks&_=" + Date.now());
               const cloudData = await r.json();
               if (Array.isArray(cloudData) && cloudData.length > 0) {
                   // Odfiltrowujemy talie, które zostały wyczyszczone do pustych wartości
                   defaultDecks = cloudData.filter(d => {
                       const c = d.cardIds;
                       return c && c !== "" && !(Array.isArray(c) && (c.length === 0 || c[0] === ""));
                   });
                   localStorage.setItem("mtgPlaytableDecks", JSON.stringify(defaultDecks));
               }
             } catch(e) { console.warn("Nie udało się załadować talii z chmury:", e); }
          }

  // Bezpieczny automatyczny generator, jeśli z jakiegoś powodu baza talii jest pusta
      if (defaultDecks.length === 0 && cards.length > 0) {
          const firstTenBase = cards.filter(c => c.isBase).slice(0, 10).map(c => c.ID);
          defaultDecks.push({ name: "Automatyczny Starter", cardIds: [...firstTenBase, 990001, 990002, 990003, 990004, 990005] });
      }

      defaultDecks.sort((a, b) => a.name.localeCompare(b.name));

      playtableState.cachedDecks = defaultDecks;
      return defaultDecks;
}

async function savePlaytableDeckCloud(name, cardIds) {
  const list = await loadPlaytableDecks();
  
  const currentPlayerDeckName = list[playtableState.selectedPlayerDeckIndex]?.name;
  const currentAIDeckName = list[playtableState.selectedAIDeckIndex]?.name;

  const idx = list.findIndex(d => d.name === name);
  if (idx !== -1) {
      list[idx].cardIds = cardIds;
  } else {
      list.push({ name, cardIds });
  }
  
  list.sort((a, b) => a.name.localeCompare(b.name));
  
  if (currentPlayerDeckName) playtableState.selectedPlayerDeckIndex = Math.max(0, list.findIndex(d => d.name === currentPlayerDeckName));
  if (currentAIDeckName) playtableState.selectedAIDeckIndex = Math.max(0, list.findIndex(d => d.name === currentAIDeckName));

  localStorage.setItem("mtgPlaytableDecks", JSON.stringify(list));
  playtableState.cachedDecks = list;

  if (DECK_API_URL.startsWith("http")) {
         fetch(DECK_API_URL, {
            method: "POST", mode: "no-cors",
            body: JSON.stringify({ action: "save_deck", deckName: name, cardIds: cardIds.join(";") }),
            headers: { "Content-Type": "text/plain;charset=utf-8" }
         }).catch(e => console.error("Błąd zapisu talii w chmurze:", e));
      }
}

     aiCounters: playtableState.aiCounters,
     playerZones: playtableState.playerZones,

function movePlaytableCard(instanceId, sourceZoneName, targetZoneName, options = {}) {
  savePtStateForUndo();
  // Parsowanie nazw stref np. 'player_hand' na obiekt stanu
  const parseZone = (fullName) => {
      const parts = fullName.split("_");
      const isPlayer = parts[0] === 'player';
      const zoneKey = parts[1]; // library, hand, battlefield, graveyard, exile
      const zObj = isPlayer ? playtableState.playerZones : playtableState.aiZones;
      return { isPlayer, zoneKey, array: zObj[zoneKey] };
  };

  const src = parseZone(sourceZoneName);
  const tgt = parseZone(targetZoneName);

  const idx = src.array.findIndex(c => c.instanceId === instanceId);
  if (idx === -1) return;

  const cardInst = src.array.splice(idx, 1)[0];

  // Zdejmujemy tymczasowe znaczniki bitewne przy KAŻDEJ zmianie strefy (lub zmianie kontrolera)
  cardInst.counters = cardInst.counters.filter(c => c.name !== "summoning sickness" && c.name !== "Zadeklarował atak");

  // Czyszczenie pewnych zmiennych fizycznych przy przejściu do stref nieaktywnych
  if (tgt.zoneKey !== 'battlefield') {
      cardInst.isTapped = false;
      cardInst.isFacedown = false;
      cardInst.attachedTo = null;
      // Usuwamy załączniki z innych kart podpiętych pod tę kartę
      const siblingZones = tgt.isPlayer ? playtableState.playerZones : playtableState.aiZones;
      siblingZones.battlefield.forEach(c => {
         if (c.attachedTo === instanceId) c.attachedTo = null;
      });
  }

  const cObj = cardMap[cardInst.cardId] || BASIC_LANDS.find(l => l.ID === cardInst.cardId);
  const cName = cObj ? cObj.Nazwa : "Nieznana Karta";

  const srcLabel = {library:"Biblioteka", hand:"Ręka", battlefield:"Stół", graveyard:"Cmentarz", exile:"Wygnanie"}[src.zoneKey];
  const tgtLabel = {library:"Biblioteka", hand:"Ręka", battlefield:"Stół", graveyard:"Cmentarz", exile:"Wygnanie"}[tgt.zoneKey];
  const playerLabel = src.isPlayer ? "Gracz" : "AI";
  const targetPlayerLabel = tgt.isPlayer ? "Gracz" : "AI";

  logPtAction(`Przeniesiono: ${cName} z ${srcLabel} (${playerLabel}) do ${tgtLabel} (${targetPlayerLabel})`);

  // Zgodnie z zasadami MtG (122.2): Karta zmieniająca strefę traci wszystkie swoje znaczniki.
  // Wyjątek: zmiana kontrolera w obrębie samego stołu zachowuje modyfikacje.
  if (src.zoneKey !== tgt.zoneKey) {
      cardInst.counters = [];
  } else {
      cardInst.counters = cardInst.counters.filter(c => c.name !== "summoning sickness" && c.name !== "Zadeklarował atak");
  }

  if (options.faceDown) {
      cardInst.isFacedown = true;
  }

  if ((cardInst.isToken || cardInst.cardId >= 990006) && tgt.zoneKey !== 'battlefield') {
      // Reguły MtG: Tokeny i karty specjalne (np. Undercity) przestają istnieć, gdy opuszczają pole bitwy.
      // Został wyciągnięty ze strefy źródłowej, więc po prostu go nigdzie nie wklejamy (wyparowuje).
  } else {
      if (tgt.zoneKey === 'library') {
          if (options.atBottom) {
              tgt.array.unshift(cardInst);
          } else {
              tgt.array.push(cardInst);
          }
      } else {
          if (options.atBottom) {
              tgt.array.push(cardInst);
          } else {
              tgt.array.unshift(cardInst);
          }
      }
  }

  if (tgt.zoneKey === 'battlefield') {
      playtableState.lastAction = { instanceId: cardInst.instanceId, type: 'Zagrana' };
      // Oczyszczamy poprzednie summoning sickness (gdyby karta wróciła np. z exile), a następnie dodajemy
      cardInst.counters = cardInst.counters.filter(c => c.name !== "summoning sickness");
      const isBasicLand = cardInst.cardId >= 990001 && cardInst.cardId <= 990008;
      if (!isBasicLand && !cardInst.isToken) {
          cardInst.counters.push({ name: "summoning sickness", value: 1 });
      }
  }

  // Automatyczny reset widoku modalnego, jeśli manipulowaliśmy wewnątrz Inspektora
  if (playtableState.currentInspectedZone) {
      const inspectState = playtableState.currentInspectedZone;
      if (inspectState.zoneName === 'library_reveal') {
          // Usuwamy z okna (modala) tylko przeniesioną kartę, zachowując resztę wirtualnego podglądu
          playtableState.currentInspectedCards = playtableState.currentInspectedCards.filter(c => c.instanceId !== instanceId);
      } else {
          const currentZObj = inspectState.isPlayer ? playtableState.playerZones : playtableState.aiZones;
          playtableState.currentInspectedCards = [...currentZObj[inspectState.zoneName]];
      }
      renderPlaytableModalBody();
  }

  renderPlaytable();
}

               if (idx !== -1) {

      builderSection.appendChild(contentsDiv);

      // 5. Przeglądanie bazy (Dropdowns i Search)

      const filterWrapper = document.createElement("div");

      sInput.oninput = e => {
         playtableState.dbSearchQuery = e.target.value;
         updateDbList();

      const setSel = document.createElement("select");
      setSel.className = "filter-select";
      setSel.style.flex = "1";

      setSel.add(new Option("Wszystkie Sety", "all"));
      const sets = [...new Set(cards.filter(c => c.isBase).map(c => c.Set).filter(Boolean))].sort();
      sets.forEach(s => setSel.add(new Option(s, s)));
      setSel.value = playtableState.dbFilterSet;
      setSel.onchange = e => {
         playtableState.dbFilterSet = e.target.value;
         updateDbList();

      const planSel = document.createElement("select");

      planSel.style.minWidth = "100px";
      planSel.add(new Option("Wszystkie Plany", "all"));
      const plans = [...new Set(cards.filter(c => c.isBase).map(c => c.Plan).filter(Boolean))].sort();
      plans.forEach(p => planSel.add(new Option(p, p)));
      planSel.value = playtableState.dbFilterPlan;
      planSel.onchange = e => {
         playtableState.dbFilterPlan = e.target.value;
         updateDbList();

      filterWrapper.appendChild(sInput);
      filterWrapper.appendChild(setSel);
      filterWrapper.appendChild(planSel);
      builderSection.appendChild(filterWrapper);

      const dbList = document.createElement("div");
      dbList.className = "pt-db-card-list";

      function updateDbList() {
         dbList.innerHTML = "";
         const q = playtableState.dbSearchQuery.toLowerCase().trim();
         
         const filtered = cards.filter(c => {
            if (!c.isBase) return false;
            if (c.dfcSide === 'B') return false;
            if (playtableState.dbFilterSet !== 'all' && c.Set !== playtableState.dbFilterSet) return false;
            if (playtableState.dbFilterPlan !== 'all' && c.Plan !== playtableState.dbFilterPlan) return false;
            if (q && !c.Nazwa.toLowerCase().includes(q)) return false;

         });

         filtered.sort((a,b) => a.Nazwa.localeCompare(b.Nazwa));

               playtableState.activeDeckCards.push(c.ID); 
               updateDbList();
               renderDeckContents();
               updateDeckStats();
            };
            controls.appendChild(minus); controls.appendChild(countSpan); controls.appendChild(plus);

         });

      // Dynamiczna aktualizacja panelu statystyk (bez przeładowywania ekranu - zlicza lądy oddzielnie)
      function updateDeckStats() {
         let colorCounts = { W: 0, U: 0, B: 0, R: 0, G: 0, Bezbarwne: 0 };
         let basicLandsCount = 0;
         playtableState.activeDeckCards.forEach(id => {
            // Zliczamy lądy podstawowe (990001 - 990005)
            if (id >= 990001 && id <= 990005) {
                basicLandsCount++;
                return;
            }
            
            const c = cardMap[id];
            if (c) {
                const col = c.Colors || "";
                if (col.includes("W")) colorCounts.W++;
                if (col.includes("U")) colorCounts.U++;
                if (col.includes("B")) colorCounts.B++;
                if (col.includes("R")) colorCounts.R++;
                if (col.includes("G")) colorCounts.G++;
                if (!col) colorCounts.Bezbarwne++;
