name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testy jednostkowe (równoległy runner, ADR 0019)
        run: node tools/run-tests.mjs all
      - name: Build artefaktu
        run: node tools/build.mjs
      - name: Publikacja pliku do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: mtg-table
          path: dist/mtg-table.html
